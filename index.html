const topics=[{"id": "A", "title": "10.A Basic Hydrology", "icon": "🌧️", "why": "Convert rainfall into runoff and hydrographs. The book emphasizes the Rational Method for small drainage areas, SCS Curve Number for runoff depth, unit hydrographs for timing, and Horton infiltration.", "important": ["Recognize whether the question asks for peak flow (Rational) or runoff depth (SCS CN).", "Use rainfall intensity at the time of concentration.", "Composite runoff coefficient must be area-weighted.", "Higher CN / more impervious cover means more runoff.", "Unit hydrograph scales linearly; urbanization makes peaks earlier and higher."], "formulas": [["Rational Method", "Q = C i A", "Peak runoff; US: i in in/hr, A in acres → Q ≈ cfs"], ["Composite C", "C = Σ(CⱼAⱼ)/ΣAⱼ", "Mixed land cover"], ["SCS storage", "S = 1000/CN − 10", "S in inches"], ["SCS runoff", "Q = (P − 0.2S)²/(P + 0.8S)", "Use Q=0 if P ≤ 0.2S"], ["Lag", "tlag = 0.6 tc", "Watershed response delay"], ["Time to peak", "tp = D/2 + tlag", "Unit hydrograph"], ["Triangular UH peak", "Qp = 484 A Q/tp", "A mi², Q in, tp hr, Qp cfs"], ["Horton infiltration", "f = fc + (f0 − fc)e^(−kt)", "Capacity decays toward fc"]], "example": {"q": "A 12-acre site has C=0.55 and i=2.5 in/hr. Find peak runoff.", "steps": ["Identify peak runoff → use Rational Method.", "Q = CiA = 0.55×2.5×12.", "Q = 16.5 cfs."], "tip": "Do not convert acres to ft² when using the book's US Rational form."}}, {"id": "B", "title": "10.B Basic Hydraulics", "icon": "🌊", "why": "Open-channel flow, flow regime, energy, weirs, and Bernoulli. Manning and Froude are the headline tools.", "important": ["Hydraulic radius is area divided by wetted perimeter; exclude free surface.", "Manning: larger n means lower velocity.", "Critical flow has Fr=1 and minimum specific energy.", "Normal depth generally requires trial/iteration.", "For pressure-pipe energy problems, combine Bernoulli with continuity and head loss."], "formulas": [["Manning velocity", "V = (k/n)R^(2/3)S^(1/2)", "k=1.486 US, 1.0 SI"], ["Discharge", "Q = VA", "Continuity"], ["Hydraulic radius", "R = A/P", "P = wetted perimeter"], ["Specific energy", "E = y + V²/(2g)", "Open channel"], ["Critical depth", "yc = (q²/g)^(1/3)", "Rectangular; q=Q/b"], ["Froude", "Fr = V/√(gD)", "<1 subcritical; >1 supercritical"], ["Rectangular weir", "Q = (2/3)Cd√(2g)LH^(3/2)", "Sharp-crested"], ["Bernoulli + loss", "P1/γ+z1+V1²/2g = P2/γ+z2+V2²/2g+hf", "Add pump/turbine heads as needed"]], "example": {"q": "A 3 m wide rectangular channel flows 1.2 m deep. Find R.", "steps": ["A=by=3×1.2=3.6 m².", "P=b+2y=3+2.4=5.4 m.", "R=A/P=3.6/5.4=0.667 m."], "tip": "The top water surface is not part of wetted perimeter."}}, {"id": "C", "title": "10.C Pumps", "icon": "⚙️", "why": "Pump power, system curves, NPSH/cavitation, series/parallel pumps, and affinity laws.", "important": ["Input power is water power divided by efficiency.", "Operating point is where pump curve intersects system curve.", "NPSHA must exceed NPSHR to avoid cavitation.", "Series adds head; parallel adds flow.", "Affinity: Q∝N, h∝N², P∝N³."], "formulas": [["Pump input power", "P = γQh/η", "SI gives watts"], ["System curve", "hsys = hstatic + KQ²", "Static + friction"], ["NPSH available", "NPSHA = (patm−pv)/γ − zs − hf", "Book form for suction system"], ["Affinity flow", "Q2/Q1=N2/N1", "Same impeller"], ["Affinity head", "h2/h1=(N2/N1)²", "Speed change"], ["Affinity power", "P2/P1=(N2/N1)³", "Speed change"]], "example": {"q": "Pump: Q=0.04 m³/s, h=25 m, η=0.75. Find input power.", "steps": ["Water power = γQh = 9810×0.04×25 = 9810 W.", "Input = 9810/0.75 = 13,080 W.", "≈13.1 kW."], "tip": "Efficiency divides because motor input must exceed useful water power."}}, {"id": "D", "title": "10.D Water Distribution Systems", "icon": "🚰", "why": "Pressurized pipe head loss, series/parallel networks, Hardy Cross concepts, demand, fire flow, storage, and pressure.", "important": ["Hazen-Williams C: larger C means smoother pipe (opposite trend from Manning n).", "Series pipes carry same Q and losses add.", "Parallel branches have equal head loss; flow splits by resistance.", "Design for peak demand / fire conditions, not average only.", "1 psi ≈ 2.31 ft of water head."], "formulas": [["Hazen-Williams velocity", "V = k₁ C R^0.63 S^0.54", "k₁=1.318 US, 0.849 SI"], ["HW head loss (US)", "hf = 4.73 L Q^1.852/(C^1.852 D^4.87)", "Q cfs, L/D ft"], ["Continuity at node", "ΣQin = ΣQout", "Network mass balance"], ["Loop balance", "ΣhL = 0", "Hardy Cross principle"], ["Fire storage", "V = Qfire × duration", "Use consistent units"], ["Pressure head", "h(ft) = 2.31 × psi", "Water"]], "example": {"q": "A zone must provide 1,500 gpm fire flow for 2 hr. Find fire storage.", "steps": ["Convert time: 2 hr = 120 min.", "V = 1500×120 = 180,000 gal."], "tip": "Fire flow is a rate; storage is rate × duration."}}, {"id": "E", "title": "10.E Flood Control", "icon": "🏞️", "why": "Spillways, detention/retention, reservoir routing, levees/floodways, return period and project-life risk.", "important": ["Storage attenuates floods; levees convey rather than store.", "Detention lowers/delays peak but generally passes the storm volume.", "A 100-year flood means 1% annual exceedance probability, not once every century.", "Reservoir routing follows continuity I−O=dS/dt.", "Weir/spillway discharge varies with H^(3/2)."], "formulas": [["Spillway/weir", "Q = C L H^(3/2)", "Book gives C≈3.33 US, 1.84 SI for rectangular weir form"], ["Storage change", "ΔS = (Qin−Qout)Δt", "Simple continuity"], ["Attenuation", "(Qp,in−Qp,out)/Qp,in", "Fraction peak reduction"], ["Annual exceedance", "p = 1/T", "Return period T"], ["Life-cycle risk", "R = 1 − (1 − 1/T)^n", "At least one exceedance in n years"], ["Weibull plotting", "T = (n+1)/m", "m-th largest in n years"]], "example": {"q": "What is the 30-year risk of at least one 100-year flood?", "steps": ["p=1/100=0.01 per year.", "R=1−(0.99)^30.", "R≈0.260 = 26%."], "tip": "Do not use n/T as the exact risk."}}, {"id": "F", "title": "10.F Stormwater", "icon": "🌧️", "why": "Site peak runoff, gutters/inlets/storm sewers, detention storage, and first-flush water-quality BMPs.", "important": ["Rational Method is the peak-flow workhorse for small sites.", "Storm sewer full-pipe hydraulic radius is D/4.", "Maintain self-cleansing velocity and avoid excessive scour velocity.", "Detention storage is area between inflow and outflow hydrographs.", "Peak control and water-quality volume are separate design criteria."], "formulas": [["Peak runoff", "Q = CiA", "Small drainage areas"], ["Gutter flow", "Q = (0.56/n) Sx^(5/3) S^(1/2) T^(8/3)", "Book US gutter form"], ["Storm sewer Manning", "Q = (1.486/n) A R^(2/3) S^(1/2)", "US full pipe; R=D/4"], ["Detention estimate", "Storage ≈ (Qin−Qout)t", "Convert time to seconds for cfs"], ["Volumetric coefficient", "Rv = 0.05 + 0.009I", "I = percent impervious"], ["Water quality volume", "WQv = (P/12)RvA", "P in, A ac → ac-ft"]], "example": {"q": "Qin=14 cfs, allowed Qout=6 cfs for 20 min. Estimate storage.", "steps": ["Excess=8 cfs.", "20 min=1200 s.", "Storage≈8×1200=9,600 ft³."], "tip": "cfs requires seconds, not minutes."}}, {"id": "G", "title": "10.G Collection Systems", "icon": "🕳️", "why": "Sanitary sewer types, gravity sewer Manning design, self-cleansing, partial-flow behavior, I/I, peaking, and manhole/invert slopes.", "important": ["Sanitary and storm systems are kept separate to avoid CSO/plant overload.", "Gravity sewers behave as open channels and use Manning.", "Self-cleansing velocity is about 2 ft/s (0.6 m/s) in the book review.", "At half-full circular flow, R=D/4; velocity equals full-flow velocity at same slope/n, but Q is half.", "I/I adds unwanted flow; Harmon factor peaks sanitary design flow."], "formulas": [["Manning sewer", "V=(k/n)R^(2/3)S^(1/2)", "Gravity sewer"], ["Minimum slope", "S=[Vn/(kR^(2/3))]²", "From Manning for target V"], ["Harmon peak factor", "PF=1+14/(4+√P)", "P in thousands"], ["Peak sanitary flow", "Qpeak=PF×Qavg", "Add I/I as required by problem"], ["Invert drop", "Δz=SL", "Between manholes"]], "example": {"q": "A sewer run is 350 ft at slope 0.005. Find invert drop.", "steps": ["Δz=SL.", "Δz=0.005×350=1.75 ft."], "tip": "Slope is dimensionless drop per length."}}, {"id": "H", "title": "10.H Groundwater", "icon": "💧", "why": "Darcy flow, hydraulic gradient/conductivity, transmissivity, confined/unconfined wells, and aquifer storage.", "important": ["Darcy discharge uses gross area and hydraulic gradient.", "Seepage velocity is Darcy velocity divided by porosity.", "Transmissivity T=Kb includes aquifer thickness.", "Confined Thiem uses linear head difference; unconfined uses squared heads.", "Specific yield governs drained volume in unconfined aquifers."], "formulas": [["Darcy velocity", "v=Ki", "Specific discharge"], ["Darcy discharge", "Q=KiA", "Gross area"], ["Seepage velocity", "vs=v/n", "Actual pore speed"], ["Transmissivity", "T=Kb", "m²/s"], ["Confined Thiem", "Q=2πT(h2−h1)/ln(r2/r1)", "Steady radial flow"], ["Unconfined Thiem", "Q=πK(h2²−h1²)/ln(r2/r1)", "Steady radial flow"], ["Unconfined storage", "V=Sy A Δh", "Specific yield"], ["Confined storage", "V=S A Δh", "Storage coefficient"]], "example": {"q": "K=2×10⁻⁴ m/s, i=0.01, A=50 m². Find Darcy discharge.", "steps": ["Q=KiA.", "Q=2×10⁻⁴×0.01×50=1.0×10⁻⁴ m³/s."], "tip": "Do not omit the hydraulic gradient i."}}, {"id": "I", "title": "10.I Water Quality", "icon": "🧪", "why": "BOD kinetics, dissolved oxygen sag, dilution/mass balance, nutrients, pH/alkalinity, and indicators.", "important": ["BOD5 is only a fraction of ultimate BOD.", "Higher BOD tends to lower DO.", "Mixing concentration is flow-weighted, not simple-average.", "DO deficit D=DOsat−DO; minimum DO corresponds to maximum deficit.", "Phosphorus commonly limits freshwater eutrophication in the book framing."], "formulas": [["BOD exerted", "BODt=BODu(1−e^(−kt))", "First-order"], ["Ultimate from BOD5", "BODu=BOD5/(1−e^(−5k))", "Base e"], ["DO deficit", "D=DOsat−DO", "Oxygen sag"], ["Critical deficit", "Dc=(kd La/kr)e^(−kd tc)", "Book summary form"], ["Mixing", "C=(Q1C1+Q2C2)/(Q1+Q2)", "Conservative mass balance"], ["pH", "pH=−log10[H+]", "Acidity"]], "example": {"q": "2 m³/s at 4 mg/L mixes with 3 m³/s at 10 mg/L. Find mixed concentration.", "steps": ["Use flow-weighted mass balance.", "C=(2×4+3×10)/(2+3)=38/5.", "C=7.6 mg/L."], "tip": "A simple average (7 mg/L) is wrong because the flows differ."}}, {"id": "J", "title": "10.J Testing & Standards", "icon": "🔬", "why": "Drinking-water standards, indicator organisms, BOD/DO tests, turbidity/jar tests, sampling protocols, plus the chapter's air/noise standards review.", "important": ["MCL = legal contaminant limit; primary standards protect health, secondary address aesthetics.", "Total coliform is a broad indicator; fecal coliform/E. coli is more specific to fecal contamination.", "BOD dilution test divides the DO drop by sample fraction.", "Jar test finds optimum coagulant dose by residual turbidity.", "Grab samples are snapshots; composites represent average conditions/load."], "formulas": [["BOD dilution test", "BOD=(DOi−DOf)/P", "P=Vsample/Vbottle"], ["Dilution fraction", "P=Vsample/Vbottle", "Dimensionless"], ["Sound level concept", "β=10 log10(I/I0)", "Included in chapter's air/noise section; use when provided"]], "example": {"q": "20 mL sample diluted to 300 mL; DO falls 8.5→3.5 mg/L. Find BOD5.", "steps": ["P=20/300=0.0667.", "DO drop=5.0 mg/L.", "BOD5=5/0.0667≈75 mg/L."], "tip": "The DO drop is for the diluted bottle; divide by P to recover sample strength."}}, {"id": "K", "title": "10.K Water & Wastewater Treatment", "icon": "🏭", "why": "Treatment train, coagulation/flocculation, sedimentation, filtration/disinfection, activated sludge, and softening.", "important": ["Treatment order: coagulate → flocculate → settle → filter → disinfect.", "Overflow rate uses surface area; detention time uses volume.", "Stokes settling velocity varies with particle diameter squared and assumes laminar settling.", "Disinfection CT is concentration × contact time.", "Activated sludge is biological secondary BOD removal; F/M is a key loading ratio."], "formulas": [["Velocity gradient", "G=√(P/(μV))", "Flocculation mixing"], ["Overflow rate", "vo=Q/As", "Sedimentation surface loading"], ["Detention time", "t=V/Q", "Basin residence time"], ["Stokes settling", "vs=g(ρp−ρ)d²/(18μ)", "Laminar, Re<1"], ["Filter loading", "vf=Q/Af", "Surface loading"], ["Disinfection", "CT=Ct", "mg·min/L"], ["Food/Microorganism", "F/M=QS0/(VX)", "Activated sludge"], ["Weir loading", "Q/Lweir", "Outlet loading"], ["Carbonate hardness", "CH=min(TH,Alk)", "As CaCO3"]], "example": {"q": "A clarifier treats 8,000 m³/d with 400 m² surface area. Find overflow rate.", "steps": ["vo=Q/As.", "vo=8000/400=20 m/d."], "tip": "Overflow rate uses plan surface area, not basin volume."}}]; 

const subtopicTagalog={
"Rational Method":"Ginagamit ang Rational Method para tantiyahin ang peak runoff o pinakamataas na daloy mula sa maliit na drainage area. Kapag ibinigay ang runoff coefficient C, rainfall intensity i, at area A, ito ang unang formula na dapat isipin. Mas mataas ang C o i, mas mataas ang peak runoff.",
"Composite C":"Kapag iba-iba ang surface ng watershed gaya ng pavement, roof, at grass, hindi puwedeng simpleng i-average ang C. I-weight ang bawat runoff coefficient ayon sa lawak ng area nito para makuha ang representative C ng buong site.",
"SCS storage":"Ang S ay potential maximum retention ng lupa pagkatapos magsimula ang runoff. Nakadepende ito sa Curve Number: mataas na CN ay mas maliit na storage at karaniwang mas maraming runoff; mababang CN ay mas malaking infiltration/storage.",
"SCS runoff":"Ginagamit ang SCS Curve Number runoff equation kapag runoff depth o runoff volume mula sa isang storm ang hinahanap. Kailangan muna ang CN para makuha ang S. Walang direct runoff kung hindi lalampas ang rainfall sa initial abstraction na 0.2S.",
"Lag":"Ang lag time ay approximate delay ng watershed response mula rainfall papunta sa hydrograph response. Sa review relation, tlag=0.6tc. Mas maikling lag ay karaniwang mas mabilis at mas matarik na watershed response.",
"Time to peak":"Ang tp ang oras hanggang peak ng unit hydrograph. Pinagsasama nito ang kalahati ng effective rainfall duration at watershed lag time, kaya mahalaga ito sa timing ng peak discharge.",
"Triangular UH peak":"Ginagamit ito para tantiyahin ang peak discharge ng triangular unit hydrograph mula watershed area, direct-runoff depth, at time to peak. Siguraduhing tama ang required units dahil unit-specific ang coefficient na 484.",
"Horton infiltration":"Ipinapakita ng Horton equation kung paano bumababa ang infiltration capacity habang tumatagal ang ulan. Nagsisimula ito malapit sa f0 at unti-unting lumalapit sa final capacity fc.",
"Manning velocity":"Ginagamit ang Manning equation para sa open-channel o gravity flow. Ang velocity ay tumataas kapag mas malaki ang hydraulic radius o slope, at bumababa kapag mas mataas ang roughness n.",
"Discharge":"Ang Q=VA ay continuity relation: discharge ay velocity times flow area. Gamitin kapag alam ang average velocity at cross-sectional area, o para hanapin ang isa sa tatlong variables.",
"Hydraulic radius":"Ang hydraulic radius R=A/P ay sukatan ng efficiency ng flow section. Ang P ay wetted perimeter lamang—huwag isama ang free water surface sa open channel.",
"Specific energy":"Ang specific energy ay depth plus velocity head sa open channel. Ginagamit ito sa pag-aaral ng critical flow at transitions; para sa given discharge, minimum ang specific energy sa critical depth.",
"Critical depth":"Ang critical depth ay depth kung saan Fr=1 at minimum ang specific energy. Sa rectangular channel, gamitin ang unit discharge q=Q/b, hindi ang total Q direkta sa formula.",
"Froude":"Ang Froude number ang mabilis na paraan para i-classify ang open-channel flow: Fr<1 subcritical, Fr=1 critical, at Fr>1 supercritical. Inihahambing nito ang flow velocity sa gravity-wave speed.",
"Rectangular weir":"Ginagamit ang weir equation para sa discharge na dumadaan sa sharp-crested rectangular weir. Napakasensitive ng Q sa head H dahil H^(3/2), kaya mahalagang tama ang head measurement.",
"Bernoulli + loss":"Gamitin ang Bernoulli energy equation para ikumpara ang pressure head, elevation head, velocity head, at head losses sa dalawang points. Idagdag ang pump head o turbine head kung kasama sa system.",
"Pump input power":"Kinukuwenta nito ang power na kailangang ibigay sa pump. Ang useful water power ay γQh, pero dahil may losses, hinahati sa efficiency η para makuha ang required input power.",
"System curve":"Ang system curve ay head na kailangan ng piping system sa bawat flow rate. Binubuo ito ng static head at friction loss; ang intersection nito sa pump curve ang actual operating point.",
"NPSH available":"Ang NPSHA ay available suction head bago magkaroon ng vaporization/cavitation. Para safe ang pump, dapat mas mataas ang NPSHA kaysa NPSHR, preferably may margin.",
"Affinity flow":"Sa parehong pump geometry, ang flow ay approximately proportional sa rotational speed. Halimbawa, 10% increase sa speed ay roughly 10% increase sa Q.",
"Affinity head":"Ang pump head ay proportional sa square ng speed. Kaya maliit na pagbabago sa rpm ay mas malaking pagbabago sa head.",
"Affinity power":"Ang required pump power ay proportional sa cube ng speed. Ito ang dahilan kung bakit mabilis tumaas ang power demand kapag tinaasan ang pump speed.",
"Hazen-Williams velocity":"Ginagamit ang Hazen-Williams para sa pressurized water pipes. Ang C ay smoothness coefficient: mas mataas ang C, mas smooth ang pipe at karaniwang mas kaunti ang resistance.",
"HW head loss (US)":"Ginagamit ito para hanapin ang friction head loss sa water-distribution pipe. Tumataas nang malakas ang loss kapag tumataas ang Q at bumababa ang diameter; mas mataas na C ay nagpapababa ng loss.",
"Continuity at node":"Sa bawat junction ng pipe network, dapat equal ang total inflow at total outflow. Ito ang mass-conservation rule na ginagamit kasama ng energy/head-loss equations.",
"Loop balance":"Sa closed pipe-network loop, ang algebraic sum ng head losses ay zero. Ito ang pangunahing energy condition sa Hardy Cross-type network calculations.",
"Fire storage":"Ang required fire-storage volume ay fire-flow rate multiplied by required duration. Pinaka-common trap ang hindi pag-convert ng hours sa minutes kapag gpm ang flow.",
"Pressure head":"Ginagamit ang relation na ito para mabilis i-convert ang water pressure sa equivalent feet of water head. Sa water, 1 psi ay approximately 2.31 ft of head.",
"Spillway/weir":"Ginagamit para sa discharge sa spillway o weir. Dahil Q ay proportional sa H^(3/2), ang pagtaas ng water head ay mabilis na nagpapataas ng discharge capacity.",
"Storage change":"Ito ay continuity para sa reservoir o detention storage: kung mas malaki ang inflow kaysa outflow, tumataas ang storage; kung mas malaki ang outflow, bumababa ang storage.",
"Attenuation":"Ang attenuation ay percent o fraction na nabawas sa peak flow pagkatapos ng storage/routing. Mas malaking attenuation ibig sabihin mas epektibong napababa ang flood peak.",
"Annual exceedance":"Ang return period T ay inverse ng annual exceedance probability. Halimbawa, 100-year event ay 1% chance bawat taon—hindi ibig sabihin na eksaktong isang beses lang kada 100 taon.",
"Life-cycle risk":"Ginagamit ito para hanapin ang chance na mangyari kahit isang exceedance sa loob ng maraming taon. Mas mahaba ang project life, mas tumataas ang cumulative risk kahit maliit ang annual probability.",
"Weibull plotting":"Ginagamit ang Weibull plotting position para tantiyahin ang return period mula ranked historical events. Ang m=1 ang pinakamalaking event sa record.",
"Peak runoff":"Ito rin ang Rational Method application sa stormwater design. Gamitin para sa peak flow mula sa maliit na site gamit ang C, rainfall intensity, at drainage area.",
"Gutter flow":"Ginagamit sa pag-estimate ng stormwater flow capacity sa street gutter. Malakas ang epekto ng spread T, cross slope, longitudinal slope, at roughness n sa capacity.",
"Storm sewer Manning":"Para sa gravity storm sewer, gamitin ang Manning equation. Kung full circular pipe, R=D/4 at A=πD²/4 bago kunin ang Q.",
"Detention estimate":"Quick estimate ito ng required storage mula sa excess inflow over allowed outflow times duration. Kung cfs ang flow, i-convert ang time sa seconds para ft³ ang volume.",
"Volumetric coefficient":"Ang Rv ay empirical runoff-volume coefficient based sa percent imperviousness. Mas impervious ang site, mas mataas ang Rv at mas malaking water-quality runoff volume.",
"Water quality volume":"Ginagamit para tantiyahin ang stormwater volume na kailangang i-treat para sa water quality. Huwag ipagkamali sa peak-flow detention sizing dahil magkaibang design objective ang volume treatment at peak control.",
"Manning sewer":"Gravity sanitary sewers behave like open channels kaya Manning ang pangunahing equation. Kailangan ang hydraulic radius, slope, at roughness para makuha ang velocity o discharge.",
"Minimum slope":"Ginagamit para hanapin ang minimum sewer slope na kailangan para maabot ang target self-cleansing velocity. Mas maliit na pipe/hydraulic radius o mas rough na pipe ay maaaring mangailangan ng mas malaking slope.",
"Harmon peak factor":"Ang Harmon factor ay ginagamit para i-convert ang average sanitary flow sa peak sanitary flow based sa population. Tandaan na P ay population in thousands sa formula na ito.",
"Peak sanitary flow":"Peak sanitary flow ay average flow multiplied by peaking factor, pagkatapos ay idagdag ang I/I kung hinihingi ng problem. Ito ang mas relevant sa capacity design kaysa average flow lamang.",
"Invert drop":"Ang invert drop ay vertical elevation difference sa sewer run. Simple itong slope times horizontal length at useful sa manhole/invert elevation problems.",
"Darcy velocity":"Ang Darcy velocity o specific discharge ay K times hydraulic gradient. Hindi ito actual pore-water speed; apparent flow rate ito based sa gross cross-sectional area.",
"Darcy discharge":"Ginagamit ang Q=KiA para sa groundwater flow through porous media. Kailangan ang hydraulic conductivity, hydraulic gradient, at gross area perpendicular sa flow.",
"Seepage velocity":"Ito ang actual average velocity ng tubig sa pore spaces. Mas mataas ito kaysa Darcy velocity dahil ang tubig ay dumadaloy lamang sa void area; divide Darcy velocity by porosity n.",
"Transmissivity":"Ang transmissivity T=Kb ay combined ability ng buong saturated aquifer thickness na mag-transmit ng water. Units nito ay area per time.",
"Confined Thiem":"Ginagamit sa steady radial flow papunta sa well sa confined aquifer. Linear head difference ang ginagamit at transmissivity T ang pangunahing aquifer parameter.",
"Unconfined Thiem":"Ginagamit sa steady well flow sa unconfined aquifer. Clue sa formula ang squared heads h² dahil nagbabago ang saturated thickness kasama ng water-table elevation.",
"Unconfined storage":"Para sa unconfined aquifer, specific yield Sy ang ginagamit para tantiyahin ang drained water volume dahil sa pagbaba ng water table.",
"Confined storage":"Para sa confined aquifer, storage coefficient S ang ginagamit kasama ng aquifer area at head change para tantiyahin ang released/stored water volume.",
"BOD exerted":"Ipinapakita nito kung gaano karaming ultimate BOD ang na-exert sa time t. Habang tumatagal, lumalapit ang BODt sa BODu ngunit hindi agad equal dito.",
"Ultimate from BOD5":"Ginagamit kapag BOD5 ang measured value pero ultimate BOD ang hinihingi. I-correct ang five-day fraction gamit ang first-order decay constant k.",
"DO deficit":"Ang DO deficit ay difference ng saturation DO at actual DO. Mas malaking deficit ay mas mababang actual oxygen condition; maximum deficit corresponds sa minimum DO.",
"Critical deficit":"Ginagamit sa oxygen-sag analysis para tantiyahin ang maximum oxygen deficit sa critical time. Pinagsasama nito ang deoxygenation at reaeration effects.",
"Mixing":"Kapag dalawang streams o flows na may magkaibang concentration ang naghahalo, gamitin ang flow-weighted mass balance. Huwag simple average maliban kung equal ang flows.",
"pH":"Ang pH ay negative base-10 logarithm ng hydrogen-ion concentration. Mas mababang pH ay mas acidic; bawat 1 pH unit ay factor of 10 change sa [H+].",
"BOD dilution test":"Sa BOD bottle test, ang measured DO drop ay para sa diluted sample. Divide ang DO drop by sample fraction P para ma-estimate ang BOD ng original sample.",
"Dilution fraction":"Ang P ay fraction ng bottle volume na actual wastewater sample. Mahalaga ito sa BOD calculation dahil mas maliit na sample fraction means mas malaking correction sa observed DO drop.",
"Sound level concept":"Ang decibel scale ay logarithmic. Ang formula ay nagko-convert ng intensity ratio sa dB, kaya malaking intensity changes ay nagiging mas maliit na numerical dB changes.",
"Velocity gradient":"Ang G ay measure ng mixing intensity sa coagulation/flocculation. Nakadepende ito sa power input, fluid viscosity, at basin volume.",
"Overflow rate":"Ang clarifier overflow rate ay flow divided by plan surface area. Surface area—not basin volume—ang key sizing parameter para sa ideal settling concept.",
"Detention time":"Ang detention time ay theoretical average time na nananatili ang water sa basin. Compute as volume divided by flow at bantayan ang time units.",
"Stokes settling":"Ginagamit ang Stokes law para sa maliit na particles sa laminar settling regime. Settling velocity ay proportional sa particle diameter squared, kaya malaking epekto ang particle size.",
"Filter loading":"Ang filter loading rate ay flow divided by filter surface area. Ginagamit ito para i-check kung gaano karaming water ang pinoproseso bawat unit filter area.",
"Disinfection":"Ang CT concept ay disinfectant concentration times contact time. Mas mataas na concentration o mas mahabang contact time ay nagpapataas ng CT, subject sa required treatment criteria.",
"Food/Microorganism":"Ang F/M ratio ay organic food loading relative sa mass ng microorganisms sa activated-sludge aeration basin. Ginagamit ito bilang biological-process loading indicator.",
"Weir loading":"Ang weir loading ay clarifier flow divided by total outlet-weir length. Ginagamit ito para i-check kung overloaded ang effluent withdrawal along the weir.",
"Carbonate hardness":"Ang carbonate hardness ay limited ng mas maliit sa total hardness at alkalinity, parehong expressed as CaCO3. Ang natitirang hardness beyond CH ay noncarbonate hardness."
};

{topic:'G',sub:'Partial Flow',q:'At half-full flow in a circular gravity sewer at the same slope and n, compared with full flow:',o:['Velocity is half','Velocity is the same and Q is half','Velocity doubles','Q is unchanged'],a:1,e:'At half-full, R remains D/4, so Manning velocity is the same; area and discharge are half.',trap:'Do not assume half depth means half hydraulic radius.'},
{topic:'G',sub:'Invert Drop',q:'A 500-ft sewer at slope 0.003 requires an invert drop of:',o:['0.15 ft','0.50 ft','1.50 ft','15 ft'],a:2,e:'Δz=SL=.003(500)=1.5 ft.',trap:'Slope is dimensionless ft/ft.'},
{topic:'G',sub:'I/I',q:'Inflow and infiltration in a sanitary sewer generally:',o:['Reduce plant flow','Add unwanted flow and can increase peak loading','Increase pipe roughness coefficient only','Eliminate peaking'],a:1,e:'I/I adds non-sanitary water to the collection system and can overload conveyance/treatment.',trap:'Include I/I when the problem explicitly provides or requests it.'},
{topic:'H',sub:'Darcy Flow',q:'K=5×10⁻⁵ m/s, gradient=.02, area=100 m². Groundwater discharge is:',o:['1×10⁻⁶ m³/s','1×10⁻⁴ m³/s','0.01 m³/s','0.10 m³/s'],a:1,e:'Q=KiA=(5×10⁻⁵)(.02)(100)=1×10⁻⁴ m³/s.',trap:'Do not forget cross-sectional area.'},
{topic:'H',sub:'Seepage Velocity',q:'Darcy velocity is 3×10⁻⁶ m/s and porosity is 0.30. Seepage velocity is:',o:['9×10⁻⁷','3×10⁻⁶','1×10⁻⁵','1×10⁻⁴'],a:2,e:'vs=v/n=3×10⁻⁶/.30=1×10⁻⁵ m/s.',trap:'Actual pore velocity is larger than Darcy velocity when n<1.'},
{topic:'H',sub:'Transmissivity',q:'An aquifer has K=2×10⁻⁴ m/s and thickness 30 m. T=',o:['6×10⁻⁶ m²/s','6×10⁻³ m²/s','0.6 m²/s','150,000 m²/s'],a:1,e:'T=Kb=2×10⁻⁴(30)=6×10⁻³ m²/s.',trap:'Transmissivity includes saturated thickness.'},
{topic:'H',sub:'Well Equation',q:'Which clue points to the unconfined Thiem equation rather than confined?',o:['Squared hydraulic heads','Pressure head in a pipe','Manning n','BOD5'],a:0,e:'The unconfined steady radial-flow equation contains h2²−h1².',trap:'Confined Thiem uses a linear head difference with transmissivity.'},
{topic:'H',sub:'Aquifer Storage',q:'For an unconfined aquifer, drained volume from a water-table decline is based primarily on:',o:['Specific yield','Manning n','Hazen-Williams C','Froude number'],a:0,e:'V=Sy A Δh for the chapter unconfined-storage relation.',trap:'Confined storage uses storage coefficient S instead.'},
{topic:'I',sub:'Mixing',q:'1 m³/s at 2 mg/L mixes with 4 m³/s at 8 mg/L. Mixed concentration is:',o:['5.0 mg/L','6.0 mg/L','6.8 mg/L','8.0 mg/L'],a:2,e:'C=(1×2+4×8)/5=34/5=6.8 mg/L.',trap:'Use flow-weighted concentration, not a simple average.'},
{topic:'I',sub:'DO Deficit',q:'DO saturation is 9.5 mg/L and measured DO is 6.0 mg/L. Deficit is:',o:['3.5 mg/L','6.0 mg/L','9.5 mg/L','15.5 mg/L'],a:0,e:'D=DOsat−DO=9.5−6.0=3.5 mg/L.',trap:'Maximum deficit corresponds to minimum DO.'},
{topic:'I',sub:'BOD',q:'If BODu=250 mg/L, k=.20/d, what is BOD exerted after 5 d?',o:['79 mg/L','92 mg/L','158 mg/L','250 mg/L'],a:2,e:'BOD5=250(1−e^(−1))=158 mg/L.',trap:'BOD5 is generally less than ultimate BOD.'},
{topic:'I',sub:'pH',q:'If [H+]=1×10⁻⁵ mol/L, pH=',o:['4','5','7','9'],a:1,e:'pH=−log10(10⁻⁵)=5.',trap:'The negative exponent becomes the positive pH value.'},
{topic:'I',sub:'Water Quality Concept',q:'An increase in biodegradable organic loading generally causes stream DO to:',o:['Increase','Decrease','Remain exactly constant','Become pH'],a:1,e:'Higher oxygen demand consumes dissolved oxygen.',trap:'BOD and DO generally move in opposite directions after an organic load.'},
{topic:'J',sub:'BOD Bottle',q:'A 30-mL wastewater sample is diluted to 300 mL. DO drops from 9 to 4 mg/L. BOD5 is:',o:['5 mg/L','25 mg/L','50 mg/L','150 mg/L'],a:2,e:'P=30/300=.10; BOD=(9−4)/.10=50 mg/L.',trap:'Divide the bottle DO drop by sample fraction.'},
{topic:'J',sub:'Standards',q:'Which statement matches the chapter review?',o:['Secondary standards primarily protect against acute toxicity','Primary standards protect health; secondary standards address aesthetic concerns','MCL is only a suggested value','E. coli is less specific than total coliform'],a:1,e:'The chapter distinguishes health-based primary standards from aesthetic secondary standards.',trap:'MCL is presented as a legal contaminant limit.'},
{topic:'J',sub:'Indicators',q:'Which is more specific evidence of fecal contamination?',o:['Total coliform','E. coli/fecal coliform','Turbidity alone','Hardness'],a:1,e:'Fecal coliform/E. coli is more specific to fecal contamination than total coliform.',trap:'Total coliform is a broader indicator.'},
{topic:'J',sub:'Jar Test',q:'The jar test is primarily used to determine:',o:['Optimum coagulant dose','Pump efficiency','Aquifer porosity','Sewer slope'],a:0,e:'Compare residual turbidity after different coagulant doses to identify an optimum.',trap:'It is a treatment-process optimization test.'},
{topic:'J',sub:'Sampling',q:'Which sample type better represents average conditions over time?',o:['Grab sample','Composite sample','Blank only','Single instantaneous field reading'],a:1,e:'A composite combines samples over time/flow and better represents average conditions or loading.',trap:'A grab sample is a snapshot.'},
{topic:'K',sub:'Treatment Train',q:'Which sequence is correct for conventional water treatment?',o:['Filter→coagulate→settle→disinfect','Coagulate→flocculate→settle→filter→disinfect','Disinfect→settle→flocculate→filter','Settle→disinfect→coagulate→filter'],a:1,e:'The chapter review emphasizes coagulate → flocculate → settle → filter → disinfect.',trap:'Disinfection is typically after particle removal in this simplified treatment train.'},
{topic:'K',sub:'Clarifier Overflow',q:'A clarifier treats 12,000 m³/d with 600 m² surface area. Overflow rate=',o:['10 m/d','20 m/d','30 m/d','72 m/d'],a:1,e:'vo=Q/As=12000/600=20 m/d.',trap:'Use plan surface area, not basin volume.'},
{topic:'K',sub:'Detention Time',q:'A basin volume is 2400 m³ and flow is 8000 m³/d. Detention time is:',o:['0.3 hr','3 hr','7.2 hr','24 hr'],a:2,e:'t=V/Q=.3 d=.3(24)=7.2 hr.',trap:'V/Q gives days here because Q is per day.'},
{topic:'K',sub:'Disinfection CT',q:'A disinfectant residual is 1.5 mg/L for 40 min. CT=',o:['26.7 mg·min/L','40 mg·min/L','60 mg·min/L','600 mg·min/L'],a:2,e:'CT=Ct=1.5(40)=60 mg·min/L.',trap:'CT is a product, not a ratio.'},
{topic:'K',sub:'Stokes Settling',q:'Under Stokes-law conditions, if particle diameter doubles, settling velocity changes by a factor of:',o:['2','4','8','1/2'],a:1,e:'vs∝d², so doubling d gives four times the settling velocity.',trap:'The diameter dependence is squared.'}

const questions=[{"n":1,"topic":"A","q":"A parking-lot retrofit replaces 6 ac of grass (C=0.25) with pavement (C=0.90). The remaining 14 ac stays grass. For i=2.2 in/hr, what peak-flow increase should the engineer expect?","options":["17.2 cfs","8.58 cfs","25.7 cfs","3.90 cfs"],"answer":1,"explanation":"Only the changed 6 ac causes the increase: ΔQ=(0.90−0.25)(2.2)(6)=8.58 cfs. 🇵🇭 Hindi kailangang i-recompute lahat; hanapin ang epekto ng land-use change.","difficulty":"Hard"},{"n":2,"topic":"A","q":"An engineer used the arithmetic average of C=0.90 for 2 ac pavement and C=0.30 for 8 ac lawn. What is the main problem with the calculation?","options":["Rainfall intensity should be averaged instead","C must be weighted by drainage area","C must always equal 1.0","The Rational Method cannot use mixed land cover"],"answer":1,"explanation":"Composite C is area-weighted. Here C=(.9×2+.3×8)/10=.42, not .60. 🇵🇭 Kapag hindi pantay ang area, bawal simpleng average.","difficulty":"Medium"},{"n":3,"topic":"A","q":"A 15-ac watershed produces 27 cfs during a storm with i=3.0 in/hr. If the Rational Method is appropriate, what runoff coefficient is implied?","options":["0.20","0.40","0.60","0.90"],"answer":2,"explanation":"Back-solve C=Q/(iA)=27/(3×15)=0.60. 🇵🇭 Reverse problem ito—hindi laging Q ang unknown.","difficulty":"Medium"},{"n":4,"topic":"A","q":"Two design storms have the same total rainfall depth. Storm X is short and intense; Storm Y is long and gentle. For a small watershed designed by the Rational Method, which is more likely to control peak discharge?","options":["Storm X","Storm Y","They must give the same peak","Total depth alone decides"],"answer":0,"explanation":"Rational peak flow depends on rainfall intensity corresponding to tc, not merely total depth. 🇵🇭 Peak ang concern, kaya intensity ang mahalaga.","difficulty":"Medium"},{"n":5,"topic":"A","q":"A watershed has CN=70. A 0.60-in shower occurs. Will the standard SCS runoff equation predict direct runoff?","options":["Yes, because any rainfall creates runoff","No; initial abstraction has not been exceeded","Yes, but only 0.12 in","Cannot decide without area"],"answer":1,"explanation":"S=1000/70−10=4.286 in; 0.2S=.857 in. Since P=.60<.857, Q=0. 🇵🇭 Tingnan muna ang threshold bago mag-substitute.","difficulty":"Medium"},{"n":6,"topic":"A","q":"Development shortens time of concentration while the IDF curve is otherwise unchanged. What is the usual effect on the Rational Method design intensity and peak flow?","options":["Both usually decrease","Intensity usually increases, tending to raise peak flow","Intensity is independent of tc","Peak flow must become zero"],"answer":1,"explanation":"Shorter tc generally corresponds to a higher IDF intensity; urbanization also often raises C. 🇵🇭 Mas mabilis makarating ang runoff → mas mataas ang possible peak.","difficulty":"Medium"},{"n":7,"topic":"A","q":"A unit hydrograph for 1 in of direct runoff has a 420-cfs peak. If watershed response remains linear, what peak corresponds to 2.5 in of direct runoff?","options":["168 cfs","420 cfs","1,050 cfs","2,500 cfs"],"answer":2,"explanation":"Unit-hydrograph ordinates scale linearly with runoff depth: 420×2.5=1050 cfs. 🇵🇭 I-scale ang hydrograph; huwag gumawa ng bagong shape.","difficulty":"Medium"},{"n":8,"topic":"A","q":"In the Horton infiltration equation, a technician reports f0=0.4 in/hr and fc=1.2 in/hr for a normal decay curve. What should you suspect?","options":["Nothing; this is required","The parameters are likely reversed","k must be zero","Rainfall intensity is missing"],"answer":1,"explanation":"For the usual Horton decay, initial capacity f0 is greater than final capacity fc. 🇵🇭 Nagsisimula mataas ang infiltration capacity at bumababa papunta sa fc.","difficulty":"Medium"},{"n":9,"topic":"A","q":"A triangular direct-runoff hydrograph has the same runoff volume after development, but its time to peak becomes smaller. What must happen to the peak if the triangular approximation remains valid?","options":["Peak decreases","Peak increases","Peak is unchanged","Peak becomes negative"],"answer":1,"explanation":"For the same hydrograph volume, a narrower time base requires a higher peak. 🇵🇭 Same volume pero mas maiksi ang response → mas matarik at mas mataas ang peak.","difficulty":"Medium"},{"n":10,"topic":"B","q":"A rectangular channel is 4 m wide with 1 m flow depth. A student uses P=4+1+1+4=10 m to compute hydraulic radius. Which term is wrong?","options":["Bottom width","Both side depths","The 4-m free surface","None"],"answer":2,"explanation":"Wetted perimeter excludes the free water surface. Correct P=4+1+1=6 m. 🇵🇭 Tubig-air boundary ay hindi wetted perimeter.","difficulty":"Medium"},{"n":11,"topic":"B","q":"A channel carries the same discharge after its lining is changed from rough earth to smooth concrete. Geometry and slope are unchanged. What happens according to Manning?","options":["Velocity capacity increases","Velocity capacity decreases","n increases","Hydraulic radius becomes zero"],"answer":0,"explanation":"Smoother lining means lower Manning n, which increases velocity/capacity. 🇵🇭 Sa Manning, mas maliit n = mas kaunting resistance.","difficulty":"Medium"},{"n":12,"topic":"B","q":"A wide channel has V=5 m/s and depth 0.40 m. Before calculating, which flow regime should you expect qualitatively?","options":["Likely supercritical","Likely subcritical","Pressurized","Impossible for open-channel flow"],"answer":0,"explanation":"Fast, shallow flow tends to have Fr>1. Numerically Fr≈5/√(9.81×.4)=2.52. 🇵🇭 Mabilis + mababaw = clue sa supercritical.","difficulty":"Medium"},{"n":13,"topic":"B","q":"A hydraulic jump forms downstream of a spillway. Which design benefit is most directly associated with the jump?","options":["Pressure generation","Energy dissipation","Increasing upstream pump efficiency","Reducing wetted perimeter to zero"],"answer":1,"explanation":"A hydraulic jump converts supercritical to subcritical flow while dissipating energy. 🇵🇭 Ginagamit ito para bawasan ang destructive kinetic energy.","difficulty":"Medium"},{"n":14,"topic":"B","q":"A rectangular channel carries 9 m³/s and is 3 m wide. Which value should enter the rectangular critical-depth equation as q?","options":["9 m³/s","3 m²/s","27 m⁴/s","1 m/s"],"answer":1,"explanation":"q=Q/b=9/3=3 m²/s. 🇵🇭 Sa critical-depth formula, unit discharge per width ang kailangan.","difficulty":"Medium"},{"n":15,"topic":"B","q":"At one section of an open channel, y=1.2 m and V=3 m/s. If velocity doubles while depth stays fixed, what happens to the velocity-head portion of specific energy?","options":["Doubles","Quadruples","Halves","Unchanged"],"answer":1,"explanation":"Velocity head is V²/(2g), so doubling V multiplies it by 4. 🇵🇭 Square ang velocity sa energy term.","difficulty":"Medium"},{"n":16,"topic":"B","q":"Two sharp-crested rectangular weirs are identical except Weir B has twice the crest length. At the same head, how does its discharge compare?","options":["Half","Same","Twice","Four times"],"answer":2,"explanation":"Q is directly proportional to crest length L. 🇵🇭 Linear sa L, pero H^(3/2) sa head.","difficulty":"Medium"},{"n":17,"topic":"B","q":"A channel transitions from Fr=0.65 upstream to Fr=1.00 at a control section. What special condition occurs at the control?","options":["Maximum specific energy","Critical flow and minimum specific energy","Zero discharge","Pressurized flow"],"answer":1,"explanation":"Fr=1 defines critical flow; for a given discharge this corresponds to minimum specific energy. 🇵🇭 Fr=1 ang boundary ng subcritical at supercritical.","difficulty":"Medium"},{"n":18,"topic":"B","q":"A full 24-in pipe is treated with an open-channel Manning relation. What hydraulic radius should be used?","options":["24 in","12 in","6 in","3 in"],"answer":2,"explanation":"For a full circular section R=D/4=24/4=6 in. 🇵🇭 Hydraulic radius ≠ geometric radius.","difficulty":"Medium"},{"n":19,"topic":"C","q":"A pump supplies 15 kW of useful water power at 75% efficiency. Approximately how much shaft/input power is required?","options":["11.25 kW","15 kW","20 kW","60 kW"],"answer":2,"explanation":"Input=water power/η=15/.75=20 kW. 🇵🇭 Divide by efficiency dahil mas malaki ang input kaysa useful output.","difficulty":"Medium"},{"n":20,"topic":"C","q":"A pump curve and system curve do not intersect within the pump’s allowable operating range. What is the best conclusion?","options":["The selected pump/system combination cannot provide a valid normal operating point","NPSH is automatically adequate","Flow must be zero by definition","Put all pumps in series"],"answer":0,"explanation":"Normal operation occurs where pump head equals system head. 🇵🇭 Kung walang valid intersection, mali ang selection o system condition.","difficulty":"Medium"},{"n":21,"topic":"C","q":"A system has large static head and relatively little friction. If flow is doubled, which part of system head remains essentially unchanged?","options":["Friction head","Static head","Velocity in the pipe","Minor-loss coefficient contribution"],"answer":1,"explanation":"Static head is elevation/pressure difference and does not depend on Q; friction commonly varies about Q². 🇵🇭 Static = fixed elevation requirement.","difficulty":"Medium"},{"n":22,"topic":"C","q":"A suction line is lengthened and several fittings are added while everything else stays the same. What happens to NPSHA?","options":["Increases","Decreases","Becomes equal to efficiency","Is unaffected by suction loss"],"answer":1,"explanation":"Additional suction-side head loss reduces NPSHA. 🇵🇭 Mas maraming loss bago pump → mas mataas cavitation risk.","difficulty":"Medium"},{"n":23,"topic":"C","q":"Two identical pumps are arranged in series because the system requires much greater elevation head. Why is series preferred over parallel here?","options":["Series adds head at a given flow","Series eliminates friction","Parallel adds head while series adds flow","Series makes NPSHR zero"],"answer":0,"explanation":"Series pump heads add. Parallel arrangement primarily increases flow capacity. 🇵🇭 Series=head; parallel=flow.","difficulty":"Medium"},{"n":24,"topic":"C","q":"A variable-speed pump is slowed to 80% of its original speed. Approximately what fraction of the original head is available?","options":["0.80","0.64","0.512","1.25"],"answer":1,"explanation":"Affinity law h2/h1=(N2/N1)²=.8²=.64. 🇵🇭 Head follows speed squared.","difficulty":"Medium"},{"n":25,"topic":"C","q":"A variable-speed pump is slowed to 80% of original speed. Approximately what fraction of original power is required?","options":["0.80","0.64","0.512","0.40"],"answer":2,"explanation":"Power follows speed cubed: .8³=.512. 🇵🇭 Malaki ang power savings dahil cube relationship.","difficulty":"Medium"},{"n":26,"topic":"C","q":"A pump is cavitating even though discharge is correct. Which change would most directly improve suction conditions?","options":["Increase suction-line losses","Lower available suction head","Reduce suction losses or raise liquid level","Increase vapor pressure"],"answer":2,"explanation":"Increasing NPSHA by reducing suction loss or increasing suction head helps prevent cavitation. 🇵🇭 Ayusin ang suction side, hindi lang ang discharge.","difficulty":"Medium"},{"n":27,"topic":"C","q":"A pump lifts water at 0.04 m³/s through 25 m. A colleague calculates 9.81 kW and calls it motor input power. What did the colleague omit if efficiency is 70%?","options":["Gravity","Flow rate","Division by pump efficiency","Head"],"answer":2,"explanation":"9.81 kW is water power. Input=9.81/.70≈14.0 kW. 🇵🇭 Water power muna iyon; motor/input needs efficiency correction.","difficulty":"Hard"},{"n":28,"topic":"D","q":"Two equal-length water mains carry the same flow. Pipe 1 has C=90 and Pipe 2 has C=140. Which one has the larger Hazen-Williams head loss?","options":["Pipe 1","Pipe 2","Equal","Cannot compare without elevation"],"answer":0,"explanation":"Lower Hazen-Williams C means rougher pipe and greater head loss. 🇵🇭 Opposite ito ng Manning n trend.","difficulty":"Medium"},{"n":29,"topic":"D","q":"A junction receives 8 cfs from one pipe and 5 cfs from another. One outgoing pipe carries 9 cfs. What must the second outgoing pipe carry?","options":["4 cfs","13 cfs","22 cfs","1 cfs"],"answer":0,"explanation":"Continuity: total in=13 cfs, so remaining out=13−9=4 cfs. 🇵🇭 Node balance muna bago loop balance.","difficulty":"Medium"},{"n":30,"topic":"D","q":"Two parallel branches connect the same reservoirs. Branch A has much greater resistance than Branch B. Which statement is most reasonable?","options":["A carries more flow because its head loss is larger","Both have the same head loss, but B carries more flow","Both must carry equal flow","A has zero head loss"],"answer":1,"explanation":"Parallel branches share the same endpoint head difference; the lower-resistance branch carries more flow. 🇵🇭 Equal head loss does not mean equal Q.","difficulty":"Medium"},{"n":31,"topic":"D","q":"A pressure gauge reads 65 psi at a hydrant. Approximately what pressure head is this?","options":["28.1 ft","65 ft","150 ft","300 ft"],"answer":2,"explanation":"h≈2.31×65=150.15 ft of water. 🇵🇭 psi to feet of water: multiply by about 2.31.","difficulty":"Medium"},{"n":32,"topic":"D","q":"A tank must reserve water for 1,800 gpm fire flow for 2.5 hr. Which storage volume is required for the fire-flow portion alone?","options":["108,000 gal","270,000 gal","4,500 gal","540,000 gal"],"answer":1,"explanation":"2.5 hr=150 min; V=1800×150=270,000 gal. 🇵🇭 Rate × duration; match the time unit to gpm.","difficulty":"Medium"},{"n":33,"topic":"D","q":"A distribution model satisfies continuity at every node but the sum of head losses around a closed loop is not zero. What remains unsatisfied?","options":["Mass conservation","Energy balance","Water density","Fire duration"],"answer":1,"explanation":"Loop energy balance requires ΣhL=0 around a closed loop. 🇵🇭 Hardy Cross needs both node continuity and loop head balance.","difficulty":"Medium"},{"n":34,"topic":"D","q":"An old cast-iron main becomes rougher with age. In a Hazen-Williams model, which parameter change represents this deterioration?","options":["Increase C","Decrease C","Increase Fr","Decrease Manning n"],"answer":1,"explanation":"Roughening is represented by a lower Hazen-Williams C. 🇵🇭 Mas luma/rough → lower C → higher loss.","difficulty":"Medium"},{"n":35,"topic":"D","q":"A proposed water main meets average-day pressure but fails during simultaneous peak demand and fire flow. What does this show?","options":["Average-day analysis alone is insufficient","The pipe must be an open channel","Fire flow reduces demand","Pressure head is unrelated to flow"],"answer":0,"explanation":"Distribution systems must be checked under governing peak/fire conditions. 🇵🇭 Hindi sapat na pasado sa average condition.","difficulty":"Medium"},{"n":36,"topic":"D","q":"A designer doubles pipe diameter while keeping length, material, and flow the same. Based on the Hazen-Williams head-loss form, what qualitative change is expected?","options":["A strong decrease in head loss","A strong increase in head loss","No change","Head loss becomes negative"],"answer":0,"explanation":"Diameter appears with a large exponent in the denominator, so larger D greatly reduces loss. 🇵🇭 Diameter is a very powerful lever in pipe head loss.","difficulty":"Medium"},{"n":37,"topic":"E","q":"A homeowner says, “We had a 100-year flood last year, so another cannot happen for 99 years.” Which response is correct?","options":["Correct","Incorrect; the event has about 1% exceedance probability each year","Correct only for levees","Incorrect because it means 100% annual chance"],"answer":1,"explanation":"Return period is a probability concept, not a fixed schedule. 🇵🇭 Puwedeng mangyari ulit kahit next year.","difficulty":"Medium"},{"n":38,"topic":"E","q":"A bridge has a 50-year design flood. What is the annual exceedance probability?","options":["50%","5%","2%","0.5%"],"answer":2,"explanation":"p=1/T=1/50=.02=2%. 🇵🇭 Invert the return period.","difficulty":"Medium"},{"n":39,"topic":"E","q":"A 30-year project is protected to the 100-year event. Which is closest to the probability of at least one exceedance during the project life?","options":["1%","10%","26%","30%"],"answer":2,"explanation":"R=1−(1−.01)^30≈26%. 🇵🇭 Project-life risk is much larger than the one-year 1%.","difficulty":"Hard"},{"n":40,"topic":"E","q":"During a routing interval, average inflow is 70 cfs and average outflow is 50 cfs for 12 minutes. How much does storage increase?","options":["240 ft³","1,200 ft³","14,400 ft³","50,400 ft³"],"answer":2,"explanation":"ΔS=(70−50)(12×60)=14,400 ft³. 🇵🇭 cfs requires seconds.","difficulty":"Medium"},{"n":41,"topic":"E","q":"A detention basin’s inflow hydrograph peaks at 120 cfs and outflow peaks at 75 cfs. What peak attenuation fraction is achieved?","options":["37.5%","45%","62.5%","160%"],"answer":0,"explanation":"(120−75)/120=.375=37.5%. 🇵🇭 Reduction divided by original inflow peak.","difficulty":"Medium"},{"n":42,"topic":"E","q":"A flood-control alternative proposes a levee instead of a detention basin. What major hydrologic difference should the reviewer recognize?","options":["A levee primarily confines/conveys flow; detention temporarily stores it","A levee removes BOD","Detention cannot affect peak flow","They are hydraulically identical"],"answer":0,"explanation":"Levees mainly contain/convey floodwater; detention stores and attenuates. 🇵🇭 Conveyance vs storage ang key distinction.","difficulty":"Medium"},{"n":43,"topic":"E","q":"Head over a spillway rises from 1 ft to 3 ft. If Q∝H^(3/2), by what factor does discharge change?","options":["3","5.20","9","1.73"],"answer":1,"explanation":"Factor=(3/1)^(3/2)=3√3≈5.20. 🇵🇭 Nonlinear ang weir/spillway response.","difficulty":"Medium"},{"n":44,"topic":"E","q":"In a 39-year annual-maximum flood record, the second-largest event is ranked m=2. What Weibull return period is assigned?","options":["19.5 yr","20 yr","39 yr","80 yr"],"answer":1,"explanation":"T=(n+1)/m=(39+1)/2=20 yr. 🇵🇭 Rank matters; largest is m=1.","difficulty":"Medium"},{"n":45,"topic":"E","q":"A detention basin lowers peak outflow but the total storm volume eventually leaves the basin. Which statement best describes it?","options":["It attenuates and delays flow rather than permanently retaining all runoff","It violates continuity","It acts as a groundwater well","It must increase the peak"],"answer":0,"explanation":"Detention temporarily stores stormwater and releases it later. 🇵🇭 Peak control does not mean the whole storm volume disappears.","difficulty":"Medium"},{"n":46,"topic":"F","q":"A storm sewer is flowing full. A designer mistakenly uses R=D/2 in Manning instead of D/4. What is the likely effect?","options":["Capacity is overestimated","Capacity is underestimated","No effect","Slope becomes negative"],"answer":0,"explanation":"Using too large an R increases computed Manning velocity/capacity. 🇵🇭 Geometric radius is not hydraulic radius.","difficulty":"Medium"},{"n":47,"topic":"F","q":"A site’s imperviousness rises from 30% to 70%. Using Rv=0.05+0.009I, how does Rv change?","options":["0.32 to 0.68","0.27 to 0.63","0.30 to 0.70","0.05 to 0.09"],"answer":0,"explanation":"Rv at 30%=.05+.27=.32; at 70%=.05+.63=.68. 🇵🇭 I is entered as percent, not decimal.","difficulty":"Medium"},{"n":48,"topic":"F","q":"A 12-ac site has Rv=0.60 and a 1-in water-quality rainfall depth. What WQv is required?","options":["0.60 ac-ft","1.00 ac-ft","0.30 ac-ft","7.20 ac-ft"],"answer":0,"explanation":"WQv=(P/12)RvA=(1/12)(.60)(12)=.60 ac-ft. 🇵🇭 Convert rainfall inches to feet through /12.","difficulty":"Medium"},{"n":49,"topic":"F","q":"A basin receives 18 cfs while its outlet allows 8 cfs for 15 minutes. Using a rectangular excess-flow estimate, what storage is needed?","options":["9,000 ft³","2,700 ft³","15,000 ft³","900 ft³"],"answer":0,"explanation":"Excess=10 cfs; t=900 s; storage=9000 ft³. 🇵🇭 Q difference × seconds.","difficulty":"Medium"},{"n":50,"topic":"F","q":"A developer says meeting the post-development peak-flow limit automatically satisfies stormwater quality requirements. What is the best review comment?","options":["Correct in every case","Peak control and water-quality volume are separate criteria","Water quality only applies to sanitary sewers","Peak flow is unrelated to imperviousness"],"answer":1,"explanation":"The chapter treats peak-flow control and WQv/BMP treatment separately. 🇵🇭 Puwedeng pasado sa peak pero kulang sa first-flush treatment.","difficulty":"Medium"},{"n":51,"topic":"F","q":"A gutter design increases spread T while slope and roughness remain unchanged. In the listed gutter equation, what happens to capacity?","options":["Capacity rises strongly because Q∝T^(8/3)","Capacity falls linearly","Capacity is unchanged","Capacity becomes independent of geometry"],"answer":0,"explanation":"The gutter equation has a strong T^(8/3) dependence. 🇵🇭 Malaking effect ang spread sa gutter capacity.","difficulty":"Medium"},{"n":52,"topic":"F","q":"A small commercial site has a known C and drainage area. The engineer must select rainfall intensity from an IDF curve. Which duration is the key starting point?","options":["Time of concentration","Fire-flow duration","Pump operating time","BOD incubation time"],"answer":0,"explanation":"For Rational Method design, intensity is associated with the watershed tc. 🇵🇭 IDF intensity should match the response time.","difficulty":"Medium"},{"n":53,"topic":"F","q":"A storm sewer velocity is only 0.7 ft/s under a frequent-flow condition. What operational concern is most relevant?","options":["Sediment deposition due to poor self-cleansing","Cavitation","Excessive Froude number in a pump","Aquifer drawdown"],"answer":0,"explanation":"Very low sewer velocity can allow solids/sediment to settle. The review notes about 2 ft/s as a self-cleansing target. 🇵🇭 Masyadong mabagal → deposition.","difficulty":"Medium"},{"n":54,"topic":"F","q":"Which measure most directly targets first-flush pollutant treatment rather than only peak conveyance?","options":["Bioretention/water-quality BMP","Larger fire-storage tank","Pump in series","Higher Hazen-Williams C"],"answer":0,"explanation":"Bioretention and similar BMPs address stormwater quality. 🇵🇭 Hindi lahat ng stormwater solution ay pipe sizing lang.","difficulty":"Medium"},{"n":55,"topic":"G","q":"A sanitary sewer has average flow 0.8 MGD and Harmon peak factor 3.0. The problem also specifies 0.2 MGD I/I at peak. What design flow should be checked?","options":["2.4 MGD","2.6 MGD","3.0 MGD","0.8 MGD"],"answer":1,"explanation":"Peak sanitary=3(.8)=2.4 MGD; add specified I/I=.2 →2.6 MGD. 🇵🇭 Apply peaking then include I/I when the problem gives it.","difficulty":"Hard"},{"n":56,"topic":"G","q":"A city reports high wet-weather flow in a sanitary sewer even though customer wastewater use is unchanged. Which cause best matches the symptom?","options":["Inflow and infiltration","Lower BOD","Pump affinity","Lower CN"],"answer":0,"explanation":"Rain/groundwater entering the sanitary system is I/I. 🇵🇭 Wet weather spike is a classic clue.","difficulty":"Medium"},{"n":57,"topic":"G","q":"A full circular gravity sewer and the same sewer flowing exactly half-full have the same slope and n. How do their velocities compare under the review relation?","options":["Half-full velocity is half","Velocities are equal","Half-full velocity doubles","Both are zero"],"answer":1,"explanation":"At half-full and full, R=D/4, so Manning velocity is the same; discharge differs because area differs. 🇵🇭 Same R → same V.","difficulty":"Medium"},{"n":58,"topic":"G","q":"A sewer must drop 2.4 ft between manholes 600 ft apart. What slope should be shown on the profile?","options":["0.0004","0.004","0.04","0.25"],"answer":1,"explanation":"S=Δz/L=2.4/600=.004. 🇵🇭 Reverse ng invert-drop problem.","difficulty":"Medium"},{"n":59,"topic":"G","q":"A gravity sewer is too flat to maintain the target self-cleansing velocity. Which design change most directly helps, all else equal?","options":["Increase slope","Increase Manning n","Reduce hydraulic radius to zero","Add I/I"],"answer":0,"explanation":"Manning velocity increases with S^(1/2). 🇵🇭 Mas matarik na slope → mas mataas velocity.","difficulty":"Medium"},{"n":60,"topic":"G","q":"Why are manholes commonly placed where sewer direction, slope, or diameter changes?","options":["They provide access and define hydraulic/profile transition points","They eliminate all head loss","They convert sanitary flow to stormwater","They set CN"],"answer":0,"explanation":"Manholes provide maintenance access and practical transition/control locations. 🇵🇭 Important sila sa changes at inspection.","difficulty":"Medium"},{"n":61,"topic":"G","q":"Population rises, causing the Harmon peak factor itself to decrease slightly, while average sanitary flow rises substantially. What can still happen to peak design flow?","options":["It can increase because Qpeak=PF×Qavg","It must decrease","It must remain constant","It becomes independent of population"],"answer":0,"explanation":"A smaller multiplier can still produce a larger peak when average flow grows. 🇵🇭 Tingnan ang product, hindi PF lang.","difficulty":"Medium"},{"n":62,"topic":"G","q":"A combined sewer is repeatedly overflowing during storms. Which long-term concept most directly reduces stormwater loading on the sanitary treatment system?","options":["Separate storm and sanitary collection","Increase I/I","Lower self-cleansing velocity","Use a higher BOD bottle fraction"],"answer":0,"explanation":"Separate systems prevent storm peaks from being routed through sanitary treatment capacity. 🇵🇭 Separation reduces CSO/plant overload risk.","difficulty":"Medium"},{"n":63,"topic":"G","q":"For a full 18-in gravity sewer, what hydraulic radius is used in Manning?","options":["9 in","4.5 in","18 in","2.25 in"],"answer":1,"explanation":"R=D/4=18/4=4.5 in. 🇵🇭 Again, hydraulic radius is A/P, not D/2.","difficulty":"Medium"},{"n":64,"topic":"H","q":"Two monitoring wells 200 m apart differ in hydraulic head by 4 m. What hydraulic gradient magnitude should be used for Darcy flow?","options":["0.002","0.02","0.20","50"],"answer":1,"explanation":"i=Δh/L=4/200=.02. 🇵🇭 Head drop divided by flow length.","difficulty":"Medium"},{"n":65,"topic":"H","q":"A soil column has K=3×10⁻⁵ m/s, gradient 0.04, and gross area 25 m². What groundwater discharge passes through it?","options":["3×10⁻⁵ m³/s","1.2×10⁻⁶ m³/s","0.03 m³/s","7.5×10⁻⁴ m³/s"],"answer":0,"explanation":"Q=KiA=(3e−5)(.04)(25)=3e−5 m³/s. 🇵🇭 Darcy discharge needs K, gradient, and gross area.","difficulty":"Medium"},{"n":66,"topic":"H","q":"Darcy specific discharge is 6×10⁻⁶ m/s through soil with porosity 0.30. What is the approximate pore-water seepage velocity?","options":["1.8×10⁻⁶","6×10⁻⁶","2×10⁻⁵","5×10⁻⁵"],"answer":2,"explanation":"vs=v/n=6e−6/.30=2e−5 m/s. 🇵🇭 Actual pore speed is faster because water only moves through voids.","difficulty":"Medium"},{"n":67,"topic":"H","q":"Two aquifers have the same K, but Aquifer B is twice as thick. How does transmissivity compare?","options":["B has half the T","B has twice the T","T is unchanged","T becomes dimensionless"],"answer":1,"explanation":"T=Kb, so doubling saturated thickness doubles transmissivity. 🇵🇭 T combines conductivity and thickness.","difficulty":"Medium"},{"n":68,"topic":"H","q":"A well problem explicitly gives h1² and h2² terms in the governing relation. What aquifer type is being indicated?","options":["Confined","Unconfined","Pressurized pipe","Storm sewer"],"answer":1,"explanation":"The unconfined Thiem relation uses squared heads. 🇵🇭 Squared-head difference is the clue.","difficulty":"Medium"},{"n":69,"topic":"H","q":"An unconfined aquifer has Sy=0.18 over 20,000 m². The water table falls 0.5 m. Estimate water released from storage.","options":["1,800 m³","10,000 m³","3,600 m³","180 m³"],"answer":0,"explanation":"V=SyAΔh=.18(20000)(.5)=1800 m³. 🇵🇭 Specific yield ang gamit sa drained unconfined storage.","difficulty":"Medium"},{"n":70,"topic":"H","q":"A confined-aquifer storage problem provides storage coefficient S rather than specific yield Sy. Which relation matches the chapter review?","options":["V=SAΔh","V=SyAΔh only","V=CiA","V=Q/Lweir"],"answer":0,"explanation":"Confined storage uses V=S A Δh. 🇵🇭 Huwag pagpalitin ang S at Sy.","difficulty":"Medium"},{"n":71,"topic":"H","q":"If hydraulic gradient reverses direction while K and area stay unchanged, what happens to Darcy flow?","options":["Magnitude is unchanged but direction reverses","Flow becomes infinite","K changes sign","Porosity becomes zero"],"answer":0,"explanation":"Darcy flow follows the hydraulic gradient; reversing gradient reverses flow direction. 🇵🇭 Flow goes from higher hydraulic head toward lower head.","difficulty":"Medium"},{"n":72,"topic":"H","q":"A colleague reports transmissivity in m/s. What is wrong?","options":["Nothing","Transmissivity should have units of area/time such as m²/s","It should be dimensionless","It should be pressure"],"answer":1,"explanation":"T=Kb, so (m/s)(m)=m²/s. 🇵🇭 Unit check can reveal a wrong formula or missing thickness.","difficulty":"Medium"},{"n":73,"topic":"I","q":"A stream at 2 m³/s and 3 mg/L mixes with an effluent at 0.5 m³/s and 18 mg/L. What is the completely mixed concentration?","options":["10.5 mg/L","6.0 mg/L","4.5 mg/L","21 mg/L"],"answer":1,"explanation":"C=(2×3+.5×18)/(2.5)=15/2.5=6 mg/L. 🇵🇭 Flow-weighted mass balance, not simple average.","difficulty":"Medium"},{"n":74,"topic":"I","q":"DO saturation is 9.2 mg/L. A downstream measurement is 5.7 mg/L. What is the oxygen deficit?","options":["3.5 mg/L","14.9 mg/L","5.7 mg/L","9.2 mg/L"],"answer":0,"explanation":"D=DOsat−DO=9.2−5.7=3.5 mg/L. 🇵🇭 Larger deficit means lower actual DO.","difficulty":"Medium"},{"n":75,"topic":"I","q":"At the critical point of an oxygen-sag curve, the DO deficit is at its maximum. What happens to actual DO there?","options":["It is also maximum","It is minimum","It equals BODu","It becomes pH"],"answer":1,"explanation":"DO=DOsat−D, so maximum deficit corresponds to minimum DO. 🇵🇭 Opposite direction ang DO at deficit.","difficulty":"Medium"},{"n":76,"topic":"I","q":"A sample has BODu=180 mg/L and k=0.20/d. About what fraction of ultimate BOD has been exerted after 5 days?","options":["36.8%","63.2%","100%","20%"],"answer":1,"explanation":"Fraction=1−e^(−kt)=1−e^(−1)=.632. 🇵🇭 BOD5 is only part of ultimate BOD.","difficulty":"Medium"},{"n":77,"topic":"I","q":"A laboratory reports BOD5 greater than BODu using the same first-order model. What should you conclude?","options":["This is expected","The values/model application should be checked","k must be negative by definition","DO must equal zero"],"answer":1,"explanation":"For positive k and finite time, BODt=BODu(1−e−kt) must be less than BODu. 🇵🇭 BODu is the asymptotic total demand.","difficulty":"Medium"},{"n":78,"topic":"I","q":"Hydrogen-ion concentration changes from 10⁻⁷ to 10⁻⁵ mol/L. How does pH change?","options":["From 7 to 5","From 5 to 7","From 7 to 12","It does not change"],"answer":0,"explanation":"pH=−log10[H+]. Increasing H+ by 100× lowers pH by 2 units. 🇵🇭 More H+ = more acidic = lower pH.","difficulty":"Medium"},{"n":79,"topic":"I","q":"An organic wastewater discharge increases biodegradable loading to a stream. Which paired response is most consistent?","options":["BOD decreases and DO decreases","BOD increases and DO tends to decrease","BOD and DO both necessarily increase","pH becomes exactly 7"],"answer":1,"explanation":"More biodegradable organic matter raises oxygen demand, tending to depress DO. 🇵🇭 BOD up → oxygen consumption up → DO down.","difficulty":"Medium"},{"n":80,"topic":"I","q":"Two equal-flow streams mix. One is 4 mg/L and the other 10 mg/L. Without calculation, what is the mixed concentration?","options":["4 mg/L","7 mg/L","10 mg/L","14 mg/L"],"answer":1,"explanation":"Equal flows make the flow-weighted average equal the arithmetic average: 7 mg/L. 🇵🇭 Simple average works only because equal ang flows.","difficulty":"Medium"},{"n":81,"topic":"I","q":"In the chapter’s freshwater eutrophication framing, which nutrient is commonly emphasized as limiting?","options":["Phosphorus","Argon","Chloride","Helium"],"answer":0,"explanation":"The review flags phosphorus as a common freshwater limiting nutrient. 🇵🇭 Ito ang high-yield conceptual association sa chapter.","difficulty":"Medium"},{"n":82,"topic":"J","q":"A 300-mL BOD bottle contains 30 mL wastewater. DO falls from 8.8 to 4.8 mg/L. Ignoring seed correction, what BOD is indicated?","options":["4 mg/L","40 mg/L","13.3 mg/L","120 mg/L"],"answer":1,"explanation":"P=30/300=.10; BOD=(8.8−4.8)/.10=40 mg/L. 🇵🇭 DO drop in diluted bottle must be divided by sample fraction.","difficulty":"Medium"},{"n":83,"topic":"J","q":"Two BOD bottles show the same 5 mg/L DO drop. Bottle A contains 10% sample; Bottle B contains 5% sample. Which original sample has the larger calculated BOD?","options":["A","B","They are equal","Cannot compare"],"answer":1,"explanation":"BOD=DO drop/P. Smaller dilution fraction gives larger recovered sample concentration: 5/.05=100 vs 5/.10=50 mg/L. 🇵🇭 Same drop pero mas diluted → mas strong ang original sample.","difficulty":"Medium"},{"n":84,"topic":"J","q":"A contaminant concentration exceeds its drinking-water MCL. What does MCL mean in the chapter review?","options":["A legal contaminant limit","A recommended pump speed","A flood recurrence interval","A sewer roughness"],"answer":0,"explanation":"MCL is the enforceable maximum contaminant level concept. 🇵🇭 Standard/limit question ito, hindi treatment formula.","difficulty":"Medium"},{"n":85,"topic":"J","q":"A complaint concerns taste, odor, and staining but not a direct health-based contaminant limit. Which standards category is most relevant?","options":["Primary","Secondary","Pump affinity","Flood-frequency"],"answer":1,"explanation":"Secondary drinking-water standards address aesthetic qualities. 🇵🇭 Primary = health; secondary = aesthetics.","difficulty":"Medium"},{"n":86,"topic":"J","q":"A positive total-coliform result is followed by a test for E. coli. Why is the second test useful?","options":["E. coli is more specific evidence of fecal contamination","E. coli measures hardness","It gives pump efficiency","It determines CN"],"answer":0,"explanation":"E. coli/fecal indicators are more specific to fecal contamination than total coliform. 🇵🇭 Broad indicator first, more specific fecal indicator next.","difficulty":"Medium"},{"n":87,"topic":"J","q":"A treatment plant tests six coagulant doses in parallel beakers and compares residual turbidity after settling. What test is this?","options":["Jar test","BOD test","Darcy test","Hazen-Williams test"],"answer":0,"explanation":"The jar test identifies an effective/optimum coagulant dose. 🇵🇭 Different doses + mixing/settling + turbidity = jar test clue.","difficulty":"Medium"},{"n":88,"topic":"J","q":"An inspector needs a snapshot of river quality at 2:00 PM immediately downstream of an outfall. Which sampling approach fits best?","options":["Grab sample","24-hour composite","Annual maximum series","Unit hydrograph"],"answer":0,"explanation":"A grab sample represents conditions at one time and place. 🇵🇭 Snapshot = grab.","difficulty":"Medium"},{"n":89,"topic":"J","q":"A permit review needs average wastewater strength over an operating day rather than one instantaneous condition. Which sample is preferable?","options":["Grab","Composite","Single field reading only","Blank"],"answer":1,"explanation":"Composite sampling better represents average conditions/loading over time. 🇵🇭 Average over time = composite.","difficulty":"Medium"},{"n":90,"topic":"J","q":"Sound intensity is one million times the reference intensity. Using β=10log10(I/I0), what level results?","options":["6 dB","10 dB","60 dB","1,000,000 dB"],"answer":2,"explanation":"β=10log10(10^6)=60 dB. 🇵🇭 Logarithmic scale—hindi direct ratio ang dB.","difficulty":"Medium"},{"n":91,"topic":"K","q":"Raw water enters a conventional treatment plant. Which process should occur before flocculation?","options":["Coagulation","Disinfection","Final filtration","Activated sludge return"],"answer":0,"explanation":"Conventional sequence: coagulate → flocculate → settle → filter → disinfect. 🇵🇭 Coagulation destabilizes particles before gentle floc growth.","difficulty":"Medium"},{"n":92,"topic":"K","q":"A clarifier treats 9,000 m³/d. If the allowable overflow rate is 25 m/d, what minimum surface area is required?","options":["225 m²","360 m²","625 m²","9,025 m²"],"answer":1,"explanation":"As=Q/vo=9000/25=360 m². 🇵🇭 Reverse overflow-rate problem: area ang unknown.","difficulty":"Medium"},{"n":93,"topic":"K","q":"Two clarifiers have equal volume but Clarifier B receives twice the flow. How does ideal detention time compare?","options":["B has twice the time","B has half the time","Same time","Cannot compare"],"answer":1,"explanation":"t=V/Q; doubling Q halves detention time. 🇵🇭 More flow through same tank = less residence time.","difficulty":"Medium"},{"n":94,"topic":"K","q":"A basin holds 1,500 m³ and treats 7,500 m³/d. What is detention time?","options":["0.2 d or 4.8 hr","5 d","0.5 hr","20 hr"],"answer":0,"explanation":"t=V/Q=.2 d=4.8 hr. 🇵🇭 Units follow the flow denominator; convert days to hours if needed.","difficulty":"Medium"},{"n":95,"topic":"K","q":"A disinfectant residual falls from 2.0 to 1.0 mg/L, but contact time is doubled from 20 to 40 min. What happens to CT?","options":["It halves","It doubles","It remains 40 mg·min/L","It becomes zero"],"answer":2,"explanation":"Initial CT=2×20=40; new CT=1×40=40 mg·min/L. 🇵🇭 Product ang CT, kaya puwedeng compensate ang C at t.","difficulty":"Medium"},{"n":96,"topic":"K","q":"Under Stokes-law conditions, particle diameter is tripled while fluid properties remain the same. How does settling velocity change?","options":["3×","6×","9×","27×"],"answer":2,"explanation":"vs∝d², so 3²=9. 🇵🇭 Diameter squared ang relationship.","difficulty":"Medium"},{"n":97,"topic":"K","q":"A sedimentation designer increases basin depth but keeps surface area and flow unchanged. Which listed performance parameter Q/As remains unchanged?","options":["Overflow rate","Detention time","Basin volume","Water depth"],"answer":0,"explanation":"Overflow rate depends on Q and plan surface area, not depth. Detention time would increase because volume increases. 🇵🇭 Distinguish surface loading from residence time.","difficulty":"Medium"},{"n":98,"topic":"K","q":"An activated-sludge basin receives Q=4,000 m³/d at S0=0.25 kg/m³. Basin volume is 2,000 m³ and X=2 kg/m³. What is F/M?","options":["0.125 d⁻¹","0.25 d⁻¹","0.50 d⁻¹","2.0 d⁻¹"],"answer":1,"explanation":"F/M=QS0/(VX)=4000(.25)/(2000×2)=.25 d⁻¹. 🇵🇭 Food load divided by microorganism mass.","difficulty":"Medium"},{"n":99,"topic":"K","q":"Water has total hardness 150 mg/L as CaCO3 and alkalinity 90 mg/L as CaCO3. What carbonate hardness is used in the review?","options":["60 mg/L","90 mg/L","150 mg/L","240 mg/L"],"answer":1,"explanation":"CH=min(TH,Alk)=90 mg/L as CaCO3. 🇵🇭 Carbonate hardness cannot exceed either total hardness or alkalinity.","difficulty":"Medium"},{"n":100,"topic":"K","q":"A filter bank treats 18,000 m³/d over 450 m². One-third of the filter area is taken offline while total flow remains unchanged. What happens to filter loading rate?","options":["It decreases by one-third","It stays 40 m/d","It rises from 40 to 60 m/d","It rises to 120 m/d"],"answer":2,"explanation":"Original loading=18000/450=40 m/d. Available area=300 m², so new loading=18000/300=60 m/d. 🇵🇭 Same Q through less area → higher surface loading.","difficulty":"Hard"}];

const topicTagalog={A:'Ulan papuntang runoff: peak flow = Rational; runoff depth = SCS CN. Piliin muna kung peak o volume/depth ang hinihingi.',B:'Kapag open channel, isipin Manning. Kapag flow regime, Froude. Huwag isama ang free surface sa wetted perimeter.',C:'Pump questions: power, operating point, NPSH, at series/parallel. Tandaan: series = dagdag head; parallel = dagdag flow.',D:'Pressurized water pipes: Hazen-Williams. Mas mataas na C = mas makinis = mas maliit ang head loss.',E:'Flood control: storage nagpapababa at nagpapahuli ng peak. Ang 100-year flood ay 1% chance bawat taon.',F:'Stormwater: Rational para peak, Manning para conveyance, storage para detention, at hiwalay ang water-quality volume.',G:'Gravity sewer ay open-channel problem. Tingnan ang Manning, minimum velocity, slope, partial flow, at peaking/I-I.',H:'Groundwater: Darcy muna. Kung actual pore-water speed ang tanong, hatiin ang Darcy velocity sa porosity.',I:'Water quality: mass balance para mixing; BOD at DO ay magkaugnay—mas mataas BOD, mas malakas oxygen demand.',J:'Testing: alamin kung legal limit, indicator organism, BOD/DO test, turbidity/jar test, o sampling method ang tinatanong.',K:'Treatment train: coagulate → flocculate → settle → filter → disinfect. I-match ang formula sa unit process.'};
