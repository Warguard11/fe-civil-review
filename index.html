Q',v.C*v.i*v.A,'cfs']],\n['SCS Curve Number Runoff',[['CN','Curve number'],['P','Rainfall P (in)']],v=>{let S=1000/v.CN-10,Q=v.P<=.2*S?0:(v.P-.2*S)**2/(v.P+.8*S);return ['Q',Q,'in (S='+S.toFixed(3)+' in)']}],\n['Manning Velocity (US)',[['n','Manning n'],['R','Hydraulic radius R (ft)'],['S','Slope S']],v=>['V',(1.486/v.n)*v.R**(2/3)*Math.sqrt(v.S),'ft/s']],\n['Froude Number',[['V','Velocity'],['D','Hydraulic depth'],['g','g (32.2 US or 9.81 SI)','32.2']],v=>{let x=v.V/Math.sqrt(v.g*v.D);return ['Fr',x,x<1?'subcritical':x>1?'supercritical':'critical']}],\n['Pump Input Power (SI)',[['Q','Flow Q (m³/s)'],['h','Head h (m)'],['eta','Efficiency η (decimal)']],v=>['P',9810*v.Q*v.h/v.eta/1000,'kW']],\n['Flood Life-Cycle Risk',[['T','Return period T (yr)'],['n','Project life n (yr)']],v=>['R',100*(1-(1-1/v.T)**v.n),'%']],\n['Detention Storage',[['Qin','Inflow (cfs)'],['Qout','Outflow (cfs)'],['t','Duration (min)']],v=>['ΔS',(v.Qin-v.Qout)*v.t*60,'ft³']],\n['Darcy Flow',[['K','Hydraulic conductivity K'],['i','Gradient i'],['A','Area A']],v=>['Q',v.K*v.i*v.A,'consistent flow units']],\n['Flow-Weighted Mixing',[['Q1','Q₁'],['C1','C₁'],['Q2','Q₂'],['C2','C₂']],v=>['Cmix',(v.Q1*v.C1+v.Q2*v.C2)/(v.Q1+v.Q2),'concentration units']],\n['BOD Dilution Test',[['DOi','Initial DO'],['DOf','Final DO'],['Vs','Sample volume (mL)'],['Vb','Bottle volume (mL)','300']],v=>['BOD',(v.DOi-v.DOf)/(v.Vs/v.Vb),'mg/L']],\n['Clarifier Overflow Rate',[['Q','Flow Q'],['A','Surface area As']],v=>['v₀',v.Q/v.A,'Q/area units']]\n];$('#calculators').innerHTML=`<div class=\"hero\"><h1>🧮 FE Formula Calculators</h1><p>Use these to check your hand calculations. On the FE exam, still identify the equation and units yourself first.</p><div class=\"notice\">These calculators implement formulas already included in the uploaded chapter review. They are study/check tools, not a substitute for unit analysis.</div></div><div class=\"calcgrid\">${calcs.map((c,ci)=>`<div class=\"card\"><h3>${c[0]}</h3>${c[1].map(x=>`<div class=\"field\"><label>${x[1]}</label><input id=\"c${ci}_${x[0]}\" type=\"number\" step=\"any\" value=\"${x[2]||''}\"></div>`).join('')}<button class=\"btn\" onclick=\"runCalc(${ci})\">Calculate</button><div id=\"cr${ci}\" class=\"result hidden\"></div></div>`).join('')}</div>`;window._calcs=calcs}\nfunction runCalc(i){let c=window._calcs[i],v={};c[1].forEach(x=>v[x[0]]=parseFloat($('#c'+i+'_'+x[0]).value));if(Object.values(v).some(Number.isNaN)){alert('Enter all values.');return}let r=c[2](v),el=$('#cr'+i);el.classList.remove('hidden');el.innerHTML=`<b>${r[0]} = ${Number.isFinite(r[1])?Number(r[1].toFixed(4)):r[1]} ${r[2]}</b>`}\nlet flashIndex=0,flashBack=false;\n\nfunction flashcards(){let cards=topics.flatMap(t=>t.formulas.map(f=>({topic:t.title,name:f[0],eq:f[1],use:f[2],ex:(formulaExamples[t.id]||{})[f[0]]||'',id:t.id})));window._flash=cards;flashIndex=Math.min(flashIndex,cards.length-1);renderFlash()}\nfunction renderFlash(){let cards=window._flash,c=cards[flashIndex],k=mkey(c.id,c.name);$('#flashcards').innerHTML=`<div class=\"hero\"><h1>🗂️ Formula Flashcards</h1><p>Try to recall the equation and when to use it before flipping the card.</p></div><div class=\"card flash\" onclick=\"flashBack=!flashBack;renderFlash()\">${flashBack?`<div><div class=\"tag\">${c.topic}</div><h2>${c.name}</h2><div class=\"eq\">${c.eq}</div><p>${c.use}</p><div class=\"example\">${c.ex}</div></div>`:`<div><div class=\"tag\">${c.topic}</div><h2>${c.name}</h2><p class=\"muted\">What is the formula? When do you use it?</p><p>Click to reveal</p></div>`}</div><div class=\"barrow\" style=\"margin-top:12px\"><button class=\"btn secondary\" onclick=\"flashIndex=(flashIndex-1+window._flash.length)%window._flash.length;flashBack=false;renderFlash()\">← Previous</button><button class=\"btn\" onclick=\"mastery['${k}']=true;saveState();flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()\">✓ I know this</button><button class=\"btn secondary\" onclick=\"flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()\">Next →</button><span class=\"chip\">${flashIndex+1}/${cards.length}</span></div>`}\nfunction mistakes(){let arr=questions.filter(q=>wrongs.includes(q.n));$('#mistakes').innerHTML=`<div class=\"hero\"><h1>❌ Mistake Review</h1><p>Questions you missed after grading are saved on this device so you can target weak areas.</p><div class=\"chips\"><span class=\"chip\">${arr.length} saved mistakes</span></div></div>${arr.length?arr.map(q=>`<div class=\"card qcard\"><div class=\"tag\">Question ${q.n} • Topic 10.${q.topic}</div><h3>${q.q}</h3><div class=\"explain\"><b>Correct: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div><button class=\"btn secondary\" style=\"margin-top:10px\" onclick=\"wrongs=wrongs.filter(x=>x!==${q.n});saveState();mistakes()\">Mark reviewed</button></div>`).join(''):`<div class=\"card\"><h3>No saved mistakes yet.</h3><p>Take the quiz and press Grade Test. Missed questions will appear here.</p></div>`}`\n}\nlet focusIndex=0,focusReveal=false,focusFilter='all',focusRandom=null,focusChoice=null;\nfunction focusDrill(){\n $('#focusdrill').innerHTML=`<div class=\"hero\"><h1>🔥 FE Focus Drill</h1><p><b>${focusQuestions.length} additional high-yield FE-style drills</b> covering recognition clues, formulas, unit traps, and common conceptual reversals.</p><div class=\"notice focus\"><b>How to use:</b> Answer first. Then reveal the solution and read the FE Trap before moving on.</div><div class=\"quizTop\" style=\"margin-top:12px\"><select id=\"ffilter\" class=\"btn secondary\" onchange=\"focusFilter=this.value;focusIndex=0;focusReveal=false;focusRandom=null;focusChoice=null;renderFocusCard()\"><option value=\"all\">All Focus questions</option>${topics.map(t=>`<option value=\"${t.id}\">${t.title}</option>`).join('')}</select><button class=\"btn secondary\" onclick=\"randomFocus()\">🎲 Random 10</button><button class=\"btn secondary\" onclick=\"focusRandom=null;focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()\">All Questions</button></div></div><div id=\"focuslist\"></div>`;\n $('#ffilter').value=focusFilter;renderFocusCard();\n}\nfunction focusArray(){return focusRandom||focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter)}\nfunction renderFocusCard(){let a=focusArray();if(!a.length){$('#focuslist').innerHTML='<div class=\"card\"><h3>No Focus Drill questions found for this filter.</h3></div>';return}focusIndex=Math.max(0,Math.min(focusIndex,a.length-1));let q=a[focusIndex];let opts=q.o.map((x,i)=>{let cls='opt'+(focusChoice===i?' sel':'');if(focusReveal&&i===q.a)cls+=' correct';if(focusReveal&&focusChoice===i&&i!==q.a)cls+=' wrong';return `<button class=\"${cls}\" onclick=\"focusChoice=${i};renderFocusCard()\">${String.fromCharCode(65+i)}. ${x}</button>`}).join('');let sol=focusReveal?`<div class=\"whybox\"><div class=\"notice good\"><b>Correct Answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b></div><div class=\"example\" style=\"margin-top:12px\"><b>Solution / Why</b><br>${q.e}</div><div class=\"notice focus\" style=\"margin-top:12px\"><b>⚠ FE Trap:</b> ${q.trap}</div></div>`:'';$('#focuslist').innerHTML=`<div class=\"card qcard\" style=\"min-height:400px\"><div class=\"tag\">FE Focus • Topic 10.${q.topic} • ${q.sub}</div><h2 style=\"margin:18px 0\">${q.q}</h2><div style=\"display:grid;gap:10px\">${opts}</div>${sol}</div><div class=\"barrow\" style=\"margin-top:12px\"><button class=\"btn secondary\" onclick=\"prevFocus()\">← Previous</button><button class=\"btn\" onclick=\"focusReveal=!focusReveal;renderFocusCard()\">${focusReveal?'Hide Solution':'Reveal Solution'}</button><button class=\"btn secondary\" onclick=\"nextFocus()\">Next →</button><span class=\"chip\">${focusIndex+1}/${a.length}</span></div>`}\nfunction prevFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex-1+a.length)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction nextFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex+1)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction randomFocus(){let base=focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter);focusRandom=[...base].sort(()=>Math.random()-.5).slice(0,Math.min(10,base.length));focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction strategy(){$('#strategy').innerHTML=`<div class=\"hero\"><h1>🎯 FE Exam Strategy for This Chapter</h1><p>The chapter's own organizing idea is powerful: <b>name the topic, then pull its one formula.</b></p></div><div class=\"grid\"><div class=\"card\"><h3>1. Trigger words</h3><p><b>Peak runoff</b> → Rational. <b>Runoff depth/CN</b> → SCS. <b>Open channel/sewer</b> → Manning. <b>Flow regime</b> → Froude. <b>Pump input</b> → γQh/η. <b>Groundwater</b> → Darcy. <b>Organic oxygen demand</b> → BOD.</p></div><div class=\"card\"><h3>2. Unit traps</h3><p>Rational US form uses acres + in/hr → cfs. Detention with cfs needs seconds. Triangular hydrograph uses mi²/in/hr. Pump SI with γ=9810 N/m³ gives watts. Full circular pipe R=D/4.</p></div><div class=\"card\"><h3>3. Direction checks</h3><p>Higher Manning n → slower. Higher Hazen-Williams C → smoother/faster. Higher CN/C → more runoff. Higher BOD → lower DO. Input pump power > water power.</p></div></div><div class=\"card\" style=\"margin-top:14px\"><h3>Recommended review loop</h3><p>Read one topic → memorize only its trigger + formula → solve its worked example without looking → answer that topic's quiz questions → review every trap you missed. Do not try to memorize the entire chapter as one formula sheet.</p></div>`}\n$$('#nav button').forEach(b=>b.onclick=()=>{show(b.dataset.view); if(b.dataset.view==='home')home();if(b.dataset.view==='formulas')formulas();if(b.dataset.view==='quiz')quiz();if(b.dataset.view==='focusdrill')focusDrill();if(b.dataset.view==='strategy')strategy();if(b.dataset.view==='calculators')calculators();if(b.dataset.view==='flashcards')flashcards();if(b.dataset.view==='mistakes')mistakes()});\n$('#topicnav').innerHTML=topics.map(t=>`<button onclick=\"openTopic('${t.id}')\">${t.icon} ${t.title}</button>`).join('');home();\n<\/script></body></html>";const materialsDoc="<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>FE Civil Materials Review Lab</title><style>\n:root{--bg:#07131f;--panel:#0d2031;--panel2:#102a40;--text:#eaf5ff;--muted:#9db7ca;--accent:#44c7f4;--good:#51d88a;--warn:#ffcc66;--bad:#ff7a7a;--line:#1e425e}*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#06101a,#0a1b2a 55%,#092438);color:var(--text)}button,input{font:inherit}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:#071522;border-right:1px solid var(--line);overflow:auto}.brand{font-size:20px;font-weight:800;margin-bottom:4px}.sub{color:var(--muted);font-size:12px;margin-bottom:18px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#12314a;color:white}.main{padding:28px;max-width:1250px;width:100%;margin:auto}.hero{padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#0c2840,#0b1d2d);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:32px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#123650;border:1px solid #245775;padding:5px 9px;border-radius:999px;color:#cdefff;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:rgba(13,32,49,.94);border:1px solid var(--line);border-radius:15px;padding:18px}.card h3{margin-top:0}.topicCard{cursor:pointer;transition:.15s}.topicCard:hover{transform:translateY(-2px);border-color:#3c8bb6}.muted{color:var(--muted)}.formula{padding:12px;border-radius:10px;background:#071827;border:1px solid #173a55;margin:8px 0}.eq{font-family:Cambria Math,Georgia,serif;font-size:18px;color:#bcecff}.tag{font-size:11px;color:#7fd9ff}.important li{margin:7px 0}.example{border-left:4px solid var(--accent);padding:14px;background:#0a1a28;border-radius:8px}.steps{counter-reset:s}.steps div{margin:6px 0}.steps div:before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#174969;margin-right:8px}.diagram{margin:16px 0;padding:18px;background:#071827;border-radius:12px;text-align:center;border:1px dashed #2b5c79}.diagram svg{max-width:100%;height:170px}.quizTop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#17658e;color:white;cursor:pointer}.btn.secondary{background:#173044}.qcard{margin:12px 0}.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border-radius:9px;border:1px solid #234c68;background:#0a1b29;color:var(--text);cursor:pointer}.opt.sel{border-color:#55bfe8;background:#12344c}.opt.correct{border-color:var(--good);background:#113d2a}.opt.wrong{border-color:var(--bad);background:#472323}.explain{margin-top:10px;padding:10px;border-radius:8px;background:#0b2636;color:#cfe9f7}.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #28516c;background:#071827;color:white;margin:10px 0}.hidden{display:none}.progress{height:9px;background:#0a1b29;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#35a9d5;width:0}.score{font-size:24px;font-weight:800}.footer{margin:28px 0;color:#7796aa;font-size:12px}.kpi{font-size:28px;font-weight:800}.mini{font-size:12px;color:var(--muted)}.master{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.master button{padding:6px 9px;border-radius:8px;border:1px solid #28516c;background:#0a1b29;color:#cfe9f7;cursor:pointer}.master button.done{background:#113d2a;border-color:var(--good)}.calcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin:7px 0}.field input,.field select{padding:8px;border-radius:8px;border:1px solid #28516c;background:#071827;color:white;width:100%}.result{padding:12px;background:#113d2a;border:1px solid #2d7651;border-radius:10px;margin-top:10px;font-size:18px}.flash{min-height:260px;display:grid;place-items:center;text-align:center;cursor:pointer}.flash .eq{font-size:26px}.barrow{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-left:4px solid var(--warn);background:#2a2516;border-radius:8px}.focus{border-left:4px solid #51d88a}.whybox{padding:10px;background:#0b2636;border-radius:8px;margin-top:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#173044;font-size:11px;margin-right:5px}.tagalog{padding:12px;background:#10243a;border-radius:10px;border:1px solid #214766;margin-top:12px}.subjump{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.subjump button{font-size:12px;padding:6px 8px;border:1px solid #28516c;background:#0a1b29;color:#cfe9f7;border-radius:8px;cursor:pointer}@media(max-width:900px){.calcgrid{grid-template-columns:1fr}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:1fr}.main{padding:16px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}}\n</style></head><body><div class=\"app\"><aside class=\"side\"><div class=\"brand\">FE Civil Review Lab</div><div class=\"sub\">Materials</div><div class=\"nav\" id=\"nav\"><button data-view=\"home\" class=\"active\">🏠 Dashboard</button><button data-view=\"formulas\">📐 Formula Bank</button><button data-view=\"quiz\">🧠 100-Question Test</button><button data-view=\"focusdrill\">🔥 FE Focus Drill</button><button data-view=\"strategy\">🎯 Exam Strategy</button><button data-view=\"calculators\">🧮 Calculators</button><button data-view=\"flashcards\">🗂️ Flashcards</button><button data-view=\"mistakes\">❌ Mistake Review</button></div><hr style=\"border-color:#17354b\"><div class=\"nav\" id=\"topicnav\"></div></aside><main class=\"main\"><section id=\"home\"></section><section id=\"topic\" class=\"hidden\"></section><section id=\"formulas\" class=\"hidden\"></section><section id=\"quiz\" class=\"hidden\"></section><section id=\"focusdrill\" class=\"hidden\"></section><section id=\"strategy\" class=\"hidden\"></section><section id=\"calculators\" class=\"hidden\"></section><section id=\"flashcards\" class=\"hidden\"></section><section id=\"mistakes\" class=\"hidden\"></section><div class=\"footer\">Study software built from the uploaded FE Civil Chapter 10 extract. Questions are original practice variants derived from the chapter's concepts and formulas, not copied exam questions.</div></main></div><script>\nconst topics=[{\"id\": \"A\", \"title\": \"Concrete Materials & Cement\", \"important\": [\"Concrete ingredients: cement, water, fine aggregate, coarse aggregate and air/admixtures.\", \"Type I = general purpose; Type II = lower heat/moderate sulfate resistance; Type III = high early strength.\", \"Initial set begins as paste stiffens; final set occurs after sufficient hardening.\", \"Concrete is strong in compression and weak in tension.\"], \"formulas\": [[\"Water-cement ratio\", \"W/C = Wwater/Wcement\", \"Concrete strength/workability relationship\"], [\"Concrete compressive strength\", \"f′c = P/A\", \"Cylinder compression strength\"]], \"icon\": \"🧱\", \"why\": \"Concrete constituents, cement types, setting, and compressive behavior. Start here for basic concrete-material recognition.\", \"example\": {\"q\": \"A 150-mm-diameter concrete cylinder fails at 530 kN. Estimate f′c.\", \"steps\": [\"Area = π(150²)/4 = 17,671 mm².\", \"f′c = 530,000/17,671 = 30.0 N/mm².\", \"f′c ≈ 30 MPa.\"], \"tip\": \"Use the cylinder cross-sectional area; N/mm² is MPa.\"}}, {\"id\": \"B\", \"title\": \"Concrete Mix Design & Moisture Corrections\", \"important\": [\"Lower W/C generally increases strength; adding water alone increases slump but can reduce strength.\", \"Superplasticizer improves workability without increasing water.\", \"Air entrainment improves freeze-thaw durability.\", \"Absolute-volume method balances ingredient volumes to one unit volume.\", \"Field aggregate moisture above absorption contributes free water and must be deducted from batch water.\"], \"formulas\": [[\"Absolute volume\", \"Vᵢ = mᵢ/(SGᵢρw)\", \"Concrete proportioning\"], [\"Aggregate free moisture\", \"Free moisture % = field MC − absorption\", \"Find surface/free water in wet aggregate\"], [\"Batch-water correction\", \"Water to add = design water − free aggregate water\", \"Correct concrete mixing water\"]], \"icon\": \"⚖️\", \"why\": \"Concrete proportioning, water-cement ratio, workability, admixtures, absolute volume, and aggregate moisture corrections.\", \"example\": {\"q\": \"A mix requires 180 kg water and 400 kg cement. Find W/C.\", \"steps\": [\"W/C = water/cement.\", \"W/C = 180/400.\", \"W/C = 0.45.\"], \"tip\": \"Do not use total aggregate or total batch mass in the W/C denominator.\"}}, {\"id\": \"C\", \"title\": \"Aggregates\", \"important\": [\"Sieve analysis determines particle-size distribution.\", \"No. 4 sieve is the common fine/coarse aggregate split in the source.\", \"Well-graded aggregate packs densely; gap-graded aggregate has missing size ranges.\", \"Higher fineness modulus means coarser fine aggregate.\", \"Specific gravity and absorption are important for mix proportioning.\"], \"formulas\": [[\"Fineness modulus\", \"FM = Σ(cumulative % retained)/100\", \"Fine-aggregate gradation\"], [\"Aggregate bulk SG\", \"Gb = A/(B−C)\", \"Oven-dry, SSD and submerged masses\"], [\"Aggregate absorption\", \"Abs = (B−A)/A × 100%\", \"Aggregate water absorption\"]], \"icon\": \"🪨\", \"why\": \"Aggregate gradation, fineness modulus, specific gravity, absorption, and how aggregate properties affect mix design.\", \"example\": {\"q\": \"A 500-g aggregate sample has 125 g cumulatively retained on a sieve. Find percent passing.\", \"steps\": [\"Cumulative % retained = 125/500×100 = 25%.\", \"Percent passing = 100−25.\", \"Percent passing = 75%.\"], \"tip\": \"Passing is the complement of cumulative retained.\"}}, {\"id\": \"D\", \"title\": \"Asphalt / HMA & Superpave\", \"important\": [\"HMA consists primarily of aggregate with asphalt binder.\", \"Air voids, VMA and VFA are key volumetric properties.\", \"Too little binder/high air voids can produce brittle/permeable mix; too much binder can promote instability/rutting.\", \"Superpave considers aggregate properties, binder selection, climate/traffic, volumetrics and moisture susceptibility.\", \"Asphalt is viscoelastic and experiences repeated traffic/fatigue loading.\"], \"formulas\": [[\"HMA air voids\", \"Va = (1 − Gmb/Gmm) × 100%\", \"Compacted asphalt air voids\"], [\"Voids filled with asphalt\", \"VFA = (VMA − Va)/VMA × 100%\", \"Binder-filled portion of VMA\"]], \"icon\": \"🛣️\", \"why\": \"Hot-mix asphalt volumetrics and Superpave concepts: air voids, VMA, VFA, binder amount, stability, moisture and traffic effects.\", \"example\": {\"q\": \"An HMA specimen has Gmb=2.40 and Gmm=2.50. Find air voids.\", \"steps\": [\"Va=(1−Gmb/Gmm)×100%.\", \"Va=(1−2.40/2.50)×100%.\", \"Va=4.0%.\"], \"tip\": \"Gmb goes over Gmm; reversing them can produce a negative result.\"}}, {\"id\": \"E\", \"title\": \"Stress–Strain & Tensile Properties\", \"important\": [\"Elastic slope gives modulus E; 0.2% offset defines yield when no sharp yield point exists.\", \"UTS is the maximum engineering stress.\", \"Engineering values use original dimensions; true values account for deformation.\", \"Percent elongation and reduction in area measure ductility.\"], \"formulas\": [[\"Engineering stress\", \"σe = P/A₀\", \"Tensile stress using original area\"], [\"Engineering strain\", \"εe = (L−L₀)/L₀\", \"Engineering strain\"], [\"True stress\", \"σt = σe(1+εe)\", \"Uniform-deformation conversion\"], [\"True strain\", \"εt = ln(1+εe)\", \"True strain conversion\"], [\"Percent elongation\", \"%EL = (Lf−L₀)/L₀ × 100%\", \"Ductility\"], [\"Percent reduction in area\", \"%RA = (A₀−Af)/A₀ × 100%\", \"Ductility\"]], \"icon\": \"📈\", \"why\": \"Read tensile stress-strain behavior: modulus, yield, UTS, engineering vs true quantities, and ductility.\", \"example\": {\"q\": \"A tensile specimen carries 60 kN on an original area of 300 mm². Find engineering stress.\", \"steps\": [\"σ=P/A₀.\", \"σ=60,000/300=200 N/mm².\", \"σ=200 MPa.\"], \"tip\": \"Engineering stress uses original area, not the necked area.\"}}, {\"id\": \"F\", \"title\": \"Mechanical Properties & Material Behavior\", \"important\": [\"Stiffness is E; strength is yield/ultimate stress.\", \"Ductility is deformation before fracture; toughness is total energy to fracture; resilience is elastic energy to yield.\", \"Elastic deformation recovers; plastic deformation is permanent.\", \"Viscous and viscoelastic behavior are time-dependent.\"], \"formulas\": [[\"Hooke's law / modulus\", \"E = σ/ε\", \"Elastic stiffness\"], [\"Modulus of resilience\", \"Ur = σy²/(2E)\", \"Elastic energy per unit volume to yield\"], [\"Axial elastic deformation\", \"δ = PL/(AE)\", \"Elastic axial deformation\"]], \"icon\": \"🔩\", \"why\": \"Distinguish stiffness, strength, ductility, toughness and resilience, then apply basic elastic deformation relations.\", \"example\": {\"q\": \"A bar has σ=120 MPa and ε=0.0006 in the elastic range. Find E.\", \"steps\": [\"E=σ/ε.\", \"E=120/0.0006=200,000 MPa.\", \"E=200 GPa.\"], \"tip\": \"E is stiffness; it is not yield or ultimate strength.\"}}, {\"id\": \"G\", \"title\": \"Hardness, Impact, Fatigue & Fracture\", \"important\": [\"Hardness measures resistance to indentation.\", \"Brinell hardness can estimate tensile strength of plain-carbon steel.\", \"Charpy uses a notched specimen and impact energy; it can identify ductile-to-brittle transition.\", \"S-N curves describe fatigue; steel may show an endurance limit.\", \"Jominy evaluates hardenability.\", \"Fracture occurs when stress intensity reaches material fracture toughness KIC.\"], \"formulas\": [[\"BHN to tensile strength\", \"TS ≈ 500(BHN) psi ≈ 3.5(BHN) MPa\", \"Plain-carbon steel estimate\"], [\"Fracture stress intensity\", \"K = Yσ√(πa)\", \"Crack/fracture check against KIC\"]], \"icon\": \"🔨\", \"why\": \"Material test recognition for hardness, impact, fatigue, hardenability and fracture mechanics.\", \"example\": {\"q\": \"Plain-carbon steel has BHN=180. Estimate tensile strength.\", \"steps\": [\"Use TS≈3.5(BHN) MPa.\", \"TS≈3.5×180.\", \"TS≈630 MPa.\"], \"tip\": \"This BHN correlation is a rule of thumb for plain-carbon steel.\"}}, {\"id\": \"H\", \"title\": \"Creep, Relaxation & Thermal Effects\", \"important\": [\"Creep: constant stress with strain increasing over time.\", \"Stress relaxation: constant strain with stress decreasing over time.\", \"Creep is especially important under sustained loading and elevated temperature.\", \"Free temperature change causes deformation without restraint stress.\", \"Full restraint converts thermal strain into thermal stress.\"], \"formulas\": [[\"Thermal strain\", \"εth = αΔT\", \"Free thermal strain\"], [\"Free thermal deformation\", \"δ = αLΔT\", \"Unrestrained member\"], [\"Fully restrained thermal stress\", \"σ = EαΔT\", \"Restrained temperature change\"]], \"icon\": \"🌡️\", \"why\": \"Time- and temperature-dependent behavior: creep, stress relaxation, free thermal movement and restrained thermal stress.\", \"example\": {\"q\": \"A fully restrained steel member has E=200 GPa, α=12×10⁻⁶/°C and heats 40°C. Find stress magnitude.\", \"steps\": [\"σ=EαΔT.\", \"σ=200,000×12×10⁻⁶×40 MPa.\", \"σ=96 MPa, compression for heating.\"], \"tip\": \"A free member would develop deformation but ideally no thermal stress.\"}}, {\"id\": \"I\", \"title\": \"Material Testing, Specifications, QC & QA\", \"important\": [\"Tensile, compression, impact and hardness tests measure different material responses.\", \"Concrete slump tests fresh workability; cylinder compression tests hardened f′c.\", \"Specifications distinguish test method, sampling and acceptance criteria.\", \"QC is producer process control; QA is owner/independent verification.\", \"Sampling should be random and representative.\"], \"formulas\": [[\"Allowable stress\", \"σallow = σfailure/FS\", \"Factor-of-safety/allowable-stress problems\"], [\"Flexural stress\", \"σmax = Mc/I\", \"Beam/flexural strength\"]], \"icon\": \"🔬\", \"why\": \"Match material properties to the correct tests and understand specifications, sampling, QC, QA, factor of safety and flexure.\", \"example\": {\"q\": \"A material fails at 60 ksi and design FS=2.5. Find allowable stress.\", \"steps\": [\"σallow=σfailure/FS.\", \"σallow=60/2.5.\", \"σallow=24 ksi.\"], \"tip\": \"Factor of safety divides failure strength; it does not multiply allowable stress.\"}}, {\"id\": \"J\", \"title\": \"Wood\", \"important\": [\"Wood is anisotropic/orthotropic; longitudinal, radial and tangential properties differ.\", \"Wood is strongest in the longitudinal/grain direction in the source.\", \"Wood properties depend on moisture content.\", \"Seasoning reduces moisture to a suitable level and improves durability.\", \"Design adjustment factors multiply.\"], \"formulas\": [[\"Wood moisture content\", \"MC = (Mwet−Mod)/Mod × 100%\", \"Moisture relative to oven-dry mass\"], [\"Adjusted wood stress\", \"F′b = Fb·CD·CM·Ct…\", \"Adjusted allowable wood stress\"]], \"icon\": \"🪵\", \"why\": \"Wood behavior with grain direction, moisture, seasoning, grading and allowable-stress adjustment factors.\", \"example\": {\"q\": \"Wood weighs 575 g wet and 500 g oven dry. Find moisture content.\", \"steps\": [\"MC=(Mwet−Mod)/Mod×100%.\", \"MC=(575−500)/500×100%.\", \"MC=15%.\"], \"tip\": \"Wood moisture content uses oven-dry mass as the denominator.\"}}, {\"id\": \"K\", \"title\": \"Composite & General Material Properties\", \"important\": [\"Composite properties may be estimated from constituent fractions for the loading/property model stated.\", \"Longitudinal iso-strain modulus is a volume-weighted modulus.\", \"Specific gravity is dimensionless; density is SG times water density.\", \"Use reasonableness checks: a weighted-average property should normally lie between constituent values for the stated simple model.\"], \"formulas\": [[\"Rule of mixtures\", \"Ec = ΣfiEi\", \"Longitudinal iso-strain composite modulus\"], [\"Factor-weighted composite property\", \"Propertyc = Σfi Propertyi\", \"Simple constituent-weighted property\"], [\"Density from SG\", \"ρ = SGρw\", \"Convert specific gravity to density\"]], \"icon\": \"🧩\", \"why\": \"Composite-property estimates, rule of mixtures, specific gravity and density conversions.\", \"example\": {\"q\": \"A longitudinal composite is 60% fiber with E=200 GPa and 40% matrix with E=20 GPa. Find Ec.\", \"steps\": [\"Ec=ΣfiEi.\", \"Ec=0.60(200)+0.40(20).\", \"Ec=128 GPa.\"], \"tip\": \"For this simple weighted model, the result should lie between the constituent moduli.\"}}];\nconst subtopicTagalog={\n\"Rational Method\":\"Ginagamit ang Rational Method para tantiyahin ang peak runoff o pinakamataas na daloy mula sa maliit na drainage area. Kapag ibinigay ang runoff coefficient C, rainfall intensity i, at area A, ito ang unang formula na dapat isipin. Mas mataas ang C o i, mas mataas ang peak runoff.\",\n\"Composite C\":\"Kapag iba-iba ang surface ng watershed gaya ng pavement, roof, at grass, hindi puwedeng simpleng i-average ang C. I-weight ang bawat runoff coefficient ayon sa lawak ng area nito para makuha ang representative C ng buong site.\",\n\"SCS storage\":\"Ang S ay potential maximum retention ng lupa pagkatapos magsimula ang runoff. Nakadepende ito sa Curve Number: mataas na CN ay mas maliit na storage at karaniwang mas maraming runoff; mababang CN ay mas malaking infiltration/storage.\",\n\"SCS runoff\":\"Ginagamit ang SCS Curve Number runoff equation kapag runoff depth o runoff volume mula sa isang storm ang hinahanap. Kailangan muna ang CN para makuha ang S. Walang direct runoff kung hindi lalampas ang rainfall sa initial abstraction na 0.2S.\",\n\"Lag\":\"Ang lag time ay approximate delay ng watershed response mula rainfall papunta sa hydrograph response. Sa review relation, tlag=0.6tc. Mas maikling lag ay karaniwang mas mabilis at mas matarik na watershed response.\",\n\"Time to peak\":\"Ang tp ang oras hanggang peak ng unit hydrograph. Pinagsasama nito ang kalahati ng effective rainfall duration at watershed lag time, kaya mahalaga ito sa timing ng peak discharge.\",\n\"Triangular UH peak\":\"Ginagamit ito para tantiyahin ang peak discharge ng triangular unit hydrograph mula watershed area, direct-runoff depth, at time to peak. Siguraduhing tama ang required units dahil unit-specific ang coefficient na 484.\",\n\"Horton infiltration\":\"Ipinapakita ng Horton equation kung paano bumababa ang infiltration capacity habang tumatagal ang ulan. Nagsisimula ito malapit sa f0 at unti-unting lumalapit sa final capacity fc.\",\n\"Manning velocity\":\"Ginagamit ang Manning equation para sa open-channel o gravity flow. Ang velocity ay tumataas kapag mas malaki ang hydraulic radius o slope, at bumababa kapag mas mataas ang roughness n.\",\n\"Discharge\":\"Ang Q=VA ay continuity relation: discharge ay velocity times flow area. Gamitin kapag alam ang average velocity at cross-sectional area, o para hanapin ang isa sa tatlong variables.\",\n\"Hydraulic radius\":\"Ang hydraulic radius R=A/P ay sukatan ng efficiency ng flow section. Ang P ay wetted perimeter lamang—huwag isama ang free water surface sa open channel.\",\n\"Specific energy\":\"Ang specific energy ay depth plus velocity head sa open channel. Ginagamit ito sa pag-aaral ng critical flow at transitions; para sa given discharge, minimum ang specific energy sa critical depth.\",\n\"Critical depth\":\"Ang critical depth ay depth kung saan Fr=1 at minimum ang specific energy. Sa rectangular channel, gamitin ang unit discharge q=Q/b, hindi ang total Q direkta sa formula.\",\n\"Froude\":\"Ang Froude number ang mabilis na paraan para i-classify ang open-channel flow: Fr<1 subcritical, Fr=1 critical, at Fr>1 supercritical. Inihahambing nito ang flow velocity sa gravity-wave speed.\",\n\"Rectangular weir\":\"Ginagamit ang weir equation para sa discharge na dumadaan sa sharp-crested rectangular weir. Napakasensitive ng Q sa head H dahil H^(3/2), kaya mahalagang tama ang head measurement.\",\n\"Bernoulli + loss\":\"Gamitin ang Bernoulli energy equation para ikumpara ang pressure head, elevation head, velocity head, at head losses sa dalawang points. Idagdag ang pump head o turbine head kung kasama sa system.\",\n\"Pump input power\":\"Kinukuwenta nito ang power na kailangang ibigay sa pump. Ang useful water power ay γQh, pero dahil may losses, hinahati sa efficiency η para makuha ang required input power.\",\n\"System curve\":\"Ang system curve ay head na kailangan ng piping system sa bawat flow rate. Binubuo ito ng static head at friction loss; ang intersection nito sa pump curve ang actual operating point.\",\n\"NPSH available\":\"Ang NPSHA ay available suction head bago magkaroon ng vaporization/cavitation. Para safe ang pump, dapat mas mataas ang NPSHA kaysa NPSHR, preferably may margin.\",\n\"Affinity flow\":\"Sa parehong pump geometry, ang flow ay approximately proportional sa rotational speed. Halimbawa, 10% increase sa speed ay roughly 10% increase sa Q.\",\n\"Affinity head\":\"Ang pump head ay proportional sa square ng speed. Kaya maliit na pagbabago sa rpm ay mas malaking pagbabago sa head.\",\n\"Affinity power\":\"Ang required pump power ay proportional sa cube ng speed. Ito ang dahilan kung bakit mabilis tumaas ang power demand kapag tinaasan ang pump speed.\",\n\"Hazen-Williams velocity\":\"Ginagamit ang Hazen-Williams para sa pressurized water pipes. Ang C ay smoothness coefficient: mas mataas ang C, mas smooth ang pipe at karaniwang mas kaunti ang resistance.\",\n\"HW head loss (US)\":\"Ginagamit ito para hanapin ang friction head loss sa water-distribution pipe. Tumataas nang malakas ang loss kapag tumataas ang Q at bumababa ang diameter; mas mataas na C ay nagpapababa ng loss.\",\n\"Continuity at node\":\"Sa bawat junction ng pipe network, dapat equal ang total inflow at total outflow. Ito ang mass-conservation rule na ginagamit kasama ng energy/head-loss equations.\",\n\"Loop balance\":\"Sa closed pipe-network loop, ang algebraic sum ng head losses ay zero. Ito ang pangunahing energy condition sa Hardy Cross-type network calculations.\",\n\"Fire storage\":\"Ang required fire-storage volume ay fire-flow rate multiplied by required duration. Pinaka-common trap ang hindi pag-convert ng hours sa minutes kapag gpm ang flow.\",\n\"Pressure head\":\"Ginagamit ang relation na ito para mabilis i-convert ang water pressure sa equivalent feet of water head. Sa water, 1 psi ay approximately 2.31 ft of head.\",\n\"Spillway/weir\":\"Ginagamit para sa discharge sa spillway o weir. Dahil Q ay proportional sa H^(3/2), ang pagtaas ng water head ay mabilis na nagpapataas ng discharge capacity.\",\n\"Storage change\":\"Ito ay continuity para sa reservoir o detention storage: kung mas malaki ang inflow kaysa outflow, tumataas ang storage; kung mas malaki ang outflow, bumababa ang storage.\",\n\"Attenuation\":\"Ang attenuation ay percent o fraction na nabawas sa peak flow pagkatapos ng storage/routing. Mas malaking attenuation ibig sabihin mas epektibong napababa ang flood peak.\",\n\"Annual exceedance\":\"Ang return period T ay inverse ng annual exceedance probability. Halimbawa, 100-year event ay 1% chance bawat taon—hindi ibig sabihin na eksaktong isang beses lang kada 100 taon.\",\n\"Life-cycle risk\":\"Ginagamit ito para hanapin ang chance na mangyari kahit isang exceedance sa loob ng maraming taon. Mas mahaba ang project life, mas tumataas ang cumulative risk kahit maliit ang annual probability.\",\n\"Weibull plotting\":\"Ginagamit ang Weibull plotting position para tantiyahin ang return period mula ranked historical events. Ang m=1 ang pinakamalaking event sa record.\",\n\"Peak runoff\":\"Ito rin ang Rational Method application sa stormwater design. Gamitin para sa peak flow mula sa maliit na site gamit ang C, rainfall intensity, at drainage area.\",\n\"Gutter flow\":\"Ginagamit sa pag-estimate ng stormwater flow capacity sa street gutter. Malakas ang epekto ng spread T, cross slope, longitudinal slope, at roughness n sa capacity.\",\n\"Storm sewer Manning\":\"Para sa gravity storm sewer, gamitin ang Manning equation. Kung full circular pipe, R=D/4 at A=πD²/4 bago kunin ang Q.\",\n\"Detention estimate\":\"Quick estimate ito ng required storage mula sa excess inflow over allowed outflow times duration. Kung cfs ang flow, i-convert ang time sa seconds para ft³ ang volume.\",\n\"Volumetric coefficient\":\"Ang Rv ay empirical runoff-volume coefficient based sa percent imperviousness. Mas impervious ang site, mas mataas ang Rv at mas malaking water-quality runoff volume.\",\n\"Water quality volume\":\"Ginagamit para tantiyahin ang stormwater volume na kailangang i-treat para sa water quality. Huwag ipagkamali sa peak-flow detention sizing dahil magkaibang design objective ang volume treatment at peak control.\",\n\"Manning sewer\":\"Gravity sanitary sewers behave like open channels kaya Manning ang pangunahing equation. Kailangan ang hydraulic radius, slope, at roughness para makuha ang velocity o discharge.\",\n\"Minimum slope\":\"Ginagamit para hanapin ang minimum sewer slope na kailangan para maabot ang target self-cleansing velocity. Mas maliit na pipe/hydraulic radius o mas rough na pipe ay maaaring mangailangan ng mas malaking slope.\",\n\"Harmon peak factor\":\"Ang Harmon factor ay ginagamit para i-convert ang average sanitary flow sa peak sanitary flow based sa population. Tandaan na P ay population in thousands sa formula na ito.\",\n\"Peak sanitary flow\":\"Peak sanitary flow ay average flow multiplied by peaking factor, pagkatapos ay idagdag ang I/I kung hinihingi ng problem. Ito ang mas relevant sa capacity design kaysa average flow lamang.\",\n\"Invert drop\":\"Ang invert drop ay vertical elevation difference sa sewer run. Simple itong slope times horizontal length at useful sa manhole/invert elevation problems.\",\n\"Darcy velocity\":\"Ang Darcy velocity o specific discharge ay K times hydraulic gradient. Hindi ito actual pore-water speed; apparent flow rate ito based sa gross cross-sectional area.\",\n\"Darcy discharge\":\"Ginagamit ang Q=KiA para sa groundwater flow through porous media. Kailangan ang hydraulic conductivity, hydraulic gradient, at gross area perpendicular sa flow.\",\n\"Seepage velocity\":\"Ito ang actual average velocity ng tubig sa pore spaces. Mas mataas ito kaysa Darcy velocity dahil ang tubig ay dumadaloy lamang sa void area; divide Darcy velocity by porosity n.\",\n\"Transmissivity\":\"Ang transmissivity T=Kb ay combined ability ng buong saturated aquifer thickness na mag-transmit ng water. Units nito ay area per time.\",\n\"Confined Thiem\":\"Ginagamit sa steady radial flow papunta sa well sa confined aquifer. Linear head difference ang ginagamit at transmissivity T ang pangunahing aquifer parameter.\",\n\"Unconfined Thiem\":\"Ginagamit sa steady well flow sa unconfined aquifer. Clue sa formula ang squared heads h² dahil nagbabago ang saturated thickness kasama ng water-table elevation.\",\n\"Unconfined storage\":\"Para sa unconfined aquifer, specific yield Sy ang ginagamit para tantiyahin ang drained water volume dahil sa pagbaba ng water table.\",\n\"Confined storage\":\"Para sa confined aquifer, storage coefficient S ang ginagamit kasama ng aquifer area at head change para tantiyahin ang released/stored water volume.\",\n\"BOD exerted\":\"Ipinapakita nito kung gaano karaming ultimate BOD ang na-exert sa time t. Habang tumatagal, lumalapit ang BODt sa BODu ngunit hindi agad equal dito.\",\n\"Ultimate from BOD5\":\"Ginagamit kapag BOD5 ang measured value pero ultimate BOD ang hinihingi. I-correct ang five-day fraction gamit ang first-order decay constant k.\",\n\"DO deficit\":\"Ang DO deficit ay difference ng saturation DO at actual DO. Mas malaking deficit ay mas mababang actual oxygen condition; maximum deficit corresponds sa minimum DO.\",\n\"Critical deficit\":\"Ginagamit sa oxygen-sag analysis para tantiyahin ang maximum oxygen deficit sa critical time. Pinagsasama nito ang deoxygenation at reaeration effects.\",\n\"Mixing\":\"Kapag dalawang streams o flows na may magkaibang concentration ang naghahalo, gamitin ang flow-weighted mass balance. Huwag simple average maliban kung equal ang flows.\",\n\"pH\":\"Ang pH ay negative base-10 logarithm ng hydrogen-ion concentration. Mas mababang pH ay mas acidic; bawat 1 pH unit ay factor of 10 change sa [H+].\",\n\"BOD dilution test\":\"Sa BOD bottle test, ang measured DO drop ay para sa diluted sample. Divide ang DO drop by sample fraction P para ma-estimate ang BOD ng original sample.\",\n\"Dilution fraction\":\"Ang P ay fraction ng bottle volume na actual wastewater sample. Mahalaga ito sa BOD calculation dahil mas maliit na sample fraction means mas malaking correction sa observed DO drop.\",\n\"Sound level concept\":\"Ang decibel scale ay logarithmic. Ang formula ay nagko-convert ng intensity ratio sa dB, kaya malaking intensity changes ay nagiging mas maliit na numerical dB changes.\",\n\"Velocity gradient\":\"Ang G ay measure ng mixing intensity sa coagulation/flocculation. Nakadepende ito sa power input, fluid viscosity, at basin volume.\",\n\"Overflow rate\":\"Ang clarifier overflow rate ay flow divided by plan surface area. Surface area—not basin volume—ang key sizing parameter para sa ideal settling concept.\",\n\"Detention time\":\"Ang detention time ay theoretical average time na nananatili ang water sa basin. Compute as volume divided by flow at bantayan ang time units.\",\n\"Stokes settling\":\"Ginagamit ang Stokes law para sa maliit na particles sa laminar settling regime. Settling velocity ay proportional sa particle diameter squared, kaya malaking epekto ang particle size.\",\n\"Filter loading\":\"Ang filter loading rate ay flow divided by filter surface area. Ginagamit ito para i-check kung gaano karaming water ang pinoproseso bawat unit filter area.\",\n\"Disinfection\":\"Ang CT concept ay disinfectant concentration times contact time. Mas mataas na concentration o mas mahabang contact time ay nagpapataas ng CT, subject sa required treatment criteria.\",\n\"Food/Microorganism\":\"Ang F/M ratio ay organic food loading relative sa mass ng microorganisms sa activated-sludge aeration basin. Ginagamit ito bilang biological-process loading indicator.\",\n\"Weir loading\":\"Ang weir loading ay clarifier flow divided by total outlet-weir length. Ginagamit ito para i-check kung overloaded ang effluent withdrawal along the weir.\",\n\"Carbonate hardness\":\"Ang carbonate hardness ay limited ng mas maliit sa total hardness at alkalinity, parehong expressed as CaCO3. Ang natitirang hardness beyond CH ay noncarbonate hardness.\"\n};\n\nconst formulaExamples={\nA:{\"Rational Method\":\"C=0.60, i=2.0 in/hr, A=15 ac → Q=0.60(2)(15)=18 cfs.\",\"Composite C\":\"10 ac pavement C=.90 + 20 ac grass C=.20 → C=(.9×10+.2×20)/30=0.433.\",\"SCS storage\":\"CN=80 → S=1000/80−10=2.50 in.\",\"SCS runoff\":\"CN=80 gives S=2.5 in; P=4 in → Q=(4−0.5)²/(4+2)=2.04 in.\",\"Lag\":\"tc=2.0 hr → tlag=.6(2)=1.2 hr.\",\"Time to peak\":\"D=1 hr, tlag=1.2 hr → tp=.5+1.2=1.7 hr.\",\"Triangular UH peak\":\"A=2 mi², runoff depth=1 in, tp=2 hr → Qp=484(2)(1)/2=484 cfs.\",\"Horton infiltration\":\"f0=3, fc=.5 in/hr, k=1/hr, t=2 hr → f=.5+2.5e⁻²≈.84 in/hr.\"},\nB:{\"Manning velocity\":\"SI: n=.015, R=.60 m, S=.002 → V=(1/.015)(.60)^(2/3)(.002)^.5≈2.12 m/s.\",\"Discharge\":\"A=2.5 m², V=1.8 m/s → Q=AV=4.5 m³/s.\",\"Hydraulic radius\":\"Rectangular b=3 m, y=1.2 m → A=3.6, P=5.4, R=.667 m.\",\"Specific energy\":\"y=1.0 m, V=2 m/s → E=1+4/(2×9.81)=1.204 m.\",\"Critical depth\":\"q=3 m²/s → yc=(9/9.81)^(1/3)=.972 m.\",\"Froude\":\"V=2 m/s, hydraulic depth D=1 m → Fr=2/√9.81=.64 → subcritical.\",\"Rectangular weir\":\"Cd=.62, L=2 m, H=.5 m → substitute in Q=(2/3)Cd√(2g)LH^(3/2) → Q≈1.30 m³/s.\",\"Bernoulli + loss\":\"Same-diameter reservoirs: z1=20 m, z2=5 m, hf=3 m → available velocity/pump head relation uses 20=5+hf+V²/2g.\"},\nC:{\"Pump input power\":\"Q=.04 m³/s, h=25 m, η=.75 → P=9810(.04)(25)/.75=13.1 kW.\",\"System curve\":\"hstatic=12 m, K=800, Q=.05 m³/s → hsys=12+800(.05)²=14 m.\",\"NPSH available\":\"(patm−pv)/γ=10 m, zs=2 m, hf=1 m → NPSHA=7 m; compare with NPSHR.\",\"Affinity flow\":\"Speed rises 1200→1500 rpm; Q1=40 L/s → Q2=40(1500/1200)=50 L/s.\",\"Affinity head\":\"h1=20 m at 1200 rpm → h2=20(1500/1200)²=31.25 m.\",\"Affinity power\":\"P1=10 kW at 1200 rpm → P2=10(1500/1200)³=19.53 kW.\"},\nD:{\"Hazen-Williams velocity\":\"Given C, R and energy slope S, insert directly in V=k₁CR^.63S^.54; use k₁=1.318 US or .849 SI.\",\"HW head loss (US)\":\"L=1000 ft, Q=2 cfs, C=130, D=1 ft → hf=4.73(1000)(2^1.852)/(130^1.852)=2.06 ft.\",\"Continuity at node\":\"12 cfs enters a junction; 5 cfs leaves one branch → other branch must carry 7 cfs.\",\"Loop balance\":\"If known loop losses are +8 ft and −5 ft, remaining branch must contribute −3 ft so ΣhL=0.\",\"Fire storage\":\"1500 gpm for 2 hr → 1500×120=180,000 gal.\",\"Pressure head\":\"60 psi → h=2.31(60)=138.6 ft of water.\"},\nE:{\"Spillway/weir\":\"US: C=3.33, L=10 ft, H=2 ft → Q=3.33(10)(2^1.5)=94.2 cfs.\",\"Storage change\":\"Qin=20 cfs, Qout=8 cfs for 10 min → ΔS=12×600=7200 ft³.\",\"Attenuation\":\"Peak falls 100→65 cfs → attenuation=(100−65)/100=35%.\",\"Annual exceedance\":\"T=50 yr → p=1/50=.02=2% per year.\",\"Life-cycle risk\":\"100-yr flood over 30 yr → R=1−.99³⁰≈26%.\",\"Weibull plotting\":\"24 annual peaks; largest has m=1 → T=(24+1)/1=25 yr.\"},\nF:{\"Peak runoff\":\"C=.7, i=3 in/hr, A=20 ac → Q=.7(3)(20)=42 cfs.\",\"Gutter flow\":\"Use the given n, cross-slope Sx, longitudinal slope S and spread T in the book equation; increasing T strongly raises capacity because T has exponent 8/3.\",\"Storm sewer Manning\":\"Full circular pipe: first use R=D/4, then A=πD²/4 and Q=(1.486/n)AR^(2/3)S^.5.\",\"Detention estimate\":\"Qin=14, Qout=6 cfs, t=20 min → storage=(8)(1200)=9600 ft³.\",\"Volumetric coefficient\":\"65% impervious → Rv=.05+.009(65)=.635.\",\"Water quality volume\":\"P=1 in, Rv=.635, A=10 ac → WQv=(1/12)(.635)(10)=.529 ac-ft.\"},\nG:{\"Manning sewer\":\"For a gravity sewer, compute R=A/P and use Manning; e.g. full D=2 ft gives R=.5 ft.\",\"Minimum slope\":\"US: target V=2 ft/s, n=.013, R=.25 ft → S=[2(.013)/(1.486(.25)^(2/3))]²≈.00289.\",\"Harmon peak factor\":\"P=10 thousand → PF=1+14/(4+√10)=2.96.\",\"Peak sanitary flow\":\"Qavg=1.0 MGD and PF=2.96 → Qpeak=2.96 MGD before any specified I/I allowance.\",\"Invert drop\":\"S=.004, L=400 ft → Δz=.004(400)=1.6 ft.\"},\nH:{\"Darcy velocity\":\"K=2×10⁻⁴ m/s, i=.01 → v=Ki=2×10⁻⁶ m/s.\",\"Darcy discharge\":\"K=2×10⁻⁴, i=.01, A=50 m² → Q=1×10⁻⁴ m³/s.\",\"Seepage velocity\":\"Darcy v=2×10⁻⁶ m/s, n=.25 → vs=8×10⁻⁶ m/s.\",\"Transmissivity\":\"K=1×10⁻⁴ m/s, b=20 m → T=.002 m²/s.\",\"Confined Thiem\":\"Use measured heads at two radii: T=.002, h2−h1=2 m, r2/r1=10 → Q=2π(.002)(2)/ln10=.0109 m³/s.\",\"Unconfined Thiem\":\"K=1×10⁻⁴, h2=12 m, h1=10 m, r2/r1=10 → Q=πK(144−100)/ln10≈.0060 m³/s.\",\"Unconfined storage\":\"Sy=.20, A=10,000 m², Δh=1.5 m → V=.2(10000)(1.5)=3000 m³.\",\"Confined storage\":\"S=.001, A=1,000,000 m², Δh=2 m → V=2000 m³.\"},\nI:{\"BOD exerted\":\"BODu=200 mg/L, k=.23/d, t=5 d → BOD5=200(1−e⁻¹·¹⁵)=136.7 mg/L.\",\"Ultimate from BOD5\":\"BOD5=137 mg/L, k=.23/d → BODu=137/(1−e⁻¹·¹⁵)≈200 mg/L.\",\"DO deficit\":\"DOsat=9 mg/L, measured DO=6 mg/L → D=3 mg/L.\",\"Critical deficit\":\"If kd=.2/d, La=10, kr=.4/d, tc=2 d → Dc=(.2×10/.4)e⁻·⁴=3.35 mg/L; DOmin=DOsat−Dc.\",\"Mixing\":\"2 m³/s at 4 mg/L + 3 m³/s at 10 mg/L → C=(8+30)/5=7.6 mg/L.\",\"pH\":\"[H+]=1×10⁻⁶ mol/L → pH=6.\"},\nJ:{\"BOD dilution test\":\"15 mL sample in 300 mL bottle; DO 8→2 mg/L → P=.05, BOD5=6/.05=120 mg/L.\",\"Dilution fraction\":\"20 mL sample diluted to 300 mL → P=20/300=.0667.\",\"Sound level concept\":\"If I/I0=10⁶ → β=10log10(10⁶)=60 dB.\"},\nK:{\"Velocity gradient\":\"P=600 W, μ=.001 Pa·s, V=600 m³ → G=√(600/(.001×600))=31.6 s⁻¹.\",\"Overflow rate\":\"Q=8000 m³/d, As=400 m² → vo=20 m/d.\",\"Detention time\":\"V=1200 m³, Q=6000 m³/d → t=.2 d=4.8 hr.\",\"Stokes settling\":\"ρp=2650, ρ=1000 kg/m³, d=.0001 m, μ=.001 → vs=9.81(1650)(10⁻⁸)/(.018)=.0090 m/s.\",\"Filter loading\":\"Q=12,000 m³/d, Af=300 m² → vf=40 m/d.\",\"Disinfection\":\"C=2 mg/L for t=30 min → CT=60 mg·min/L.\",\"Food/Microorganism\":\"Q=5000 m³/d, S0=.2 kg/m³, V=2500 m³, X=2 kg/m³ → F/M=.20 d⁻¹.\",\"Weir loading\":\"Q=6000 m³/d, total weir length=120 m → loading=50 m³/(m·d).\",\"Carbonate hardness\":\"TH=120 mg/L as CaCO3, alkalinity=80 → CH=min(120,80)=80 mg/L.\"}\n,\n\"Hydraulic jump / sequent depth\":\"Kapag mabilis at mababaw na supercritical flow ay biglang nagiging mas malalim at subcritical, hydraulic jump ang clue. Kunin muna ang upstream Froude number bago hanapin ang downstream conjugate depth. Common ito sa energy dissipation sa spillway at stilling basin.\",\n\"Alternate depths\":\"Dalawang magkaibang flow depth ang puwedeng magkaroon ng parehong specific energy. Ang critical depth ang minimum specific energy. Sa diagram, isipin ang shallow supercritical at deep subcritical branches.\",\n\"90° V-notch weir\":\"Magandang pang-measure ng relatively low open-channel flows. Mas sensitibo ito sa head kaysa rectangular weir at ang discharge ay proportional sa H^(5/2).\",\n\"Hazen-Williams pipe head loss\":\"Direct head-loss form ito para sa pressurized water pipe. Malakas ang epekto ng diameter dahil mataas ang exponent nito. Bantayan ang US/SI units.\",\n\"Rated hydrant capacity\":\"Ginagamit sa hydrant flow test para i-correct ang measured flow sa standard residual pressure, madalas 20 psi. Hindi palaging equal ang measured flow at rated capacity.\",\n\"Hydrant discharge to atmosphere\":\"Orifice-type fire-flow relation. Discharge increases with nozzle diameter squared at sa square root ng pressure.\",\n\"Fire sprinkler discharge\":\"Sprinkler flow follows Q=K√P. Hindi linear ang effect ng pressure; halimbawa 4× pressure gives about 2× flow.\"};\nconst focusQuestions=[\n{topic:'A',sub:'Rational Method',q:'A 24-acre drainage area has 8 ac at C=0.90 and 16 ac at C=0.30. Rainfall intensity is 2.0 in/hr. Find peak runoff.',o:['19.2 cfs','24.0 cfs','28.8 cfs','38.4 cfs'],a:1,e:'Composite C=[8(.90)+16(.30)]/24=0.50. Then Q=CiA=.50(2)(24)=24 cfs.',trap:'Do not average the two C values unless the areas are equal.'},\n{topic:'A',sub:'SCS Curve Number',q:'For CN=80, what rainfall depth must be exceeded before direct runoff begins in the SCS equation?',o:['0.20 in','0.50 in','2.00 in','2.50 in'],a:1,e:'S=1000/80−10=2.5 in. Initial abstraction=0.2S=0.50 in.',trap:'The threshold is 0.2S, not S.'},\n{topic:'A',sub:'Unit Hydrograph',q:'A 3-mi² watershed has 1.5 in of direct runoff and tp=2 hr. Estimate triangular unit-hydrograph peak.',o:['363 cfs','544.5 cfs','1089 cfs','1452 cfs'],a:2,e:'Qp=484AQ/tp=484(3)(1.5)/2=1089 cfs.',trap:'Use area in mi², runoff depth in inches, and tp in hours for this form.'},\n{topic:'A',sub:'Horton Infiltration',q:'As time becomes very large in the Horton equation, infiltration capacity approaches:',o:['f0','fc','0','k'],a:1,e:'The exponential term tends to zero, so f→fc.',trap:'fc is the long-term capacity; f0 is the initial capacity.'},\n{topic:'A',sub:'Materials Recognition',q:'A problem gives rainfall intensity, drainage area, and runoff coefficient and asks for peak discharge from a small site. First equation?',o:['Darcy','Rational','SCS CN','Manning'],a:1,e:'Those are the direct trigger variables for Q=CiA.',trap:'SCS CN is primarily for runoff depth/volume, not this peak-flow setup.'},\n{topic:'B',sub:'Manning',q:'For the same channel geometry and slope, Manning n increases from 0.015 to 0.030. Velocity approximately:',o:['Doubles','Halves','Quadruples','Unchanged'],a:1,e:'V is inversely proportional to n, so doubling n halves V.',trap:'Manning n is resistance: larger n means slower flow.'},\n{topic:'B',sub:'Critical Depth',q:'A rectangular channel carries Q=12 m³/s and is 4 m wide. Find critical depth.',o:['0.72 m','0.97 m','1.24 m','1.50 m'],a:1,e:'q=Q/b=3 m²/s; yc=(q²/g)^(1/3)=(9/9.81)^(1/3)=0.972 m.',trap:'Use discharge per unit width q, not total Q.'},\n{topic:'B',sub:'Froude Number',q:'A channel has Fr=1.35. The flow is:',o:['Subcritical','Critical','Supercritical','Pressurized'],a:2,e:'Fr>1 indicates supercritical flow.',trap:'Froude classifies open-channel flow regime; it does not mean pressurized flow.'},\n{topic:'B',sub:'Hydraulic Radius',q:'For a full circular pipe of diameter D, hydraulic radius is:',o:['D','D/2','D/4','πD'],a:2,e:'R=A/P=(πD²/4)/(πD)=D/4.',trap:'Hydraulic radius is not the geometric radius.'},\n{topic:'B',sub:'Specific Energy',q:'At critical flow in an open channel, specific energy for a given discharge is:',o:['Maximum','Minimum','Zero','Independent of depth'],a:1,e:'Critical depth corresponds to minimum specific energy.',trap:'Critical flow is the minimum-energy condition for fixed discharge.'},\n{topic:'C',sub:'Pump Power',q:'A pump delivers 0.05 m³/s through 30 m head at 80% efficiency. Input power is closest to:',o:['11.8 kW','14.7 kW','18.4 kW','23.5 kW'],a:2,e:'P=9810(.05)(30)/.80=18.39 kW.',trap:'Divide by efficiency for input power.'},\n{topic:'C',sub:'Affinity Laws',q:'Pump speed increases by 20%. Head changes approximately by:',o:['+20%','+40%','+44%','+73%'],a:2,e:'h2/h1=(1.2)²=1.44, so head increases 44%.',trap:'Head follows speed squared; power follows speed cubed.'},\n{topic:'C',sub:'Series vs Parallel',q:'Two similar pumps are placed in series. The primary effect is to increase:',o:['Head at a given flow','Flow at zero head only','Pipe diameter','NPSHR to zero'],a:0,e:'Series pumps add head; parallel pumps add flow capacity.',trap:'Remember: series=head, parallel=flow.'},\n{topic:'C',sub:'NPSH',q:'Which condition best avoids pump cavitation?',o:['NPSHA < NPSHR','NPSHA = 0','NPSHA > NPSHR','pv > patm'],a:2,e:'Available NPSH must exceed required NPSH.',trap:'A safety margin is desirable; equality is not the target.'},\n{topic:'C',sub:'Operating Point',q:'The actual operating flow of a pump-pipe system occurs where:',o:['Pump efficiency is zero','Pump curve intersects system curve','Static head is zero','NPSHA=NPSHR'],a:1,e:'The operating point satisfies both the pump head curve and system head requirement.',trap:'NPSH is a cavitation check, not the operating-point definition.'},\n{topic:'D',sub:'Hazen-Williams',q:'All else equal, increasing Hazen-Williams C causes head loss to:',o:['Increase','Decrease','Remain constant','Become negative'],a:1,e:'In the head-loss equation C is in the denominator; larger C means smoother pipe and less loss.',trap:'This trend is opposite the intuitive use of Manning n.'},\n{topic:'D',sub:'Pressure Head',q:'A gauge pressure of 50 psi corresponds to approximately:',o:['21.6 ft','50 ft','115.5 ft','231 ft'],a:2,e:'h=2.31(50)=115.5 ft of water.',trap:'Use about 2.31 ft of water per psi.'},\n{topic:'D',sub:'Networks',q:'At a pipe-network junction, which relation must be satisfied?',o:['ΣhL=1','ΣQin=ΣQout','All pipe velocities equal','All diameters equal'],a:1,e:'Continuity requires mass conservation at each node.',trap:'Loop head-loss balance is a different network condition.'},\n{topic:'D',sub:'Parallel Pipes',q:'For two parallel branches connecting the same two nodes, the branches have equal:',o:['Flow','Diameter','Velocity','Head loss'],a:3,e:'Both branches connect the same energy nodes, so their head losses are equal while flow splits.',trap:'Equal head loss does not imply equal flow.'},\n{topic:'D',sub:'Fire Storage',q:'Required fire flow is 2000 gpm for 3 hr. Required dedicated volume is:',o:['120,000 gal','240,000 gal','360,000 gal','6,000 gal'],a:2,e:'3 hr=180 min; V=2000(180)=360,000 gal.',trap:'Convert hours to minutes before multiplying by gpm.'},\n{topic:'E',sub:'Return Period',q:'A 25-year flood has annual exceedance probability of:',o:['25%','10%','4%','1%'],a:2,e:'p=1/T=1/25=.04=4%.',trap:'Return period is not the annual percentage itself.'},\n{topic:'E',sub:'Life-Cycle Risk',q:'Probability of at least one 50-year event in 20 years is closest to:',o:['20%','33%','40%','50%'],a:1,e:'R=1−(1−1/50)^20=1−.98^20≈33.2%.',trap:'n/T=40% is only a rough approximation and is not exact.'},\n{topic:'E',sub:'Reservoir Routing',q:'During a 15-min interval, average inflow is 40 cfs and outflow is 25 cfs. Storage increases by:',o:['225 ft³','900 ft³','13,500 ft³','36,000 ft³'],a:2,e:'ΔS=(40−25)(15×60)=13,500 ft³.',trap:'Convert minutes to seconds when flow is in cfs.'},\n{topic:'E',sub:'Detention',q:'The principal hydrologic purpose of a detention basin is to:',o:['Increase peak flow','Lower and delay peak outflow','Remove all storm volume permanently','Increase return period'],a:1,e:'Detention temporarily stores runoff and attenuates the peak.',trap:'Retention and detention are not identical; detention generally releases stored stormwater.'},\n{topic:'E',sub:'Weir/Spillway',q:'If head H over a weir doubles and all else is unchanged, discharge changes by a factor of:',o:['2','2.83','4','8'],a:1,e:'Q∝H^(3/2), so factor=2^(3/2)=2.828.',trap:'Weir flow is not linear with head.'},\n{topic:'F',sub:'Detention Storage',q:'Peak inflow exceeds allowed outflow by 10 cfs for 30 min. Rectangular estimate of storage is:',o:['300 ft³','18,000 ft³','30,000 ft³','180,000 ft³'],a:1,e:'Storage≈10(30×60)=18,000 ft³.',trap:'Use seconds with cfs.'},\n{topic:'F',sub:'Water Quality Volume',q:'A 20-acre site is 50% impervious. For P=1 in, estimate WQv using Rv=.05+.009I.',o:['0.42 ac-ft','0.83 ac-ft','1.67 ac-ft','10 ac-ft'],a:1,e:'Rv=.05+.009(50)=.50; WQv=(1/12)(.50)(20)=.833 ac-ft.',trap:'I is entered as percent (50), not decimal 0.50, in this empirical equation.'},\n{topic:'F',sub:'Storm Sewer',q:'When using Manning for a full circular storm sewer, use R=',o:['D/2','D/4','πD²/4','2D'],a:1,e:'For full circular flow R=A/P=D/4.',trap:'Do not use geometric radius D/2.'},\n{topic:'F',sub:'BMP Concept',q:'Which design objective is separate from peak-flow control in the chapter?',o:['Water-quality volume','Hydraulic radius','Pump NPSH','Aquifer storage'],a:0,e:'Stormwater design commonly treats peak control and water-quality volume as separate criteria.',trap:'Do not assume a basin sized only for peak control automatically satisfies water-quality sizing.'},\n{topic:'F',sub:'Rational Method',q:'For C=.75, i=2.4 in/hr, A=18 ac, peak runoff is:',o:['24.3 cfs','32.4 cfs','43.2 cfs','58.3 cfs'],a:1,e:'Q=.75(2.4)(18)=32.4 cfs.',trap:'In the chapter US Rational form, acres and in/hr give approximately cfs.'},\n{topic:'G',sub:'Self-Cleansing',q:'The chapter review uses approximately what minimum self-cleansing velocity for gravity sewers?',o:['0.2 ft/s','1 ft/s','2 ft/s','10 ft/s'],a:2,e:'The review target is about 2 ft/s (0.6 m/s).',trap:'This is a review/design target from the source chapter, not a universal code value.'},\n{topic:'G',sub:'Harmon Factor',q:'For population P=9 (thousand), Harmon peak factor is closest to:',o:['1.5','2.0','3.0','4.5'],a:2,e:'PF=1+14/(4+√9)=1+14/7=3.0.',trap:'P is in thousands.'},\n{topic:'G',sub:'Partial Flow',q:'At half-full flow in a circular gravity sewer at the same slope and n, compared with full flow:',o:['Velocity is half','Velocity is the same and Q is half','Velocity doubles','Q is unchanged'],a:1,e:'At half-full, R remains D/4, so Manning velocity is the same; area and discharge are half.',trap:'Do not assume half depth means half hydraulic radius.'},\n{topic:'G',sub:'Invert Drop',q:'A 500-ft sewer at slope 0.003 requires an invert drop of:',o:['0.15 ft','0.50 ft','1.50 ft','15 ft'],a:2,e:'Δz=SL=.003(500)=1.5 ft.',trap:'Slope is dimensionless ft/ft.'},\n{topic:'G',sub:'I/I',q:'Inflow and infiltration in a sanitary sewer generally:',o:['Reduce plant flow','Add unwanted flow and can increase peak loading','Increase pipe roughness coefficient only','Eliminate peaking'],a:1,e:'I/I adds non-sanitary water to the collection system and can overload conveyance/treatment.',trap:'Include I/I when the problem explicitly provides or requests it.'},\n{topic:'H',sub:'Darcy Flow',q:'K=5×10⁻⁵ m/s, gradient=.02, area=100 m². Groundwater discharge is:',o:['1×10⁻⁶ m³/s','1×10⁻⁴ m³/s','0.01 m³/s','0.10 m³/s'],a:1,e:'Q=KiA=(5×10⁻⁵)(.02)(100)=1×10⁻⁴ m³/s.',trap:'Do not forget cross-sectional area.'},\n{topic:'H',sub:'Seepage Velocity',q:'Darcy velocity is 3×10⁻⁶ m/s and porosity is 0.30. Seepage velocity is:',o:['9×10⁻⁷','3×10⁻⁶','1×10⁻⁵','1×10⁻⁴'],a:2,e:'vs=v/n=3×10⁻⁶/.30=1×10⁻⁵ m/s.',trap:'Actual pore velocity is larger than Darcy velocity when n<1.'},\n{topic:'H',sub:'Transmissivity',q:'An aquifer has K=2×10⁻⁴ m/s and thickness 30 m. T=',o:['6×10⁻⁶ m²/s','6×10⁻³ m²/s','0.6 m²/s','150,000 m²/s'],a:1,e:'T=Kb=2×10⁻⁴(30)=6×10⁻³ m²/s.',trap:'Transmissivity includes saturated thickness.'},\n{topic:'H',sub:'Well Equation',q:'Which clue points to the unconfined Thiem equation rather than confined?',o:['Squared hydraulic heads','Pressure head in a pipe','Manning n','BOD5'],a:0,e:'The unconfined steady radial-flow equation contains h2²−h1².',trap:'Confined Thiem uses a linear head difference with transmissivity.'},\n{topic:'H',sub:'Aquifer Storage',q:'For an unconfined aquifer, drained volume from a water-table decline is based primarily on:',o:['Specific yield','Manning n','Hazen-Williams C','Froude number'],a:0,e:'V=Sy A Δh for the chapter unconfined-storage relation.',trap:'Confined storage uses storage coefficient S instead.'},\n{topic:'I',sub:'Mixing',q:'1 m³/s at 2 mg/L mixes with 4 m³/s at 8 mg/L. Mixed concentration is:',o:['5.0 mg/L','6.0 mg/L','6.8 mg/L','8.0 mg/L'],a:2,e:'C=(1×2+4×8)/5=34/5=6.8 mg/L.',trap:'Use flow-weighted concentration, not a simple average.'},\n{topic:'I',sub:'DO Deficit',q:'DO saturation is 9.5 mg/L and measured DO is 6.0 mg/L. Deficit is:',o:['3.5 mg/L','6.0 mg/L','9.5 mg/L','15.5 mg/L'],a:0,e:'D=DOsat−DO=9.5−6.0=3.5 mg/L.',trap:'Maximum deficit corresponds to minimum DO.'},\n{topic:'I',sub:'BOD',q:'If BODu=250 mg/L, k=.20/d, what is BOD exerted after 5 d?',o:['79 mg/L','92 mg/L','158 mg/L','250 mg/L'],a:2,e:'BOD5=250(1−e^(−1))=158 mg/L.',trap:'BOD5 is generally less than ultimate BOD.'},\n{topic:'I',sub:'pH',q:'If [H+]=1×10⁻⁵ mol/L, pH=',o:['4','5','7','9'],a:1,e:'pH=−log10(10⁻⁵)=5.',trap:'The negative exponent becomes the positive pH value.'},\n{topic:'I',sub:'Water Quality Concept',q:'An increase in biodegradable organic loading generally causes stream DO to:',o:['Increase','Decrease','Remain exactly constant','Become pH'],a:1,e:'Higher oxygen demand consumes dissolved oxygen.',trap:'BOD and DO generally move in opposite directions after an organic load.'},\n{topic:'J',sub:'BOD Bottle',q:'A 30-mL wastewater sample is diluted to 300 mL. DO drops from 9 to 4 mg/L. BOD5 is:',o:['5 mg/L','25 mg/L','50 mg/L','150 mg/L'],a:2,e:'P=30/300=.10; BOD=(9−4)/.10=50 mg/L.',trap:'Divide the bottle DO drop by sample fraction.'},\n{topic:'J',sub:'Standards',q:'Which statement matches the chapter review?',o:['Secondary standards primarily protect against acute toxicity','Primary standards protect health; secondary standards address aesthetic concerns','MCL is only a suggested value','E. coli is less specific than total coliform'],a:1,e:'The chapter distinguishes health-based primary standards from aesthetic secondary standards.',trap:'MCL is presented as a legal contaminant limit.'},\n{ n focusArray(){return focusRandom||focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter)}\nfunction renderFocusCard(){let a=focusArray();if(!a.length){$('#focuslist').innerHTML='<div class=\"card\"><h3>No Focus Drill questions found for this filter.</h3></div>';return}focusIndex=Math.max(0,Math.min(focusIndex,a.length-1));let q=a[focusIndex];let opts=q.o.map((x,i)=>{let cls='opt'+(focusChoice===i?' sel':'');if(focusReveal&&i===q.a)cls+=' correct';if(focusReveal&&focusChoice===i&&i!==q.a)cls+=' wrong';return `<button class=\"${cls}\" onclick=\"focusChoice=${i};renderFocusCard()\">${String.fromCharCode(65+i)}. ${x}</button>`}).join('');let sol=focusReveal?`<div class=\"whybox\"><div class=\"notice good\"><b>Correct Answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b></div><div class=\"example\" style=\"margin-top:12px\"><b>Solution / Why</b><br>${q.e}</div><div class=\"notice focus\" style=\"margin-top:12px\"><b>⚠ FE Trap:</b> ${q.trap}</div></div>`:'';$('#focuslist').innerHTML=`<div class=\"card qcard\" style=\"min-height:400px\"><div class=\"tag\">FE Focus • Topic 10.${q.topic} • ${q.sub}</div><h2 style=\"margin:18px 0\">${q.q}</h2><div style=\"display:grid;gap:10px\">${opts}</div>${sol}</div><div class=\"barrow\" style=\"margin-top:12px\"><button class=\"btn secondary\" onclick=\"prevFocus()\">← Previous</button><button class=\"btn\" onclick=\"focusReveal=!focusReveal;renderFocusCard()\">${focusReveal?'Hide Solution':'Reveal Solution'}</button><button class=\"btn secondary\" onclick=\"nextFocus()\">Next →</button><span class=\"chip\">${focusIndex+1}/${a.length}</span></div>`}\nfunction prevFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex-1+a.length)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction nextFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex+1)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction randomFocus(){let base=focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter);focusRandom=[...base].sort(()=>Math.random()-.5).slice(0,Math.min(10,base.length));focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()}\nfunction strategy(){$('#strategy').innerHTML=`<div class=\"hero\"><h1>🎯 FE Exam Strategy for This Chapter</h1><p>The chapter's own organizing idea is powerful: <b>name the topic, then pull its one formula.</b></p></div><div class=\"grid\"><div class=\"card\"><h3>1. Trigger words</h3><p><b>Peak runoff</b> → Rational. <b>Runoff depth/CN</b> → SCS. <b>Open channel/sewer</b> → Manning. <b>Flow regime</b> → Froude. <b>Pump input</b> → γQh/η. <b>Groundwater</b> → Darcy. <b>Organic oxygen demand</b> → BOD.</p></div><div class=\"card\"><h3>2. Unit traps</h3><p>Materials unit checks: N/mm² = MPa; 1000 MPa = 1 GPa; SG is unitless; moisture, air voids and absorption are usually percentages.</p></div><div class=\"card\"><h3>3. Direction checks</h3><p>Higher Manning n → slower. Higher Hazen-Williams C → smoother/faster. Higher CN/C → more runoff. Higher BOD → lower DO. Input pump power > water power.</p></div></div><div class=\"card\" style=\"margin-top:14px\"><h3>Recommended review loop</h3><p>Read one topic → memorize only its trigger + formula → solve its worked example without looking → answer that topic's quiz questions → review every trap you missed. Do not try to memorize the entire chapter as one formula sheet.</p></div>`}\n$$('#nav button').forEach(b=>b.onclick=()=>{show(b.dataset.view); if(b.dataset.view==='home')home();if(b.dataset.view==='formulas')formulas();if(b.dataset.view==='quiz')quiz();if(b.dataset.view==='focusdrill')focusDrill();if(b.dataset.view==='strategy')strategy();if(b.dataset.view==='calculators')calculators();if(b.dataset.view==='flashcards')flashcards();if(b.dataset.view==='mistakes')mistakes()});\n$('#topicnav').innerHTML=topics.map(t=>`<button onclick=\"openTopic('${t.id}')\">${t.icon} ${t.title}</button>`).join('');home();\n<\/script></body></html>";const wf=documen
