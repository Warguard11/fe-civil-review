/><rect x="420" y="40" width="100" height="100" rx="10" fill="#173f59"/><path d="M180 90H245M350 90H415" stroke="#44c7f4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="95" fill="#fff">Measure</text><text x="272" y="95" fill="#fff">Treat</text><text x="440" y="95" fill="#fff">Verify</text></svg>`; return common+`<path d="M60 120 Q170 25 290 100 T540 70" fill="none" stroke="#44c7f4" stroke-width="5"/><text x="60" y="155" fill="#fff">Inflow → storage/routing → controlled outflow</text></svg>`}
function home(){let ms=masteryStats();let cards=topics.map(t=>`<div class="card topicCard" onclick="openTopic('${t.id}')"><h3>${t.icon} ${t.title}</h3><div class="muted">${t.why}</div><div class="tag" style="margin-top:10px">${t.formulas.length} core formulas • example for every formula</div></div>`).join(''); $('#home').innerHTML=`<div class="hero"><h1>Water Resources & Environmental Engineering</h1><p>This uploaded chapter is labeled <b>HIGH YIELD</b>: about 10–15 questions and ~11% of the FE Civil exam. The chapter organizes the material into 11 subareas, 10.A–10.K. Use this app to learn the trigger words, choose the formula, work an example, then take the 100-question test.</p><div class="chips"><span class="chip">11 topic modules</span><span class="chip">${topics.reduce((s,t)=>s+t.formulas.length,0)} formula entries</span><span class="chip">100 practice questions</span><span class="chip">Mastery: ${ms.done}/${ms.total} (${ms.pct}%)</span><span class="chip">Worked explanations</span><span class="chip">Built-in calculators</span><span class="chip">Flashcards + mastery tracking</span><span class="chip">Mistake review</span></div></div><div class="grid">${cards}</div>`}
function openTopic(id){let t=topics.find(x=>x.id===id); show('topic'); let jumps=t.formulas.map((f,i)=>`<button onclick="document.getElementById('sf${t.id}${i}').scrollIntoView({behavior:'smooth'})">${f[0]}</button>`).join(''); $('#topic').innerHTML=`<div class="hero"><h1>${t.icon} ${t.title}</h1><p>${t.why}</p><div class="tagalog"><b>🇵🇭 Quick Tagalog explanation:</b> ${topicTagalog[t.id]}</div><div class="subjump">${jumps}</div></div><div class="grid" style="grid-template-columns:1.05fr .95fr"><div class="card"><h3>What the book makes important</h3><ul class="important">${t.important.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Visual memory cue</h3><div class="diagram">${diagram(t.id)}</div></div></div><div class="card" style="margin-top:14px"><h3>Formula Sheet + Example for EVERY Subtopic — ${t.title}</h3><p class="muted">Study each subtopic independently. Mark it mastered only after you can identify when to use it and solve the example without looking.</p>${t.formulas.map((f,i)=>{let k=mkey(t.id,f[0]);return `<div class="formula" id="sf${t.id}${i}"><div class="tag">${f[0]}</div><div class="eq">${f[1]}</div><div class="muted"><b>When to use:</b> ${f[2]}</div><div class="tagalog"><b>🇵🇭 Paliwanag sa Tagalog — ${f[0]}:</b><br>${subtopicTagalog[f[0]]||"Ginagamit ang subtopic na ito kapag tugma ang given variables at hinihinging quantity sa formula. Unahin ang pag-identify ng concept, saka ayusin ang units bago mag-substitute."}</div><div class="example" style="margin-top:10px"><b>Worked mini-example — ${f[0]}</b><br>${(formulaExamples[t.id]&&formulaExamples[t.id][f[0]])||'Apply the equation using consistent units and solve for the requested unknown.'}</div><div class="master"><button class="${mastery[k]?'done':''}" onclick="toggleMaster('${t.id}',${JSON.stringify(f[0]).replace(/"/g,'&quot;')})">${mastery[k]?'✓ Mastered':'○ Mark mastered'}</button></div></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>Worked FE-style Example</h3><div class="example"><b>${t.example.q}</b><div class="steps">${t.example.steps.map(s=>`<div>${s}</div>`).join('')}</div><div style="color:#ffda7b;margin-top:8px">⚠ Trap alert: ${t.example.tip}</div></div></div>`}
function formulas(){let rows=topics.flatMap(t=>t.formulas.map(f=>({t:t.title,...{name:f[0],eq:f[1],use:f[2]}}))); $('#formulas').innerHTML=`<div class="hero"><h1>📐 Formula Bank</h1><p>Search by formula, variable, or application. First identify the topic, then pull the headline equation.</p><input id="fsearch" class="search" placeholder="Try: Manning, BOD, storage, groundwater, weir..."></div><div id="frows"></div>`; let render=()=>{let q=$('#fsearch').value.toLowerCase();$('#frows').innerHTML=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<div class="formula"><div class="tag">${r.t} • ${r.name}</div><div class="eq">${r.eq}</div><div class="muted">${r.use}</div></div>`).join('')}; $('#fsearch').oninput=render;render()}
let testIndex=0,testReveal=false,testFilter='all',testOrder='normal',testRanks={};

function quiz(){
  $('#quiz').innerHTML=`<div class="hero"><h1>🧠 100-Question FE-Style Test</h1><p><b>One question at a time.</b> Choose an option, then press <b>✓ Submit My Final Answer</b>. Only submitted answers count toward <b>Correct So Far</b>. If you are unsure, press <b>🚩 Flag & Skip</b> and return later from the Flagged Questions filter.</p><div class="notice focus"><b>FE routine:</b> ① Identify the topic → ② choose the formula/concept → ③ check units → ④ solve → ⑤ choose an option → ⑥ submit your final answer → ⑦ review the explanation.</div><div class="quizTop" style="margin-top:12px"><select id="qfilter" class="btn secondary" onchange="testFilter=this.value;testIndex=0;testReveal=false;renderTestCard()"><option value="all">All 100 questions</option><option value="flagged">🚩 Flagged Questions</option><option value="unanswered">Unanswered / Not Final</option>${topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><button class="btn secondary" onclick="shuffleTest()">🔀 Shuffle</button><button class="btn secondary" onclick="startTestOver()">↺ Start Over</button><span id="score"></span></div><div class="progress"><i id="prog"></i></div></div><div id="qlist"></div>`;
  $('#qfilter').value=testFilter; renderTestCard();
}
function testArray(){
  let a=questions.filter(q=>{
    if(testFilter==='all') return true;
    if(testFilter==='flagged') return flagged.includes(q.n);
    if(testFilter==='unanswered') return !submitted[q.n];
    return q.topic===testFilter;
  });
  if(testOrder==='shuffle')a=[...a].sort((x,y)=>(testRanks[x.n]||0)-(testRanks[y.n]||0));
  return a
}
function shuffleTest(){testRanks={};questions.forEach(q=>testRanks[q.n]=Math.random());testOrder='shuffle';testIndex=0;testReveal=false;renderTestCard()}
function selectTestAnswer(n,i){
  if(submitted[n]) return;
  answers[n]=i;saveState();renderTestCard()
}
function submitFinalAnswer(n){
  if(answers[n]===undefined){alert('Choose an answer first, or use 🚩 Flag & Skip.');return}
  submitted[n]=true;
  testReveal=true;
  if(answers[n]!==questions.find(q=>q.n===n).answer && !wrongs.includes(n)) wrongs.push(n);
  saveState();renderTestCard()
}
function toggleFlag(n,goNext=false){
  if(flagged.includes(n)) flagged=flagged.filter(x=>x!==n);
  else flagged.push(n);
  saveState();
  if(goNext){ nextTest(); } else renderTestCard();
}
function renderTestCard(){
 let a=testArray();
 if(!a.length){
   $('#qlist').innerHTML=`<div class="card"><h3>${testFilter==='flagged'?'No flagged questions.':'No questions in this view.'}</h3><p class="muted">${testFilter==='flagged'?'Use 🚩 Flag & Skip on any question you want to revisit.':'Change the filter to continue.'}</p></div>`;
   if($('#prog'))$('#prog').style.width='0%';
   if($('#score'))$('#score').innerHTML=`<span class="score">Final answers: ${Object.keys(submitted).filter(k=>submitted[k]).length}/100</span>`;
   return
 }
 testIndex=Math.max(0,Math.min(testIndex,a.length-1)); let q=a[testIndex], chosen=answers[q.n], t=topics.find(x=>x.id===q.topic), isFinal=!!submitted[q.n], isFlagged=flagged.includes(q.n);
 let finalCount=questions.filter(x=>submitted[x.n]).length;
 let correctFinal=questions.filter(x=>submitted[x.n]&&answers[x.n]===x.answer).length;
 if($('#prog'))$('#prog').style.width=(100*finalCount/questions.length)+'%';
 if($('#score'))$('#score').innerHTML=`<span class="score">Final ${finalCount}/100</span> <span class="score">Correct So Far: ${correctFinal}/${finalCount||0}</span> <span class="chip">🚩 ${flagged.length}</span>`;
 let options=q.options.map((o,i)=>{let cls='opt'+(chosen===i?' sel':'');if(isFinal&&i===q.answer)cls+=' correct';if(isFinal&&chosen===i&&i!==q.answer)cls+=' wrong';return `<button class="${cls}" ${isFinal?'disabled':''} onclick="selectTestAnswer(${q.n},${i})">${String.fromCharCode(65+i)}. ${o}</button>`}).join('');
 let result=isFinal?`<div class="explain"><div class="notice ${chosen===q.answer?'good':'focus'}"><b>${chosen===q.answer?'✓ Correct':'✗ Incorrect'} — Final Answer: ${String.fromCharCode(65+chosen)}. ${q.options[chosen]}</b><br><b>Correct Answer: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b></div><div class="example" style="margin-top:12px"><b>Explanation</b><br>${q.explanation}</div><p class="muted"><b>FE habit:</b> Identify the clue that points to the equation/concept and verify the units before calculating.</p></div>`:'';
 let draft=(!isFinal&&chosen!==undefined)?`<div class="notice" style="margin-top:12px"><b>Current choice:</b> ${String.fromCharCode(65+chosen)}. ${q.options[chosen]} <span class="muted">— not counted until you submit it.</span></div>`:'';
 $('#qlist').innerHTML=`<div class="card qcard" style="min-height:430px"><div class="tag">Question ${q.n} • ${t?t.title:'Topic 10.'+q.topic} • ${q.difficulty}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><span class="chip">${isFinal?'🔒 Final answer submitted':'✏️ Answer not final'}</span>${isFlagged?'<span class="chip" style="border-color:#ff5b67;color:#ff8b94">🚩 Flagged for review</span>':''}</div><h2 style="margin:18px 0">${q.q}</h2><div style="display:grid;gap:10px">${options}</div>${draft}${result}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="prevTest()">← Previous</button>${!isFinal?`<button class="btn" onclick="submitFinalAnswer(${q.n})">✓ Submit My Final Answer</button>`:`<button class="btn" disabled>🔒 Final Submitted</button>`}<button class="btn secondary" style="${isFlagged?'border-color:#ff5b67;color:#ff8b94':''}" onclick="toggleFlag(${q.n},false)">${isFlagged?'🚩 Remove Flag':'🚩 Flag'}</button>${!isFinal?`<button class="btn secondary" style="border-color:#ff5b67;color:#ff8b94" onclick="if(!flagged.includes(${q.n}))flagged.push(${q.n});saveState();nextTest()">🚩 Flag & Skip →</button>`:''}<button class="btn secondary" onclick="nextTest()">Next →</button><span class="chip">${testIndex+1}/${a.length}</span></div>`;
}
function prevTest(){let a=testArray();if(!a.length)return;testIndex=(testIndex-1+a.length)%a.length;testReveal=false;renderTestCard()}
function nextTest(){let a=testArray();if(!a.length)return;testIndex=(testIndex+1)%a.length;testReveal=false;renderTestCard()}
function startTestOver(){testIndex=0;testReveal=false;renderTestCard()}
function resetQuiz(){if(confirm('Clear all saved test answers, final submissions, flags, and mistakes?')){answers={};submitted={};flagged=[];wrongs=[];saveState();testIndex=0;testReveal=false;quiz()}}

function calculators(){const calcs=[
['Rational Method Q=CiA',[['C','Runoff coefficient'],['i','Intensity (in/hr)'],['A','Area (acres)']],v=>['Q',v.C*v.i*v.A,'cfs']],
['SCS Curve Number Runoff',[['CN','Curve number'],['P','Rainfall P (in)']],v=>{let S=1000/v.CN-10,Q=v.P<=.2*S?0:(v.P-.2*S)**2/(v.P+.8*S);return ['Q',Q,'in (S='+S.toFixed(3)+' in)']}],
['Manning Velocity (US)',[['n','Manning n'],['R','Hydraulic radius R (ft)'],['S','Slope S']],v=>['V',(1.486/v.n)*v.R**(2/3)*Math.sqrt(v.S),'ft/s']],
['Froude Number',[['V','Velocity'],['D','Hydraulic depth'],['g','g (32.2 US or 9.81 SI)','32.2']],v=>{let x=v.V/Math.sqrt(v.g*v.D);return ['Fr',x,x<1?'subcritical':x>1?'supercritical':'critical']}],
['Pump Input Power (SI)',[['Q','Flow Q (m³/s)'],['h','Head h (m)'],['eta','Efficiency η (decimal)']],v=>['P',9810*v.Q*v.h/v.eta/1000,'kW']],
['Flood Life-Cycle Risk',[['T','Return period T (yr)'],['n','Project life n (yr)']],v=>['R',100*(1-(1-1/v.T)**v.n),'%']],
['Detention Storage',[['Qin','Inflow (cfs)'],['Qout','Outflow (cfs)'],['t','Duration (min)']],v=>['ΔS',(v.Qin-v.Qout)*v.t*60,'ft³']],
['Darcy Flow',[['K','Hydraulic conductivity K'],['i','Gradient i'],['A','Area A']],v=>['Q',v.K*v.i*v.A,'consistent flow units']],
['Flow-Weighted Mixing',[['Q1','Q₁'],['C1','C₁'],['Q2','Q₂'],['C2','C₂']],v=>['Cmix',(v.Q1*v.C1+v.Q2*v.C2)/(v.Q1+v.Q2),'concentration units']],
['BOD Dilution Test',[['DOi','Initial DO'],['DOf','Final DO'],['Vs','Sample volume (mL)'],['Vb','Bottle volume (mL)','300']],v=>['BOD',(v.DOi-v.DOf)/(v.Vs/v.Vb),'mg/L']],
['Clarifier Overflow Rate',[['Q','Flow Q'],['A','Surface area As']],v=>['v₀',v.Q/v.A,'Q/area units']]
];$('#calculators').innerHTML=`<div class="hero"><h1>🧮 FE Formula Calculators</h1><p>Use these to check your hand calculations. On the FE exam, still identify the equation and units yourself first.</p><div class="notice">These calculators implement formulas already included in the uploaded chapter review. They are study/check tools, not a substitute for unit analysis.</div></div><div class="calcgrid">${calcs.map((c,ci)=>`<div class="card"><h3>${c[0]}</h3>${c[1].map(x=>`<div class="field"><label>${x[1]}</label><input id="c${ci}_${x[0]}" type="number" step="any" value="${x[2]||''}"></div>`).join('')}<button class="btn" onclick="runCalc(${ci})">Calculate</button><div id="cr${ci}" class="result hidden"></div></div>`).join('')}</div>`;window._calcs=calcs}
function runCalc(i){let c=window._calcs[i],v={};c[1].forEach(x=>v[x[0]]=parseFloat($('#c'+i+'_'+x[0]).value));if(Object.values(v).some(Number.isNaN)){alert('Enter all values.');return}let r=c[2](v),el=$('#cr'+i);el.classList.remove('hidden');el.innerHTML=`<b>${r[0]} = ${Number.isFinite(r[1])?Number(r[1].toFixed(4)):r[1]} ${r[2]}</b>`}
let flashIndex=0,flashBack=false;

function flashcards(){let cards=topics.flatMap(t=>t.formulas.map(f=>({topic:t.title,name:f[0],eq:f[1],use:f[2],ex:(formulaExamples[t.id]||{})[f[0]]||'',id:t.id})));window._flash=cards;flashIndex=Math.min(flashIndex,cards.length-1);renderFlash()}
function renderFlash(){let cards=window._flash,c=cards[flashIndex],k=mkey(c.id,c.name);$('#flashcards').innerHTML=`<div class="hero"><h1>🗂️ Formula Flashcards</h1><p>Try to recall the equation and when to use it before flipping the card.</p></div><div class="card flash" onclick="flashBack=!flashBack;renderFlash()">${flashBack?`<div><div class="tag">${c.topic}</div><h2>${c.name}</h2><div class="eq">${c.eq}</div><p>${c.use}</p><div class="example">${c.ex}</div></div>`:`<div><div class="tag">${c.topic}</div><h2>${c.name}</h2><p class="muted">What is the formula? When do you use it?</p><p>Click to reveal</p></div>`}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="flashIndex=(flashIndex-1+window._flash.length)%window._flash.length;flashBack=false;renderFlash()">← Previous</button><button class="btn" onclick="mastery['${k}']=true;saveState();flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()">✓ I know this</button><button class="btn secondary" onclick="flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()">Next →</button><span class="chip">${flashIndex+1}/${cards.length}</span></div>`}
function mistakes(){let arr=questions.filter(q=>wrongs.includes(q.n));$('#mistakes').innerHTML=`<div class="hero"><h1>❌ Mistake Review</h1><p>Questions you missed after grading are saved on this device so you can target weak areas.</p><div class="chips"><span class="chip">${arr.length} saved mistakes</span></div></div>${arr.length?arr.map(q=>`<div class="card qcard"><div class="tag">Question ${q.n} • Topic 10.${q.topic}</div><h3>${q.q}</h3><div class="explain"><b>Correct: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div><button class="btn secondary" style="margin-top:10px" onclick="wrongs=wrongs.filter(x=>x!==${q.n});saveState();mistakes()">Mark reviewed</button></div>`).join(''):`<div class="card"><h3>No saved mistakes yet.</h3><p>Take the quiz and press Grade Test. Missed questions will appear here.</p></div>`}`
}
let focusIndex=0,focusReveal=false,focusFilter='all',focusRandom=null,focusChoice=null;
function focusDrill(){
 $('#focusdrill').innerHTML=`<div class="hero"><h1>🔥 FE Focus Drill</h1><p><b>${focusQuestions.length} additional high-yield FE-style drills</b> covering recognition clues, formulas, unit traps, and common conceptual reversals.</p><div class="notice focus"><b>How to use:</b> Answer first. Then reveal the solution and read the FE Trap before moving on.</div><div class="quizTop" style="margin-top:12px"><select id="ffilter" class="btn secondary" onchange="focusFilter=this.value;focusIndex=0;focusReveal=false;focusRandom=null;focusChoice=null;renderFocusCard()"><option value="all">All Focus questions</option>${topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><button class="btn secondary" onclick="randomFocus()">🎲 Random 10</button><button class="btn secondary" onclick="focusRandom=null;focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()">All Questions</button></div></div><div id="focuslist"></div>`;
 $('#ffilter').value=focusFilter;renderFocusCard();
}
function focusArray(){return focusRandom||focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter)}
function renderFocusCard(){let a=focusArray();if(!a.length){$('#focuslist').innerHTML='<div class="card"><h3>No Focus Drill questions found for this filter.</h3></div>';return}focusIndex=Math.max(0,Math.min(focusIndex,a.length-1));let q=a[focusIndex];let opts=q.o.map((x,i)=>{let cls='opt'+(focusChoice===i?' sel':'');if(focusReveal&&i===q.a)cls+=' correct';if(focusReveal&&focusChoice===i&&i!==q.a)cls+=' wrong';return `<button class="${cls}" onclick="focusChoice=${i};renderFocusCard()">${String.fromCharCode(65+i)}. ${x}</button>`}).join('');let sol=focusReveal?`<div class="whybox"><div class="notice good"><b>Correct Answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b></div><div class="example" style="margin-top:12px"><b>Solution / Why</b><br>${q.e}</div><div class="notice focus" style="margin-top:12px"><b>⚠ FE Trap:</b> ${q.trap}</div></div>`:'';$('#focuslist').innerHTML=`<div class="card qcard" style="min-height:400px"><div class="tag">FE Focus • Topic 10.${q.topic} • ${q.sub}</div><h2 style="margin:18px 0">${q.q}</h2><div style="display:grid;gap:10px">${opts}</div>${sol}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="prevFocus()">← Previous</button><button class="btn" onclick="focusReveal=!focusReveal;renderFocusCard()">${focusReveal?'Hide Solution':'Reveal Solution'}</button><button class="btn secondary" onclick="nextFocus()">Next →</button><span class="chip">${focusIndex+1}/${a.length}</span></div>`}
function prevFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex-1+a.length)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}
function nextFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex+1)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}
