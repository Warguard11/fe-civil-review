ext-align:left;margin:7px 0;padding:10px 12px;border-radius:9px;border:1px solid #234c68;background:#0a1b29;color:var(--text);cursor:pointer}.opt.sel{border-color:#55bfe8;background:#12344c}.opt.correct{border-color:var(--good);background:#113d2a}.opt.wrong{border-color:var(--bad);background:#472323}.explain{margin-top:10px;padding:10px;border-radius:8px;background:#0b2636;color:#cfe9f7}.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #28516c;background:#071827;color:white;margin:10px 0}.hidden{display:none}.progress{height:9px;background:#0a1b29;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#35a9d5;width:0}.score{font-size:24px;font-weight:800}.footer{margin:28px 0;color:#7796aa;font-size:12px}.kpi{font-size:28px;font-weight:800}.mini{font-size:12px;color:var(--muted)}.master{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.master button{padding:6px 9px;border-radius:8px;border:1px solid #28516c;background:#0a1b29;color:#cfe9f7;cursor:pointer}.master button.done{background:#113d2a;border-color:var(--good)}.calcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin:7px 0}.field input,.field select{padding:8px;border-radius:8px;border:1px solid #28516c;background:#071827;color:white;width:100%}.result{padding:12px;background:#113d2a;border:1px solid #2d7651;border-radius:10px;margin-top:10px;font-size:18px}.flash{min-height:260px;display:grid;place-items:center;text-align:center;cursor:pointer}.flash .eq{font-size:26px}.barrow{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-left:4px solid var(--warn);background:#2a2516;border-radius:8px}.focus{border-left:4px solid #51d88a}.whybox{padding:10px;background:#0b2636;border-radius:8px;margin-top:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#173044;font-size:11px;margin-right:5px}.tagalog{padding:12px;background:#10243a;border-radius:10px;border:1px solid #214766;margin-top:12px}.subjump{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.subjump button{font-size:12px;padding:6px 8px;border:1px solid #28516c;background:#0a1b29;color:#cfe9f7;border-radius:8px;cursor:pointer}@media(max-width:900px){.calcgrid{grid-template-columns:1fr}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:1fr}.main{padding:16px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}}\n</style></head><body><div class=\"app\"><aside class=\"side\"><div class=\"brand\">FE Civil Review Lab</div><div class=\"sub\">Water Resources & Environmental Engineering</div><div class=\"nav\" id=\"nav\"><button data-view=\"home\" class=\"active\">🏠 Dashboard</button><button data-view=\"formulas\">📐 Formula Bank</button><button data-view=\"quiz\">🧠 100-Question Test</button><button data-view=\"focusdrill\">🔥 FE Focus Drill</button><button data-view=\"strategy\">🎯 Exam Strategy</button><button data-view=\"calculators\">🧮 Calculators</button><button data-view=\"flashcards\">🗂️ Flashcards</button><button data-view=\"mistakes\">❌ Mistake Review</button></div><hr style=\"border-color:#17354b\"><div class=\"nav\" id=\"topicnav\"></div></aside><main class=\"main\"><section id=\"home\"></section><section id=\"topic\" class=\"hidden\"></section><section id=\"formulas\" class=\"hidden\"></section><section id=\"quiz\" class=\"hidden\"></section><section id=\"focusdrill\" class=\"hidden\"></section><section id=\"strategy\" class=\"hidden\"></section><section id=\"calculators\" class=\"hidden\"></section><section id=\"flashcards\" class=\"hidden\"></section><section id=\"mistakes\" class=\"hidden\"></section><div class=\"footer\">Study software built from the uploaded FE Civil Chapter 10 extract. Questions are original practice variants derived from the chapter's concepts and formulas, not copied exam questions.</div></main></div><script>\nconst topics=[{\"id\": \"A\", \"title\": \"10.A Basic Hydrology\", \"icon\": \"🌧️\", \"why\": \"Convert rainfall into runoff and hydrographs. The book emphasizes the Rational Method for small drainage areas, SCS Curve Number for runoff depth, unit hydrographs for timing, and Horton infiltration.\", \"important\": [\"Recognize whether the question asks for peak flow (Rational) or runoff depth (SCS CN).\", \"Use rainfall intensity at the time of concentration.\", \"Composite runoff coefficient must be area-weighted.\", \"Higher CN / more impervious cover means more runoff.\", \"Unit hydrograph scales linearly; urbanization makes peaks earlier and higher.\"], \"formulas\": [[\"Rational Method\", \"Q = C i A\", \"Peak runoff; US: i in in/hr, A in acres → Q ≈ cfs\"], [\"Composite C\", \"C = Σ(CⱼAⱼ)/ΣAⱼ\", \"Mixed land cover\"], [\"SCS storage\", \"S = 1000/CN − 10\", \"S in inches\"], [\"SCS runoff\", \"Q = (P − 0.2S)²/(P + 0.8S)\", \"Use Q=0 if P ≤ 0.2S\"], [\"Lag\", \"tlag = 0.6 tc\", \"Watershed response delay\"], [\"Time to peak\", \"tp = D/2 + tlag\", \"Unit hydrograph\"], [\"Triangular UH peak\", \"Qp = 484 A Q/tp\", \"A mi², Q in, tp hr, Qp cfs\"], [\"Horton infiltration\", \"f = fc + (f0 − fc)e^(−kt)\", \"Capacity decays toward fc\"]], \"example\": {\"q\": \"A 12-acre site has C=0.55 and i=2.5 in/hr. Find peak runoff.\", \"steps\": [\"Identify peak runoff → use Rational Method.\", \"Q = CiA = 0.55×2.5×12.\", \"Q = 16.5 cfs.\"], \"tip\": \"Do not convert acres to ft² when using the book's US Rational form.\"}}, {\"id\": \"B\", \"title\": \"10.B Basic Hydraulics\", \"icon\": \"🌊\", \"why\": \"Open-channel flow, flow regime, energy, weirs, and Bernoulli. Manning and Froude are the headline tools.\", \"important\": [\"Hydraulic radius is area divided by wetted perimeter; exclude free surface.\", \"Manning: larger n means lower velocity.\", \"Critical flow has Fr=1 and minimum specific energy.\", \"Normal depth generally requires trial/iteration.\", \"For pressure-pipe energy problems, combine Bernoulli with continuity and head loss.\", \"Hydraulic jump: use upstream Froude number to obtain downstream conjugate depth.\", \"Alternate depths have the same specific energy; critical depth occurs at minimum specific energy.\", \"Know both rectangular and 90° V-notch sharp-crested weirs.\"], \"formulas\": [[\"Manning velocity\", \"V = (k/n)R^(2/3)S^(1/2)\", \"k=1.486 US, 1.0 SI\"], [\"Discharge\", \"Q = VA\", \"Continuity\"], [\"Hydraulic radius\", \"R = A/P\", \"P = wetted perimeter\"], [\"Specific energy\", \"E = y + V²/(2g)\", \"Open channel\"], [\"Critical depth\", \"yc = (q²/g)^(1/3)\", \"Rectangular; q=Q/b\"], [\"Froude\", \"Fr = V/√(gD)\", \"<1 subcritical; >1 supercritical\"], [\"Rectangular weir\", \"Q = (2/3)Cd√(2g)LH^(3/2)\", \"Sharp-crested\"], [\"Bernoulli + loss\", \"P1/γ+z1+V1²/2g = P2/γ+z2+V2²/2g+hf\", \"Add pump/turbine heads as needed\"], [\"Hydraulic jump / sequent depth\", \"y₂ = (y₁/2)[√(1 + 8Fr₁²) − 1]\", \"Rectangular channel; supercritical upstream → subcritical downstream\"], [\"Alternate depths\", \"E₁ = E₂ = y + V²/(2g)\", \"Two depths can have the same specific energy\"], [\"90° V-notch weir\", \"Q = C H^(5/2)\", \"Sharp-crested V-notch; coefficient depends on units\"]], \"example\": {\"q\": \"A 3 m wide rectangular channel flows 1.2 m deep. Find R.\", \"steps\": [\"A=by=3×1.2=3.6 m².\", \"P=b+2y=3+2.4=5.4 m.\", \"R=A/P=3.6/5.4=0.667 m.\"], \"tip\": \"The top water surface is not part of wetted perimeter.\"}}, {\"id\": \"C\", \"title\": \"10.C Pumps\", \"icon\": \"⚙️\", \"why\": \"Pump power, system curves, NPSH/cavitation, series/parallel pumps, and affinity laws.\", \"important\": [\"Input power is water power divided by efficiency.\", \"Operating point is where pump curve intersects system curve.\", \"NPSHA must exceed NPSHR to avoid cavitation.\", \"Series adds head; parallel adds flow.\", \"Affinity: Q∝N, h∝N², P∝N³.\"], \"formulas\": [[\"Pump input power\", \"P = γQh/η\", \"SI gives watts\"], [\"System curve\", \"hsys = hstatic + KQ²\", \"Static + friction\"], [\"NPSH available\", \"NPSHA = (patm−pv)/γ − zs − hf\", \"Book form for suction system\"], [\"Affinity flow\", \"Q2/Q1=N2/N1\", \"Same impeller\"], [\"Affinity head\", \"h2/h1=(N2/N1)²\", \"Speed change\"], [\"Affinity power\", \"P2/P1=(N2/N1)³\", \"Speed change\"]], \"example\": {\"q\": \"Pump: Q=0.04 m³/s, h=25 m, η=0.75. Find input power.\", \"steps\": [\"Water power = γQh = 9810×0.04×25 = 9810 W.\", \"Input = 9810/0.75 = 13,080 W.\", \"≈13.1 kW.\"], \"tip\": \"Efficiency divides because motor input must exceed useful water power.\"}}, {\"id\": \"D\", \"title\": \"10.D Water Distribution Systems\", \"icon\": \"🚰\", \"why\": \"Pressurized pipe head loss, series/parallel networks, Hardy Cross concepts, demand, fire flow, storage, and pressure.\", \"important\": [\"Hazen-Williams C: larger C means smoother pipe (opposite trend from Manning n).\", \"Series pipes carry same Q and losses add.\", \"Parallel branches have equal head loss; flow splits by resistance.\", \"Design for peak demand / fire conditions, not average only.\", \"1 psi ≈ 2.31 ft of water head.\", \"Use the direct Hazen-Williams head-loss/pressure-loss form for pressurized pipe questions; watch US vs SI units.\", \"Fire hydrant capacity may be corrected to a standard residual pressure such as 20 psi.\", \"Hydrant/nozzle and sprinkler discharge use orifice-type square-root pressure relations.\"], \"formulas\": [[\"Hazen-Williams velocity\", \"V = k₁ C R^0.63 S^0.54\", \"k₁=1.318 US, 0.849 SI\"], [\"HW head loss (US)\", \"hf = 4.73 L Q^1.852/(C^1.852 D^4.87)\", \"Q cfs, L/D ft\"], [\"Continuity at node\", \"ΣQin = ΣQout\", \"Network mass balance\"], [\"Loop balance\", \"ΣhL = 0\", \"Hardy Cross principle\"], [\"Fire storage\", \"V = Qfire × duration\", \"Use consistent units\"], [\"Pressure head\", \"h(ft) = 2.31 × psi\", \"Water\"], [\"Hazen-Williams pipe head loss\", \"h_f = 4.73 L Q^1.852 /(C^1.852 D^4.87)\", \"US form; use handbook units\"], [\"Rated hydrant capacity\", \"Q_R = Q_F (H_F/H_R)^0.54\", \"Correct test flow to rated residual pressure\"], [\"Hydrant discharge to atmosphere\", \"Q ≈ 29.8 D² C_d √P\", \"US fire-flow form; D in, P psi, Q gpm\"], [\"Fire sprinkler discharge\", \"Q = K √P\", \"K depends on sprinkler/orifice size\"]], \"example\": {\"q\": \"A zone must provide 1,500 gpm fire flow for 2 hr. Find fire storage.\", \"steps\": [\"Convert time: 2 hr = 120 min.\", \"V = 1500×120 = 180,000 gal.\"], \"tip\": \"Fire flow is a rate; storage is rate × duration.\"}}, {\"id\": \"E\", \"title\": \"10.E Flood Control\", \"icon\": \"🏞️\", \"why\": \"Spillways, detention/retention, reservoir routing, levees/floodways, return period and project-life risk.\", \"important\": [\"Storage attenuates floods; levees convey rather than store.\", \"Detention lowers/delays peak but generally passes the storm volume.\", \"A 100-year flood means 1% annual exceedance probability, not once every century.\", \"Reservoir routing follows continuity I−O=dS/dt.\", \"Weir/spillway discharge varies with H^(3/2).\"], \"formulas\": [[\"Spillway/weir\", \"Q = C L H^(3/2)\", \"Book gives C≈3.33 US, 1.84 SI for rectangular weir form\"], [\"Storage change\", \"ΔS = (Qin−Qout)Δt\", \"Simple continuity\"], [\"Attenuation\", \"(Qp,in−Qp,out)/Qp,in\", \"Fraction peak reduction\"], [\"Annual exceedance\", \"p = 1/T\", \"Return period T\"], [\"Life-cycle risk\", \"R = 1 − (1 − 1/T)^n\", \"At least one exceedance in n years\"], [\"Weibull plotting\", \"T = (n+1)/m\", \"m-th largest in n years\"]], \"example\": {\"q\": \"What is the 30-year risk of at least one 100-year flood?\", \"steps\": [\"p=1/100=0.01 per year.\", \"R=1−(0.99)^30.\", \"R≈0.260 = 26%.\"], \"tip\": \"Do not use n/T as the exact risk.\"}}, {\"id\": \"F\", \"title\": \"10.F Stormwater\", \"icon\": \"🌧️\", \"why\": \"Site peak runoff, gutters/inlets/storm sewers, detention storage, and first-flush water-quality BMPs.\", \"important\": [\"Rational Method is the peak-flow workhorse for small sites.\", \"Storm sewer full-pipe hydraulic radius is D/4.\", \"Maintain self-cleansing velocity and avoid excessive scour velocity.\", \"Detention storage is area between inflow and outflow hydrographs.\", \"Peak control and water-quality volume are separate design criteria.\"], \"formulas\": [[\"Peak runoff\", \"Q = CiA\", \"Small drainage areas\"], [\"Gutter flow\", \"Q = (0.56/n) Sx^(5/3) S^(1/2) T^(8/3)\", \"Book US gutter form\"], [\"Storm sewer Manning\", \"Q = (1.486/n) A R^(2/3) S^(1/2)\", \"US full pipe; R=D/4\"], [\"Detention estimate\", \"Storage ≈ (Qin−Qout)t\", \"Convert time to seconds for cfs\"], [\"Volumetric coefficient\", \"Rv = 0.05 + 0.009I\", \"I = percent impervious\"], [\"Water quality volume\", \"WQv = (P/12)RvA\", \"P in, A ac → ac-ft\"]], \"example\": {\"q\": \"Qin=14 cfs, allowed Qout=6 cfs for 20 min. Estimate storage.\", \"steps\": [\"Excess=8 cfs.\", \"20 min=1200 s.\", \"Storage≈8×1200=9,600 ft³.\"], \"tip\": \"cfs requires seconds, not minutes.\"}}, {\"id\": \"G\", \"title\": \"10.G Collection Systems\", \"icon\": \"🕳️\", \"why\": \"Sanitary sewer types, gravity sewer Manning design, self-cleansing, partial-flow behavior, I/I, peaking, and manhole/invert slopes.\", \"important\": [\"Sanitary and storm systems are kept separate to avoid CSO/plant overload.\", \"Gravity sewers behave as open channels and use Manning.\", \"Self-cleansing velocity is about 2 ft/s (0.6 m/s) in the book review.\", \"At half-full circular flow, R=D/4; velocity equals full-flow velocity at same slope/n, but Q is half.\", \"I/I adds unwanted flow; Harmon factor peaks sanitary design flow.\"], \"formulas\": [[\"Manning sewer\", \"V=(k/n)R^(2/3)S^(1/2)\", \"Gravity sewer\"], [\"Minimum slope\", \"S=[Vn/(kR^(2/3))]²\", \"From Manning for target V\"], [\"Harmon peak factor\", \"PF=1+14/(4+√P)\", \"P in thousands\"], [\"Peak sanitary flow\", \"Qpeak=PF×Qavg\", \"Add I/I as required by problem\"], [\"Invert drop\", \"Δz=SL\", \"Between manholes\"]], \"example\": {\"q\": \"A sewer run is 350 ft at slope 0.005. Find invert drop.\", \"steps\": [\"Δz=SL.\", \"Δz=0.005×350=1.75 ft.\"], \"tip\": \"Slope is dimensionless drop per length.\"}}, {\"id\": \"H\", \"title\": \"10.H Groundwater\", \"icon\": \"💧\", \"why\": \"Darcy flow, hydraulic gradient/conductivity, transmissivity, confined/unconfined wells, and aquifer storage.\", \"important\": [\"Darcy discharge uses gross area and hydraulic gradient.\", \"Seepage velocity is Darcy velocity divided by porosity.\", \"Transmissivity T=Kb includes aquifer thickness.\", \"Confined Thiem uses linear head difference; unconfined uses squared heads.\", \"Specific yield governs drained volume in unconfined aquifers.\"], \"formulas\": [[\"Darcy velocity\", \"v=Ki\", \"Specific discharge\"], [\"Darcy discharge\", \"Q=KiA\", \"Gross area\"], [\"Seepage velocity\", \"vs=v/n\", \"Actual pore speed\"], [\"Transmissivity\", \"T=Kb\", \"m²/s\"], [\"Confined Thiem\", \"Q=2πT(h2−h1)/ln(r2/r1)\", \"Steady radial flow\"], [\"Unconfined Thiem\", \"Q=πK(h2²−h1²)/ln(r2/r1)\", \"Steady radial flow\"], [\"Unconfined storage\", \"V=Sy A Δh\", \"Specific yield\"], [\"Confined storage\", \"V=S A Δh\", \"Storage coefficient\"]], \"example\": {\"q\": \"K=2×10⁻⁴ m/s, i=0.01, A=50 m². Find Darcy discharge.\", \"steps\": [\"Q=KiA.\", \"Q=2×10⁻⁴×0.01×50=1.0×10⁻⁴ m³/s.\"], \"tip\": \"Do not omit the hydraulic gradient i.\"}}, {\"id\": \"I\", \"title\": \"10.I Water Quality\", \"icon\": \"🧪\", \"why\": \"BOD kinetics, dissolved oxygen sag, dilution/mass balance, nutrients, pH/alkalinity, and indicators.\", \"important\": [\"BOD5 is only a fraction of ultimate BOD.\", \"Higher BOD tends to lower DO.\", \"Mixing concentration is flow-weighted, not simple-average.\", \"DO deficit D=DOsat−DO; minimum DO corresponds to maximum deficit.\", \"Phosphorus commonly limits freshwater eutrophication in the book framing.\"], \"formulas\": [[\"BOD exerted\", \"BODt=BODu(1−e^(−kt))\", \"First-order\"], [\"Ultimate from BOD5\", \"BODu=BOD5/(1−e^(−5k))\", \"Base e\"], [\"DO deficit\", \"D=DOsat−DO\", \"Oxygen sag\"], [\"Critical deficit\", \"Dc=(kd La/kr)e^(−kd tc)\", \"Book summary form\"], [\"Mixing\", \"C=(Q1C1+Q2C2)/(Q1+Q2)\", \"Conservative mass balance\"], [\"pH\", \"pH=−log10[H+]\", \"Acidity\"]], \"example\": {\"q\": \"2 m³/s at 4 mg/L mixes with 3 m³/s at 10 mg/L. Find mixed concentration.\", \"steps\": [\"Use flow-weighted mass balance.\", \"C=(2×4+3×10)/(2+3)=38/5.\", \"C=7.6 mg/L.\"], \"tip\": \"A simple average (7 mg/L) is wrong because the flows differ.\"}}, {\"id\": \"J\", \"title\": \"10.J Testing & Standards\", \"icon\": \"🔬\", \"why\": \"Drinking-water standards, indicator organisms, BOD/DO tests, turbidity/jar tests, sampling protocols, plus the chapter's air/noise standards review.\", \"important\": [\"MCL = legal contaminant limit; primary standards protect health, secondary address aesthetics.\", \"Total coliform is a broad indicator; fecal coliform/E. coli is more specific to fecal contamination.\", \"BOD dilution test divides the DO drop by sample fraction.\", \"Jar test finds optimum coagulant dose by residual turbidity.\", \"Grab samples are snapshots; composites represent average conditions/load.\"], \"formulas\": [[\"BOD dilution test\", \"BOD=(DOi−DOf)/P\", \"P=Vsample/Vbottle\"], [\"Dilution fraction\", \"P=Vsample/Vbottle\", \"Dimensionless\"], [\"Sound level concept\", \"β=10 log10(I/I0)\", \"Included in chapter's air/noise section; use when provided\"]], \"example\": {\"q\": \"20 mL sample diluted to 300 mL; DO falls 8.5→3.5 mg/L. Find BOD5.\", \"steps\": [\"P=20/300=0.0667.\", \"DO drop=5.0 mg/L.\", \"BOD5=5/0.0667≈75 mg/L.\"], \"tip\": \"The DO drop is for the diluted bottle; divide by P to recover sample strength.\"}}, {\"id\": \"K\", \"title\": \"10.K Water & Wastewater Treatment\", \"icon\": \"🏭\", \"why\": \"Treatment train, coagulation/flocculation, sedimentation, filtration/disinfection, activated sludge, and softening.\", \"important\": [\"Treatment order: coagulate → flocculate → settle → filter → disinfect.\", \"Overflow rate uses surface area; detention time uses volume.\", \"Stokes settling velocity varies with particle diameter squared and assumes laminar settling.\", \"Disinfection CT is concentration × contact time.\", \"Activated sludge is biological secondary BOD removal; F/M is a key loading ratio.\"], \"formulas\": [[\"Velocity gradient\", \"G=√(P/(μV))\", \"Flocculation mixing\"], [\"Overflow rate\", \"vo=Q/As\", \"Sedimentation surface loading\"], [\"Detention time\", \"t=V/Q\", \"Basin residence time\"], [\"Stokes settling\", \"vs=g(ρp−ρ)d²/(18μ)\", \"Laminar, Re<1\"], [\"Filter loading\", \"vf=Q/Af\", \"Surface loading\"], [\"Disinfection\", \"CT=Ct\", \"mg·min/L\"], [\"Food/Microorganism\", \"F/M=QS0/(VX)\", \"Activated sludge\"], [\"Weir loading\", \"Q/Lweir\", \"Outlet loading\"], [\"Carbonate hardness\", \"CH=min(TH,Alk)\", \"As CaCO3\"]], \"example\": {\"q\": \"A clarifier treats 8,000 m³/d with 400 m² surface area. Find overflow rate.\", \"steps\": [\"vo=Q/As.\", \"vo=8000/400=20 m/d.\"], \"tip\": \"Overflow rate uses plan surface area, not basin volume.\"}}];\nconst subtopicTagalog={\n\"Rational Method\":\"Ginagamit ang Rational Method para tantiyahin ang peak runoff o pinakamataas na daloy mula sa maliit na drainage area. Kapag ibinigay ang runoff coefficient C, rainfall intensity i, at area A, ito ang unang formula na dapat isipin. Mas mataas ang C o i, mas mataas ang peak runoff.\",\n\"Composite C\":\"Kapag iba-iba ang surface ng watershed gaya ng pavement, roof, at grass, hindi puwedeng simpleng i-average ang C. I-weight ang bawat runoff coefficient ayon sa lawak ng area nito para makuha ang representative C ng buong site.\",\n\"SCS storage\":\"Ang S ay potential maximum retention ng lupa pagkatapos magsimula ang runoff. Nakadepende ito sa Curve Number: mataas na CN ay mas maliit na storage at karaniwang mas maraming runoff; mababang CN ay mas malaking infiltration/storage.\",\n\"SCS runoff\":\"Ginagamit ang SCS Curve Number runoff equation kapag runoff depth o runoff volume mula sa isang storm ang hinahanap. Kailangan muna ang CN para makuha ang S. Walang direct runoff kung hindi lalampas ang rainfall sa initial abstraction na 0.2S.\",\n\"Lag\":\"Ang lag time ay approximate delay ng watershed response mula rainfall papunta sa hydrograph response. Sa review relation, tlag=0.6tc. Mas maikling lag ay karaniwang mas mabilis at mas matarik na watershed response.\",\n\"Time to peak\":\"Ang tp ang oras hanggang peak ng unit hydrograph. Pinagsasama nito ang kalahati ng effective rainfall duration at watershed lag time, kaya mahalaga ito sa timing ng peak discharge.\",\n\"Triangular UH peak\":\"Ginagamit ito para tantiyahin ang peak discharge ng triangular unit hydrograph mula watershed area, direct-runoff depth, at time to peak. Siguraduhing tama ang required units dahil unit-specific ang coefficient na 484.\",\n\"Horton infiltration\":\"Ipinapakita ng Horton equation kung paano bumababa ang infiltration capacity habang tumatagal ang ulan. Nagsisimula ito malapit sa f0 at unti-unting lumalapit sa final capacity fc.\",\n\"Manning velocity\":\"Ginagamit ang Manning equation para sa open-channel o gravity flow. Ang velocity ay tumataas kapag mas malaki ang hydraulic radius o slope, at bumababa kapag mas mataas ang roughness n.\",\n\"Discharge\":\"Ang Q=VA ay continuity relation: discharge ay velocity times flow area. Gamitin kapag alam ang average velocity at cross-sectional area, o para hanapin ang isa sa tatlong variables.\",\n\"Hydraulic radius\":\"Ang hydraulic radius R=A/P ay sukatan ng efficiency ng flow section. Ang P ay wetted perimeter lamang—huwag isama ang free water surface sa open channel.\",\n\"Specific energy\":\"Ang specific energy ay depth plus velocity head sa open channel. Ginagamit ito sa pag-aaral ng critical flow at transitions; para sa given discharge, minimum ang specific energy sa critical depth.\",\n\"Critical depth\":\"Ang critical depth ay depth kung saan Fr=1 at minimum ang specific energy. Sa rectangular channel, gamitin ang unit discharge q=Q/b, hindi ang total Q direkta sa formula.\",\n\"Froude\":\"Ang Froude number ang mabilis na paraan para i-classify ang open-channel flow: Fr<1 subcritical, Fr=1 critical, at Fr>1 supercritical. Inihahambing nito ang flow velocity sa gravity-wave speed.\",\n\"Rectangular weir\":\"Ginagamit ang weir equation para sa discharge na dumadaan sa sharp-crested rectangular weir. Napakasensitive ng Q sa head H dahil H^(3/2), kaya mahalagang tama ang head measurement.\",\n\"Bernoulli + loss\":\"Gamitin ang Bernoulli energy equation para ikumpara ang pressure head, elevation head, velocity head, at head losses sa dalawang points. Idagdag ang pump head o turbine head kung kasama sa system.\",\n\"Pump input power\":\"Kinukuwenta nito ang power na kailangang ibigay sa pump. Ang useful water power ay γQh, pero dahil may losses, hinahati sa efficiency η para makuha ang required input power.\",\n\"System curve\":\"Ang system curve ay head na kailangan ng piping system sa bawat flow rate. Binubuo ito ng static head at friction loss; ang intersection nito sa pump curve ang actual operating point.\",\n\"NPSH available\":\"Ang NPSHA ay available suction head bago magkaroon ng vaporization/cavitation. Para safe ang pump, dapat mas mataas ang NPSHA kaysa NPSHR, preferably may margin.\",\n\"Affinity flow\":\"Sa parehong pump geometry, ang flow ay approximately proportional sa rotational speed. Halimbawa, 10% increase sa speed ay roughly 10% increase sa Q.\",\n\"Affinity head\":\"Ang pump head ay proportional sa square ng speed. Kaya maliit na pagbabago sa rpm ay mas malaking pagbabago sa head.\",\n\"Affinity power\":\"Ang required pump power ay proportional sa cube ng speed. Ito ang dahilan kung bakit mabilis tumaas ang power demand kapag tinaasan ang pump speed.\",\n\"Hazen-Williams velocity\":\"Ginagamit ang Hazen-Williams para sa pressurized water pipes. Ang C ay smoothness coefficient: mas mataas ang C, mas smooth ang pipe at karaniwang mas kaunti ang resistance.\",\n\"HW head loss (US)\":\"Ginagamit ito para hanapin ang friction head loss sa water-distribution pipe. Tumataas nang malakas ang loss kapag tumataas ang Q at bumababa ang diameter; mas mataas na C ay nagpapababa ng loss.\",\n\"Continuity at node\":\"Sa bawat junction ng pipe network, dapat equal ang total inflow at total outflow. Ito ang mass-conservation rule na ginagamit kasama ng energy/head-loss equations.\",\n\"Loop balance\":\"Sa closed pipe-network loop, ang algebraic sum ng head losses ay zero. Ito ang pangunahing energy condition sa Hardy Cross-type network calculations.\",\n\"Fire storage\":\"Ang required fire-storage volume ay fire-flow rate multiplied by required duration. Pinaka-common trap ang hindi pag-convert ng hours sa minutes kapag gpm ang flow.\",\n\"Pressure head\":\"Ginagamit ang relation na ito para mabilis i-convert ang water pressure sa equivalent feet of water head. Sa water, 1 psi ay approximately 2.31 ft of head.\",\n\"Spillway/weir\":\"Ginagamit para sa discharge sa spillway o weir. Dahil Q ay proportional sa H^(3/2), ang pagtaas ng water head ay mabilis na nagpapataas ng discharge capacity.\",\n\"Storage change\":\"Ito ay continuity para sa reservoir o detention storage: kung mas malaki ang inflow kaysa outflow, tumataas ang storage; kung mas malaki ang outflow, bumababa ang storage.\",\n\"Attenuation\":\"Ang attenuation ay percent o fraction na nabawas sa peak flow pagkatapos ng storage/routing. Mas malaking attenuation ibig sabihin mas epektibong napababa ang flood peak.\",\n\"Annual exceedance\":\"Ang return period T ay inverse ng annual exceedance probability. Halimbawa, 100-year event ay 1% chance bawat taon—hindi ibig sabihin na eksaktong isang beses lang kada 100 taon.\",\n\"Life-cycle risk\":\"Ginagamit ito para hanapin ang chance na mangyari kahit isang exceedance sa loob ng maraming taon. Mas mahaba ang project life, mas tumataas ang cumulative risk kahit maliit ang annual probability.\",\n\"Weibull plotting\":\"Ginagamit ang Weibull plotting position para tantiyahin ang return period mula ranked historical events. Ang m=1 ang pinakamalaking event sa record.\",\n\"Peak runoff\":\"Ito rin ang Rational Method application sa stormwater design. Gamitin para sa peak flow mula sa maliit na site gamit ang C, rainfall intensity, at drainage area.\",\n\"Gutter flow\":\"Ginagamit sa pag-estimate ng stormwater flow capacity sa street gutter. Malakas ang epekto ng spread T, cross slope, longitudinal slope, at roughness n sa capacity.\",\n\"Storm sewer Manning\":\"Para sa gravity storm sewer, gamitin ang Manning equation. Kung full circular pipe, R=D/4 at A=πD²/4 bago kunin ang Q.\",\n\"Detention estimate\":\"Quick estimate ito ng required storage mula sa excess inflow over allowed outflow times duration. Kung cfs ang flow, i-convert ang time sa seconds para ft³ ang volume.\",\n\"Volumetric coefficient\":\"Ang Rv ay empirical runoff-volume coefficient based sa percent imperviousness. Mas impervious ang site, mas mataas ang Rv at mas malaking water-quality runoff volume.\",\n\"Water quality volume\":\"Ginagamit para tantiyahin ang stormwater volume na kailangang i-treat para sa water quality. Huwag ipagkamali sa peak-flow detention sizing dahil magkaibang design objective ang volume treatment at peak control.\",\n\"Manning sewer\":\"Gravity sanitary sewers behave like open channels kaya Manning ang pangunahing equation. Kailangan ang hydraulic radius, slope, at roughness para makuha ang velocity o discharge.\",\n\"Minimum slope\":\"Ginagamit para hanapin ang minimum sewer slope na kailangan para maabot ang target self-cleansing velocity. Mas maliit na pipe/hydraulic radius o mas rough na pipe ay maaaring mangailangan ng mas malaking slope.\",\n\"Harmon peak factor\":\"Ang Harmon factor ay ginagamit para i-convert ang average sanitary flow sa peak sanitary flow based sa population. Tandaan na P ay population in thousands sa formula na ito.\",\n\"Peak sanitary flow\":\"Peak sanitary flow ay average flow multiplied by peaking factor, pagkatapos ay idagdag ang I/I kung hinihingi ng problem. Ito ang mas relevant sa capacity design kaysa average flow lamang.\",\n\"Invert drop\":\"Ang invert drop ay vertical elevation difference sa sewer run. Simple itong slope times horizontal length at useful sa manhole/invert elevation problems.\",\n\"Darcy velocity\":\"Ang Darcy velocity o specific discharge ay K times hydraulic gradient. Hindi ito actual pore-water speed; apparent flow rate ito based sa gross cross-sectional area.\",\n\"Darcy discharge\":\"Ginagamit ang Q=KiA para sa groundwater flow through porous media. Kailangan ang hydraulic conductivity, hydraulic gradient, at gross area perpendicular sa flow.\",\n\"Seepage velocity\":\"Ito ang actual average velocity ng tubig sa pore spaces. Mas mataas ito kaysa Darcy velocity dahil ang tubig ay dumadaloy lamang sa void area; divide Darcy velocity by porosity n.\",\n\"Transmissivity\":\"Ang transmissivity T=Kb ay combined ability ng buong saturated aquifer thickness na mag-transmit ng water. Units nito ay area per time.\",\n\"Confined Thiem\":\"Ginagamit sa steady radial flow papunta sa well sa confined aquifer. Linear head difference ang ginagamit at transmissivity T ang pangunahing aquifer parameter.\",\n\"Unconfined Thiem\":\"Ginagamit sa steady well flow sa unconfined aquifer. Clue sa formula ang squared heads h² dahil nagbabago ang saturated thickness kasama ng water-table elevation.\",\n\"Unconfined storage\":\"Para sa unconfined aquifer, specific yield Sy ang ginagamit para tantiyahin ang drained water volume dahil sa pagbaba ng water table.\",\n\"Confined storage\":\"Para sa confined aquifer, storage coefficient S ang ginagamit kasama ng aquifer area at head change para tantiyahin ang released/stored water volume.\",\n\"BOD exerted\":\"Ipinapakita nito kung gaano karaming ultimate BOD ang na-exert sa time t. Habang tumatagal, lumalapit ang BODt sa BODu ngunit hindi agad equal dito.\",\n\"Ultimate from BOD5\":\"Ginagamit kapag BOD5 ang measured value pero ultimate BOD ang hinihingi. I-correct ang five-day fraction gamit ang first-order decay constant k.\",\n\"DO deficit\":\"Ang DO deficit ay difference ng saturation DO at actual DO. Mas malaking deficit ay mas mababang actual oxygen condition; maximum deficit corresponds sa minimum DO.\",\n\"Critical deficit\":\"Ginagamit sa oxygen-sag analysis para tantiyahin ang maximum oxygen deficit sa critical time. Pinagsasama nito ang deoxygenation at reaeration effects.\",\n\"Mixing\":\"Kapag dalawang streams o flows na may magkaibang concentration ang naghahalo, gamitin ang flow-weighted mass balance. Huwag simple average maliban kung equal ang flows.\",\n\"pH\":\"Ang pH ay negative base-10 logarithm ng hydrogen-ion concentration. Mas mababang pH ay mas acidic; bawat 1 pH unit ay factor of 10 change sa [H+].\",\n\"BOD dilution test\":\"Sa BOD bottle test, ang measured DO drop ay para sa diluted sample. Divide ang DO drop by sample fraction P para ma-estimate ang BOD ng original sample.\",\n\"Dilution fraction\":\"Ang P ay fraction ng bottle volume na actual wastewater sample. Mahalaga ito sa BOD calculation dahil mas maliit na sample fraction means mas malaking correction sa observed DO drop.\",\n\"Sound level concept\":\"Ang decibel scale ay logarithmic. Ang formula ay nagko-convert ng intensity ratio sa dB, kaya malaking intensity changes ay nagiging mas maliit na numerical dB changes.\",\n\"Velocity gradient\":\"Ang G ay measure ng mixing intensity sa coagulation/flocculation. Nakadepende ito sa power input, fluid viscosity, at basin volume.\",\n\"Overflow rate\":\"Ang clarifier overflow rate ay flow divided by plan surface area. Surface area—not basin volume—ang key sizing parameter para sa ideal settling concept.\",\n\"Detention time\":\"Ang detention time ay theoretical average time na nananatili ang water sa basin. Compute as volume divided by flow at bantayan ang time units.\",\n\"Stokes settling\":\"Ginagamit ang Stokes law para sa maliit na particles sa laminar settling regime. Settling velocity ay proportional sa particle diameter squared, kaya malaking epekto ang particle size.\",\n\"Filter loading\":\"Ang filter loading rate ay flow divided by filter surface area. Ginagamit ito para i-check kung gaano karaming water ang pinoproseso bawat unit filter area.\",\n\"Disinfection\":\"Ang CT concept ay disinfectant concentration times contact time. Mas mataas na concentration o mas mahabang contact time ay nagpapataas ng CT, subject sa required treatment criteria.\",\n\"Food/Microorganism\":\"Ang F/M ratio ay organic food loading relative sa mass ng microorganisms sa activated-sludge aeration basin. Ginagamit ito bilang biological-process loading indicator.\",\n\"Weir loading\":\"Ang weir loading ay clarifier flow divided by total outlet-weir length. Ginagamit ito para i-check kung overloaded ang effluent withdrawal along the weir.\",\n\"Carbonate hardness\":\"Ang carbonate hardness ay limited ng mas maliit sa total hardness at alkalinity, parehong expressed as CaCO3. Ang natitirang hardness beyond CH ay noncarbonate hardness.\"\n};\n\nconst formulaExamples={\nA:{\"Rational Method\":\"C=0.60, i=2.0 in/hr, A=15 ac → Q=0.60(2)(15)=18 cfs.\",\"Composite C\":\"10 ac pavement C=.90 + 20 ac grass C=.20 → C=(.9×10+.2×20)/30=0.433.\",\"SCS storage\":\"CN=80 → S=1000/80−10=2.50 in.\",\"SCS runoff\":\"CN=80 gives S=2.5 in; P=4 in → Q=(4−0.5)²/(4+2)=2.04 in.\",\"Lag\":\"tc=2.0 hr → tlag=.6(2)=1.2 hr.\",\"Time to peak\":\"D=1 hr, tlag=1.2 hr → tp=.5+1.2=1.7 hr.\",\"Triangular UH peak\":\"A=2 mi², runoff depth=1 in, tp=2 hr → Qp=484(2)(1)/2=484 cfs.\",\"Horton infiltration\":\"f0=3, fc=.5 in/hr, k=1/hr, t=2 hr → f=.5+2.5e⁻²≈.84 in/hr.\"},\nB:{\"Manning velocity\":\"SI: n=.015, R=.60 m, S=.002 → V=(1/.015)(.60)^(2/3)(.002)^.5≈2.12 m/s.\",\"Discharge\":\"A=2.5 m², V=1.8 m/s → Q=AV=4.5 m³/s.\",\"Hydraulic radius\":\"Rectangular b=3 m, y=1.2 m → A=3.6, P=5.4, R=.667 m.\",\"Specific energy\":\"y=1.0 m, V=2 m/s → E=1+4/(2×9.81)=1.204 m.\",\"Critical depth\":\"q=3 m²/s → yc=(9/9.81)^(1/3)=.972 m.\",\"Froude\":\"V=2 m/s, hydraulic depth D=1 m → Fr=2/√9.81=.64 → subcritical.\",\"Rectangular weir\":\"Cd=.62, L=2 m, H=.5 m → substitute in Q=(2/3)Cd√(2g)LH^(3/2) → Q≈1.30 m³/s.\",\"Bernoulli + loss\":\"Same-diameter reservoirs: z1=20 m, z2=5 m, hf=3 m → available velocity/pump head relation uses 20=5+hf+V²/2g.\"},\nC:{\"Pump input power\":\"Q=.04 m³/s, h=25 m, η=.75 → P=9810(.04)(25)/.75=13.1 kW.\",\"System curve\":\"hstatic=12 m, K=800, Q=.05 m³/s → hsys=12+800(.05)²=14 m.\",\"NPSH available\":\"(patm−pv)/γ=10 m, zs=2 m, hf=1 m → NPSHA=7 m; compare with NPSHR.\",\"Affinity flow\":\"Speed rises 1200→1500 rpm; Q1=40 L/s → Q2=40(1500/1200)=50 L/s.\",\"Affinity head\":\"h1=20 m at 1200 rpm → h2=20(1500/1200)²=31.25 m.\",\"Affinity power\":\"P1=10 kW at 1200 rpm → P2=10(1500/1200)³=19.53 kW.\"},\nD:{\"Hazen-Williams velocity\":\"Given C, R and energy slope S, insert directly in V=k₁CR^.63S^.54; use k₁=1.318 US or .849 SI.\",\"HW head loss (US)\":\"L=1000 ft, Q=2 cfs, C=130, D=1 ft → hf=4.73(1000)(2^1.852)/(130^1.852)=2.06 ft.\",\"Continuity at node\":\"12 cfs enters a junction; 5 cfs leaves one branch → other branch must carry 7 cfs.\",\"Loop balance\":\"If known loop losses are +8 ft and −5 ft, remaining branch must contribute −3 ft so ΣhL=0.\",\"Fire storage\":\"1500 gpm for 2 hr → 1500×120=180,000 gal.\",\"Pressure head\":\"60 psi → h=2.31(60)=138.6 ft of water.\"},\nE:{\"Spillway/weir\":\"US: C=3.33, L=10 ft, H=2 ft → Q=3.33(10)(2^1.5)=94.2 cfs.\",\"Storage change\":\"Qin=20 cfs, Qout=8 cfs for 10 min → ΔS=12×600=7200 ft³.\",\"Attenuation\":\"Peak falls 100→65 cfs → attenuation=(100−65)/100=35%.\",\"Annual exceedance\":\"T=50 yr → p=1/50=.02=2% per year.\",\"Life-cycle risk\":\"100-yr flood over 30 yr → R=1−.99³⁰≈26%.\",\"Weibull plotting\":\"24 annual peaks; largest has m=1 → T=(24+1)/1=25 yr.\"},\nF:{\"Peak runoff\":\"C=.7, i=3 in/hr, A=20 ac → Q=.7(3)(20)=42 cfs.\",\"Gutter flow\":\"Use the given n, cross-slope Sx, longitudinal slope S and spread T in the book equation; increasing T strongly raises capacity because T has exponent 8/3.\",\"Storm sewer Manning\":\"Full circular pipe: first use R=D/4, then A=πD²/4 and Q=(1.486/n)AR^(2/3)S^.5.\",\"Detention estimate\":\"Qin=14, Qout=6 cfs, t=20 min → storage=(8)(1200)=9600 ft³.\",\"Volumetric coefficient\":\"65% impervious → Rv=.05+.009(65)=.635.\",\"Water quality volume\":\"P=1 in, Rv=.635, A=10 ac → WQv=(1/12)(.635)(10)=.529 ac-ft.\"},\nG:{\"Manning sewer\":\"For a gravity sewer, compute R=A/P and use Manning; e.g. full D=2 ft gives R=.5 ft.\",\"Minimum slope\":\"US: target V=2 ft/s, n=.013, R=.25 ft → S=[2(.013)/(1.486(.25)^(2/3))]²≈.00289.\",\"Harmon peak factor\":\"P=10 thousand → PF=1+14/(4+√10)=2.96.\",\"Peak sanitary flow\":\"Qavg=1.0 MGD and PF=2.96 → Qpeak=2.96 MGD before any specified I/I allowance.\",\"Invert drop\":\"S=.004, L=400 ft → Δz=.004(400)=1.6 ft.\"},\nH:{\"Darcy velocity\":\"K=2×10⁻⁴ m/s, i=.01 → v=Ki=2×10⁻⁶ m/s.\",\"Darcy discharge\":\"K=2×10⁻⁴, i=.01, A=50 m² → Q=1×10⁻⁴ m³/s.\",\"Seepage velocity\":\"Darcy v=2×10⁻⁶ m/s, n=.25 → vs=8×10⁻⁶ m/s.\",\"Transmissivity\":\"K=1×10⁻⁴ m/s, b=20 m → T=.002 m²/s.\",\"Confined Thiem\":\"Use measured heads at two radii: T=.002, h2−h1=2 m, r2/r1=10 → Q=2π(.002)(2)/ln10=.0109 m³/s.\",\"Unconfined Thiem\":\"K=1×10⁻⁴, h2=12 m, h1=10 m, r2/r1=10 → Q=πK(144−100)/ln10≈.0060 m³/s.\",\"Unconfined storage\":\"Sy=.20, A=10,000 m², Δh=1.5 m → V=.2(10000)(1.5)=3000 m³.\",\"Confined storage\":\"S=.001, A=1,000,000 m², Δh=2 m → V=2000 m³.\"},\nI:{\"BOD exerted\":\"BODu=200 mg/L, k=.23/d, t=5 d → BOD5=200(1−e⁻¹·¹⁵)=136.7 mg/L.\",\"Ultimate from BOD5\":\"BOD5=137 mg/L, k=.23/d → BODu=137/(1−e⁻¹·¹⁵)≈200 mg/L.\",\"DO deficit\":\"DOsat=9 mg/L, measured DO=6 mg/L → D=3 mg/L.\",\"Critical deficit\":\"If kd=.2/d, La=10, kr=.4/d, tc=2 d → Dc=(.2×10/.4)e⁻·⁴=3.35 mg/L; DOmin=DOsat−Dc.\",\"Mixing\":\"2 m³/s at 4 mg/L + 3 m³/s at 10 mg/L → C=(8+30)/5=7.6 mg/L.\",\"pH\":\"[H+]=1×10⁻⁶ mol/L → pH=6.\"},\nJ:{\"BOD dilution test\":\"15 mL sample in 300 mL bottle; DO 8→2 mg/L → P=.05, BOD5=6/.05=120 mg/L.\",\"Dilution fraction\":\"20 mL sample diluted to 300 mL → P=20/300=.0667.\",\"Sound level concept\":\"If I/I0=10⁶ → β=10log10(10⁶)=60 dB.\"},\nK:{\"Velocity gradient\":\"P=600 W, μ=.001 Pa·s, V=600 m³ → G=√(600/(.001×600))=31.6 s⁻¹.\",\"Overflow rate\":\"Q=8000 m³/d, As=400 m² → vo=20 m/d.\",\"Detention time\":\"V=1200 m³, Q=6000 m³/d → t=.2 d=4.8 hr.\",\"Stokes settling\":\"ρp=2650, ρ=1000 kg/m³, d=.0001 m, μ=.001 → vs=9.81(1650)(10⁻⁸)/(.018)=.0090 m/s.\",\"Filter loading\":\"Q=12,000 m³/d, Af=300 m² → vf=40 m/d.\",\"Disinfection\":\"C=2 mg/L for t=30 min → CT=60 mg·min/L.\",\"Food/Microorganism\":\"Q=5000 m³/d, S0=.2 kg/m³, V=2500 m³, X=2 kg/m³ → F/M=.20 d⁻¹.\",\"Weir loading\":\"Q=6000 m³/d, total weir length=120 m → loading=50 m³/(m·d).\",\"Carbonate hardness\":\"TH=120 mg/L as CaCO3, alkalinity=80 → CH=min(120,80)=80 mg/L.\"}\n,\n\"Hydraulic jump / sequent depth\":\"Kapag mabilis at mababaw na supercritical flow ay biglang nagiging mas malalim at subcritical, hydraulic jump ang clue. Kunin muna ang upstream Froude number bago hanapin ang downstream conjugate depth. Common ito sa energy dissipation sa spillway at stilling basin.\",\n\"Alternate depths\":\"Dalawang magkaibang flow depth ang puwedeng magkaroon ng parehong specific energy. Ang critical depth ang minimum specific energy. Sa diagram, isipin ang shallow supercritical at deep subcritical branches.\",\n\"90° V-notch weir\":\"Magandang pang-measure ng relatively low open-channel flows. Mas sensitibo ito sa head kaysa rectangular weir at ang discharge ay proportional sa H^(5/2).\",\n\"Hazen-Williams pipe head loss\":\"Direct head-loss form ito para sa pressurized water pipe. Malakas ang epekto ng diameter dahil mataas ang exponent nito. Bantayan ang US/SI units.\",\n\"Rated hydrant capacity\":\"Ginagamit sa hydrant flow test para i-correct ang measured flow sa standard residual pressure, madalas 20 psi. Hindi palaging equal ang measured flow at rated capacity.\",\n\"Hydrant discharge to atmosphere\":\"Orifice-type fire-flow relation. Discharge increases with nozzle diameter squared at sa square root ng pressure.\",\n\"Fire sprinkler discharge\":\"Sprinkler flow follows Q=K√P. Hindi linear ang effect ng pressure; halimbawa 4× pressure gives about 2× flow.\"};\nconst focusQuestions=[\n{topic:'A',sub:'Rational Method',q:'A 24-acre drainage area has 8 ac at C=0.90 and 16 ac at C=0.30. Rainfall intensity is 2.0 in/hr. Find peak runoff.',o:['19.2 cfs','24.0 cfs','28.8 cfs','38.4 cfs'],a:1,e:'Composite C=[8(.90)+16(.30)]/24=0.50. Then Q=CiA=.50(2)(24)=24 cfs.',trap:'Do not average the two C values unless the areas are equal.'},\n{topic:'A',sub:'SCS Curve Number',q:'For CN=80, what rainfall depth must be exceeded before direct runoff begins in the SCS equation?',o:['0.20 in','0.50 in','2.00 in','2.50 in'],a:1,e:'S=1000/80−10=2.5 in. Initial abstraction=0.2S=0.50 in.',trap:'The threshold is 0.2S, not S.'},\n{topic:'A',sub:'Unit Hydrograph',q:'A 3-mi² watershed has 1.5 in of direct runoff and tp=2 hr. Estimate triangular unit-hydrograph peak.',o:['363 cfs','544.5 cfs','1089 cfs','1452 cfs'],a:2,e:'Qp=484AQ/tp=484(3)(1.5)/2=1089 cfs.',trap:'Use area in mi², runoff depth in inches, and tp in hours for this form.'},\n{topic:'A',sub:'Horton Infiltration',q:'As time becomes very large in the Horton equation, infiltration capacity approaches:',o:['f0','fc','0','k'],a:1,e:'The exponential term tends to zero, so f→fc.',trap:'fc is the long-term capacity; f0 is the initial capacity.'},\n{topic:'A',sub:'Hydrology Recognition',q:'A problem gives rainfall intensity, drainage area, and runoff coefficient and asks for peak discharge from a small site. First equation?',o:['Darcy','Rational','SCS CN','Manning'],a:1,e:'Those are the direct trigger variables for Q=CiA.',trap:'SCS CN is primarily for runoff depth/volume, not this peak-flow setup.'},\n{topic:'B',sub:'Manning',q:'For the same channel geometry and slope, Manning n increases from 0.015 to 0.030. Velocity approximately:',o:['Doubles','Halves','Quadruples','Unchanged'],a:1,e:'V is inversely proportional to n, so doubling n halves V.',trap:'Manning n is resistance: larger n means slower flow.'},\n{topic:'B',sub:'Critical Depth',q:'A rectangular channel carries Q=12 m³/s and is 4 m wide. Find critical depth.',o:['0.72 m','0.97 m','1.24 m','1.50 m'],a:1,e:'q=Q/b=3 m²/s; yc=(q²/g)^(1/3)=(9/9.81)^(1/3)=0.972 m.',trap:'Use discharge per unit width q, not total Q.'},\n{topic:'B',sub:'Froude Number',q:'A channel has Fr=1.35. The flow is:',o:['Subcritical','Critical','Supercritical','Pressurized'],a:2,e:'Fr>1 indicates supercritical flow.',trap:'Froude classifies open-channel flow regime; it does not mean pressurized flow.'},\n{topic:'B',sub:'Hydraulic Radius',q:'For a full circular pipe of diameter D, hydraulic radius is:',o:['D','D/2','D/4','πD'],a:2,e:'R=A/P=(πD²/4)/(πD)=D/4.',trap:'Hydraulic radius is not the geometric radius.'},\n{topic:'B',sub:'Specific Energy',q:'At critical flow in an open channel, specific energy for a given discharge is:',o:['Maximum','Minimum','Zero','Independent of depth'],a:1,e:'Critical depth corresponds to minimum specific energy.',trap:'Critical flow is the minimum-energy condition for fixed discharge.'},\n{topic:'C',sub:'Pump Power',q:'A pump delivers 0.05 m³/s through 30 m head at 80% efficiency. Input power is closest to:',o:['11.8 kW','14.7 kW','18.4 kW','23.5 kW'],a:2,e:'P=9810(.05)(30)/.80=18.39 kW.',trap:'Divide by efficiency for input power.'},\n{topic:'C',sub:'Affinity Laws',q:'Pump speed increases by 20%. Head changes approximately by:',o:['+20%','+40%','+44%','+73%'],a:2,e:'h2/h1=(1.2)²=1.44, so head increases 44%.',trap:'Head follows speed squared; power follows speed cubed.'},\n{topic:'C',sub:'Series vs Parallel',q:'Two similar pumps are placed in series. The primary effect is to increase:',o:['Head at a given flow','Flow at zero head only','Pipe diameter','NPSHR to zero'],a:0,e:'Series pumps add head; parallel pumps add flow capacity.',trap:'Remember: series=head, parallel=flow.'},\n{topic:'C',sub:'NPSH',q:'Which condition best avoids pump cavitation?',o:['NPSHA < NPSHR','NPSHA = 0','NPSHA > NPSHR','pv > patm'],a:2,e:'Available NPSH must exceed required NPSH.',trap:'A safety margin is desirable; equality is not the target.'},\n{topic:'C',sub:'Operating Point',q:'The actual operating flow of a pump-pipe system occurs where:',o:['Pump efficiency is zero','Pump curve intersects system curve','Static head is zero','NPSHA=NPSHR'],a:1,e:'The operating point satisfies both the pump head curve and system head requirement.',trap:'NPSH is a cavitation check, not the operating-point definition.'},\n{topic:'D',sub:'Hazen-Williams',q:'All else equal, increasing Hazen-Williams C causes head loss to:',o:['Increase','Decrease','Remain constant','Become negative'],a:1,e:'In the head-loss equation C is in the denominator; larger C means smoother pipe and less loss.',trap:'This trend is opposite the intuitive use of Manning n.'},\n{topic:'D',sub:'Pressure Head',q:'A gauge pressure of 50 psi corresponds to approximately:',o:['21.6 ft','50 ft','115.5 ft','231 ft'],a:2,e:'h=2.31(50)=115.5 ft of water.',trap:'Use about 2.31 ft of water per psi.'},\n{topic:'D',sub:'Networks',q:'At a pipe-network junction, which relation must be satisfied?',o:['ΣhL=1','ΣQin=ΣQout','All pipe velocities equal','All diameters equal'],a:1,e:'Continuity requires mass conservation at each node.',trap:'Loop head-loss balance is a different network condition.'},\n{topic:'D',sub:'Parallel Pipes',q:'For two parallel branches connecting the same two nodes, the branches have equal:',o:['Flow','Diameter','Velocity','Head loss'],a:3,e:'Both branches connect the same energy nodes, so their head losses are equal while flow splits.',trap:'Equal head loss does not imply equal flow.'},\n{topic:'D',sub:'Fire Storage',q:'Required fire flow is 2000 gpm for 3 hr. Required dedicated volume is:',o:['120,000 gal','240,000 gal','360,000 gal','6,000 gal'],a:2,e:'3 hr=180 min; V=2000(180)=360,000 gal.',trap:'Convert hours to minutes before multiplying by gpm.'},\n{topic:'E',sub:'Return Period',q:'A 25-year flood has annual exceedance probability of:',o:['25%','10%','4%','1%'],a:2,e:'p=1/T=1/25=.04=4%.',trap:'Return period is not the annual percentage itself.'},\n{topic:'E',sub:'Life-Cycle Risk',q:'Probability of at least one 50-year event in 20 years is closest to:',o:['20%','33%','40%','50%'],a:1,e:'R=1−(1−1/50)^20=1−.98^20≈33.2%.',trap:'n/T=40% is only a rough approximation and is not exact.'},\n{topic:'E',sub:'Reservoir Routing',q:'During a 15-min interval, average inflow is 40 cfs and outflow is 25 cfs. Storage increases by:',o:['225 ft³','900 ft³','13,500 ft³','36,000 ft³'],a:2,e:'ΔS=(40−25)(15×60)=13,500 ft³.',trap:'Convert minutes to seconds when flow is in cfs.'},\n{topic:'E',sub:'Detention',q:'The principal hydrologic purpose of a detention basin is to:',o:['Increase peak flow','Lower and delay peak outflow','Remove all storm volume permanently','Increase return period'],a:1,e:'Detention temporarily stores runoff and attenuates the peak.',trap:'Retention and detention are not identical; detention generally releases stored stormwater.'},\n{topic:'E',sub:'Weir/Spillway',q:'If head H over a weir doubles and all else is unchanged, discharge changes by a factor of:',o:['2','2.83','4','8'],a:1,e:'Q∝H^(3/2), so factor=2^(3/2)=2.828.',trap:'Weir flow is not linear with head.'},\n{topic:'F',sub:'Detention Storage',q:'Peak inflow exceeds allowed outflow by 10 cfs for 30 min. Rectangular estimate of storage is:',o:['300 ft³','18,000 ft³','30,000 ft³','180,000 ft³'],a:1,e:'Storage≈10(30×60)=18,000 ft³.',trap:'Use seconds with cfs.'},\n{topic:'F',sub:'Water Quality Volume',q:'A 20-acre site is 50% impervious. For P=1 in, estimate WQv using Rv=.05+.009I.',o:['0.42 ac-ft','0.83 ac-ft','1.67 ac-ft','10 ac-ft'],a:1,e:'Rv=.05+.009(50)=.50; WQv=(1/12)(.50)(20)=.833 ac-ft.',trap:'I is entered as percent (50), not decimal 0.50, in this empirical equation.'},\n{topic:'F',sub:'Storm Sewer',q:'When using Manning for a full circular storm sewer, use R=',o:['D/2','D/4','πD²/4','2D'],a:1,e:'For full circular flow R=A/P=D/4.',trap:'Do not use geometric radius D/2.'},\n{topic:'F',sub:'BMP Concept',q:'Which design objective is separate from peak-flow control in the chapter?',o:['Water-quality volume','Hydraulic radius','Pump NPSH','Aquifer storage'],a:0,e:'Stormwater design commonly treats peak control and water-quality volume as separate criteria.',trap:'Do not assume a basin sized only for peak control automatically satisfies water-quality sizing.'},\n{topic:'F',sub:'Rational Method',q:'For C=.75, i=2.4 in/hr, A=18 ac, peak runoff is:',o:['24.3 cfs','32.4 cfs','43.2 cfs','58.3 cfs'],a:1,e:'Q=.75(2.4)(18)=32.4 cfs.',trap:'In the chapter US Rational form, acres and in/hr give approximately cfs.'},\n{topic:'G',sub:'Self-Cleansing',q:'The chapter review uses approximately what minimum self-cleansing velocity for gravity sewers?',o:['0.2 ft/s','1 ft/s','2 ft/s','10 ft/s'],a:2,e:'The review target is about 2 ft/s (0.6 m/s).',trap:'This is a review/design target from the source chapter, not a universal code value.'},\n{topic:'G',sub:'Harmon Factor',q:'For population P=9 (thousand), Harmon peak factor is closest to:',o:['1.5','2.0','3.0','4.5'],a:2,e:'PF=1+14/(4+√9)=1+14/7=3.0.',trap:'P is in thousands.'},\n{topic:'G',sub:'Partial Flow',q:'At half-full flow in a circular gravity sewer at the same slope and n, compared with full flow:',o:['Velocity is half','Velocity is the same and Q is half','Velocity doubles','Q is unchanged'],a:1,e:'At half-full, R remains D/4, so Manning velocity is the same; area and discharge are half.',trap:'Do not assume half depth means half hydraulic radius.'},\n{topic:'G',sub:'Invert Drop',q:'A 500-ft sewer at slope 0.003 requires an invert drop of:',o:['0.15 ft','0.50 ft','1.50 ft','15 ft'],a:2,e:'Δz=SL=.003(500)=1.5 ft.',trap:'Slope is dimensionless ft/ft.'},\n{topic:'G',sub:'I/I',q:'Inflow and infiltration in a sanitary sewer generally:',o:['Reduce plant flow','Add unwanted flow and can increase peak loading','Increase pipe roughness coefficient only','Eliminate peaking'],a:1,e:'I/I adds non-sanitary water to the collection system and can overload conveyance/treatment.',trap:'Include I/I when the problem explicitly provides or requests it.'},\n{topic:'H',sub:'Darcy Flow',q:'K=5×10⁻⁵ m/s, gradient=.02, area=100 m². Groundwater discharge is:',o:['1×10⁻⁶ m³/s','1×10⁻⁴ m³/s','0.01 m³/s','0.10 m³/s'],a:1,e:'Q=KiA=(5×10⁻⁵)(.02)(100)=1×10⁻⁴ m³/s.',trap:'Do not forget cross-sectional area.'},\n{topic:'H',sub:'Seepage Velocity',q:'Darcy velocity is 3×10⁻⁶ m/s and porosity is 0.30. Seepage velocity is:',o:['9×10⁻⁷','3×10⁻⁶','1×10⁻⁵','1×10⁻⁴'],a:2,e:'vs=v/n=3×10⁻⁶/.30=1×10⁻⁵ m/s.',trap:'Actual pore velocity is larger than Darcy velocity when n<1.'},\n{topic:'H',sub:'Transmissivity',q:'An aquifer has K=2×10⁻⁴ m/s and thickness 30 m. T=',o:['6×10⁻⁶ m²/s','6×10⁻³ m²/s','0.6 m²/s','150,000 m²/s'],a:1,e:'T=Kb=2×10⁻⁴(30)=6×10⁻³ m²/s.',trap:'Transmissivity includes saturated thickness.'},\n{topic:'H',sub:'Well Equation',q:'Which clue points to the unconfined Thiem equation rather than confined?',o:['Squared hydraulic heads','Pressure head in a pipe','Manning n','BOD5'],a:0,e:'The unconfined steady radial-flow equation contains h2²−h1².',trap:'Confined Thiem uses a linear head difference with transmissivity.'},\n{topic:'H',sub:'Aquifer Storage',q:'For an unconfined aquifer, drained volume from a water-table decline is based primarily on:',o:['Specific yield','Manning n','Hazen-Williams C','Froude number'],a:0,e:'V=Sy A Δh for the chapter unconfined-storage relation.',trap:'Confined storage uses storage coefficient S instead.'},\n{topic:'I',sub:'Mixing',q:'1 m³/s at 2 mg/L mixes with 4 m³/s at 8 mg/L. Mixed concentration is:',o:['5.0 mg/L','6.0 mg/L','6.8 mg/L','8.0 mg/L'],a:2,e:'C=(1×2+4×8)/5=34/5=6.8 mg/L.',trap:'Use flow-weighted concentration, not a simple average.'},\n{topic:'I',sub:'DO Deficit',q:'DO saturation is 9.5 mg/L and measured DO is 6.0 mg/L. Deficit is:',o:['3.5 mg/L','6.0 mg/L','9.5 mg/L','15.5 mg/L'],a:0,e:'D=DOsat−DO=9.5−6.0=3.5 mg/L.',trap:'Maximum deficit corresponds to minimum DO.'},\n{topic:'I',sub:'BOD',q:'If BODu=250 mg/L, k=.20/d, what is BOD exerted after 5 d?',o:['79 mg/L','92 mg/L','158 mg/L','250 mg/L'],a:2,e:'BOD5=250(1−e^(−1))=158 mg/L.',trap:'BOD5 is generally less than ultimate BOD.'},\n{topic:'I',sub:'pH',q:'If [H+]=1×10⁻⁵ mol/L, pH=',o:['4','5','7','9'],a:1,e:'pH=−log10(10⁻⁵)=5.',trap:'The negative exponent becomes the positive pH value.'},\n{topic:'I',sub:'Water Quality Concept',q:'An increase in biodegradable organic loading generally causes stream DO to:',o:['Increase','Decrease','Remain exactly constant','Become pH'],a:1,e:'Higher oxygen demand consumes dissolved oxygen.',trap:'BOD and DO generally move in opposite directions after an organic load.'},\n{topic:'J',sub:'BOD Bottle',q:'A 30-mL wastewater sample is diluted to 300 mL. DO drops from 9 to 4 mg/L. BOD5 is:',o:['5 mg/L','25 mg/L','50 mg/L','150 mg/L'],a:2,e:'P=30/300=.10; BOD=(9−4)/.10=50 mg/L.',trap:'Divide the bottle DO drop by sample fraction.'},\n{topic:'J',sub:'Standards',q:'Which statement matches the chapter review?',o:['Secondary standards primarily protect against acute toxicity','Primary standards protect health; secondary standards address aesthetic concerns','MCL is only a suggested value','E. coli is less specific than total coliform'],a:1,e:'The chapter distinguishes health-based primary standards from aesthetic secondary standards.',trap:'MCL is presented as a legal contaminant limit.'},\n{topic:'J',sub:'Indicators',q:'Which is more specific evidence of fecal contamination?',o:['Total coliform','E. coli/fecal coliform','Turbidity alone','Hardness'],a:1,e:'Fecal coliform/E. coli is more specific to fecal contamination than total coliform.',trap:'Total coliform is a broader indicator.'},\n{topic:'J',sub:'Jar Test',q:'The jar test is primarily used to determine:',o:['Optimum coagulant dose','Pump efficiency','Aquifer porosity','Sewer slope'],a:0,e:'Compare residual turbidity after different coagulant doses to identify an optimum.',trap:'It is a treatment-process optimization test.'},\n{topic:'J',sub:'Sampling',q:'Which sample type better represents average conditions over time?',o:['Grab sample','Composite sample','Blank only','Single instantaneous field reading'],a:1,e:'A composite combines samples over time/flow and better represents average conditions or loading.',trap:'A grab sample is a snapshot.'},\n{topic:'K',sub:'Treatment Train',q:'Which sequence is correct for conventional water treatment?',o:['Filter→coagulate→settle→disinfect','Coagulate→flocculate→settle→filter→disinfect','Disinfect→settle→flocculate→filter','Settle→disinfect→coagulate→filter'],a:1,e:'The chapter review emphasizes coagulate → flocculate → settle → filter → disinfect.',trap:'Disinfection is typically after particle removal in this simplified treatment train.'},\n{topic:'K',sub:'Clarifier Overflow',q:'A clarifier treats 12,000 m³/d with 600 m² surface area. Overflow rate=',o:['10 m/d','20 m/d','30 m/d','72 m/d'],a:1,e:'vo=Q/As=12000/600=20 m/d.',trap:'Use plan surface area, not basin volume.'},\n{topic:'K',sub:'Detention Time',q:'A basin volume is 2400 m³ and flow is 8000 m³/d. Detention time is:',o:['0.3 hr','3 hr','7.2 hr','24 hr'],a:2,e:'t=V/Q=.3 d=.3(24)=7.2 hr.',trap:'V/Q gives days here because Q is per day.'},\n{topic:'K',sub:'Disinfection CT',q:'A disinfectant residual is 1.5 mg/L for 40 min. CT=',o:['26.7 mg·min/L','40 mg·min/L','60 mg·min/L','600 mg·min/L'],a:2,e:'CT=Ct=1.5(40)=60 mg·min/L.',trap:'CT is a product, not a ratio.'},\n{topic:'K',sub:'Stokes Settling',q:'Under Stokes-law conditions, if particle diameter doubles, settling velocity changes by a factor of:',o:['2','4','8','1/2'],a:1,e:'vs∝d², so doubling d gives four times the settling velocity.',trap:'The diameter dependence is squared.'}\n];\nconst questions=[{\"n\":1,\"topic\":\"A\",\"q\":\"A parking-lot retrofit replaces 6 ac of grass (C=0.25) with pavement (C=0.90). The remaining 14 ac stays grass. For i=2.2 in/hr, what peak-flow increase should the engineer expect?\",\"options\":[\"17.2 cfs\",\"8.58 cfs\",\"25.7 cfs\",\"3.90 cfs\"],\"answer\":1,\"explanation\":\"Only the changed 6 ac causes the increase: ΔQ=(0.90−0.25)(2.2)(6)=8.58 cfs. 🇵🇭 Hindi kailangang i-recompute lahat; hanapin ang epekto ng land-use change.\",\"difficulty\":\"Hard\"},{\"n\":2,\"topic\":\"A\",\"q\":\"An engineer used the arithmetic average of C=0.90 for 2 ac pavement and C=0.30 for 8 ac lawn. What is the main problem with the calculation?\",\"options\":[\"Rainfall intensity should be averaged instead\",\"C must be weighted by drainage area\",\"C must always equal 1.0\",\"The Rational Method cannot use mixed land cover\"],\"answer\":1,\"explanation\":\"Composite C is area-weighted. Here C=(.9×2+.3×8)/10=.42, not .60. 🇵🇭 Kapag hindi pantay ang area, bawal simpleng average.\",\"difficulty\":\"Medium\"},{\"n\":3,\"topic\":\"A\",\"q\":\"A 15-ac watershed produces 27 cfs during a storm with i=3.0 in/hr. If the Rational Method is appropriate, what runoff coefficient is implied?\",\"options\":[\"0.20\",\"0.40\",\"0.60\",\"0.90\"],\"answer\":2,\"explanation\":\"Back-solve C=Q/(iA)=27/(3×15)=0.60. 🇵🇭 Reverse problem ito—hindi laging Q ang unknown.\",\"difficulty\":\"Medium\"},{\"n\":4,\"topic\":\"A\",\"q\":\"Two design storms have the same total rainfall depth. Storm X is short and intense; Storm Y is long and gentle. For a small watershed designed by the Rational Method, which is more likely to control peak discharge?\",\"options\":[\"Storm X\",\"Storm Y\",\"They must give the same peak\",\"Total depth alone decides\"],\"answer\":0,\"explanation\":\"Rational peak flow depends on rainfall intensity corresponding to tc, not merely total depth. 🇵🇭 Peak ang concern, kaya intensity ang mahalaga.\",\"difficulty\":\"Medium\"},{\"n\":5,\"topic\":\"A\",\"q\":\"A watershed has CN=70. A 0.60-in shower occurs. Will the standard SCS runoff equation predict direct runoff?\",\"options\":[\"Yes, because any rainfall creates runoff\",\"No; initial abstraction has not been exceeded\",\"Yes, but only 0.12 in\",\"Cannot decide without area\"],\"answer\":1,\"explanation\":\"S=1000/70−10=4.286 in; 0.2S=.857 in. Since P=.60<.857, Q=0. 🇵🇭 Tingnan muna ang threshold bago mag-substitute.\",\"difficulty\":\"Medium\"},{\"n\":6,\"topic\":\"A\",\"q\":\"Development shortens time of concentration while the IDF curve is otherwise unchanged. What is the usual effect on the Rational Method design intensity and peak flow?\",\"options\":[\"Both usually decrease\",\"Intensity usually increases, tending to raise peak flow\",\"Intensity is independent of tc\",\"Peak flow must become zero\"],\"answer\":1,\"explanation\":\"Shorter tc generally corresponds to a higher IDF intensity; urbanization also often raises C. 🇵🇭 Mas mabilis makarating ang runoff → mas mataas ang possible peak.\",\"difficulty\":\"Medium\"},{\"n\":7,\"topic\":\"A\",\"q\":\"A unit hydrograph for 1 in of direct runoff has a 420-cfs peak. If watershed response remains linear, what peak corresponds to 2.5 in of direct runoff?\",\"options\":[\"168 cfs\",\"420 cfs\",\"1,050 cfs\",\"2,500 cfs\"],\"answer\":2,\"explanation\":\"Unit-hydrograph ordinates scale linearly with runoff depth: 420×2.5=1050 cfs. 🇵🇭 I-scale ang hydrograph; huwag gumawa ng bagong shape.\",\"difficulty\":\"Medium\"},{\"n\":8,\"topic\":\"B\",\"q\":\"Water leaves a spillway as a shallow, fast stream 1.0 m deep with upstream Froude number 3.0. A hydraulic jump forms in a rectangular stilling basin. Approximately what downstream conjugate depth should the basin accommodate?\",\"options\":[\"1.0 m\",\"2.0 m\",\"3.77 m\",\"9.0 m\"],\"answer\":2,\"difficulty\":\"Hard\",\"explanation\":\"Use y₂=(y₁/2)[√(1+8Fr₁²)−1]=0.5[√73−1]≈3.77 m. 🇵🇭 Hydraulic jump clue: supercritical upstream + abrupt depth increase; Fr₁ muna bago y₂.\"},{\"n\":9,\"topic\":\"A\",\"q\":\"A triangular direct-runoff hydrograph has the same runoff volume after development, but its time to peak becomes smaller. What must happen to the peak if the triangular approximation remains valid?\",\"options\":[\"Peak decreases\",\"Peak increases\",\"Peak is unchanged\",\"Peak becomes negative\"],\"answer\":1,\"explanation\":\"For the same hydrograph volume, a narrower time base requires a higher peak. 🇵🇭 Same volume pero mas maiksi ang response → mas matarik at mas mataas ang peak.\",\"difficulty\":\"Medium\"},{\"n\":10,\"topic\":\"B\",\"q\":\"A rectangular channel is 4 m wide with 1 m flow depth. A student uses P=4+1+1+4=10 m to compute hydraulic radius. Which term is wrong?\",\"options\":[\"Bottom width\",\"Both side depths\",\"The 4-m free surface\",\"None\"],\"answer\":2,\"explanation\":\"Wetted perimeter excludes the free water surface. Correct P=4+1+1=6 m. 🇵🇭 Tubig-air boundary ay hindi wetted perimeter.\",\"difficulty\":\"Medium\"},{\"n\":11,\"topic\":\"B\",\"q\":\"A channel carries the same discharge after its lining is changed from rough earth to smooth concrete. Geometry and slope are unchanged. What happens according to Manning?\",\"options\":[\"Velocity capacity increases\",\"Velocity capacity decreases\",\"n increases\",\"Hydraulic radius becomes zero\"],\"answer\":0,\"explanation\":\"Smoother lining means lower Manning n, which increases velocity/capacity. 🇵🇭 Sa Manning, mas maliit n = mas kaunting resistance.\",\"difficulty\":\"Medium\"},{\"n\":12,\"topic\":\"B\",\"q\":\"A wide channel has V=5 m/s and depth 0.40 m. Before calculating, which flow regime should you expect qualitatively?\",\"options\":[\"Likely supercritical\",\"Likely subcritical\",\"Pressurized\",\"Impossible for open-channel flow\"],\"answer\":0,\"explanation\":\"Fast, shallow flow tends to have Fr>1. Numerically Fr≈5/√(9.81×.4)=2.52. 🇵🇭 Mabilis + mababaw = clue sa supercritical.\",\"difficulty\":\"Medium\"},{\"n\":13,\"topic\":\"B\",\"q\":\"A hydraulic jump forms downstream of a spillway. Which design benefit is most directly associated with the jump?\",\"options\":[\"Pressure generation\",\"Energy dissipation\",\"Increasing upstream pump efficiency\",\"Reducing wetted perimeter to zero\"],\"answer\":1,\"explanation\":\"A hydraulic jump converts supercritical to subcritical flow while dissipating energy. 🇵🇭 Ginagamit ito para bawasan ang destructive kinetic energy.\",\"difficulty\":\"Medium\"},{\"n\":14,\"topic\":\"B\",\"q\":\"A rectangular channel carries 9 m³/s and is 3 m wide. Which value should enter the rectangular critical-depth equation as q?\",\"options\":[\"9 m³/s\",\"3 m²/s\",\"27 m⁴/s\",\"1 m/s\"],\"answer\":1,\"explanation\":\"q=Q/b=9/3=3 m²/s. 🇵🇭 Sa critical-depth formula, unit discharge per width ang kailangan.\",\"difficulty\":\"Medium\"},{\"n\":15,\"topic\":\"B\",\"q\":\"At one section of an open channel, y=1.2 m and V=3 m/s. If velocity doubles while depth stays fixed, what happens to the velocity-head portion of specific energy?\",\"options\":[\"Doubles\",\"Quadruples\",\"Halves\",\"Unchanged\"],\"answer\":1,\"explanation\":\"Velocity head is V²/(2g), so doubling V multiplies it by 4. 🇵🇭 Square ang velocity sa energy term.\",\"difficulty\":\"Medium\"},{\"n\":16,\"topic\":\"B\",\"q\":\"A rectangular channel has two possible depths for the same discharge and the same specific energy, one shallow and one deep. What are these two depths called?\",\"options\":[\"Normal and critical depths\",\"Alternate depths\",\"Conjugate pipe diameters\",\"Pressure heads\"],\"answer\":1,\"difficulty\":\"Medium\",\"explanation\":\"They are alternate depths; critical depth occurs at minimum specific energy. 🇵🇭 Sa specific-energy diagram, puwedeng same E ang shallow-supercritical at deep-subcritical depth.\"},{\"n\":17,\"topic\":\"B\",\"q\":\"A channel transitions from Fr=0.65 upstream to Fr=1.00 at a control section. What special condition occurs at the control?\",\"options\":[\"Maximum specific energy\",\"Critical flow and minimum specific energy\",\"Zero discharge\",\"Pressurized flow\"],\"answer\":1,\"explanation\":\"Fr=1 defines critical flow; for a given discharge this corresponds to minimum specific energy. 🇵🇭 Fr=1 ang boundary ng subcritical at supercritical.\",\"difficulty\":\"Medium\"},{\"n\":18,\"topic\":\"B\",\"q\":\"A full 24-in pipe is treated with an open-channel Manning relation. What hydraulic radius should be used?\",\"options\":[\"24 in\",\"12 in\",\"6 in\",\"3 in\"],\"answer\":2,\"explanation\":\"For a full circular section R=D/4=24/4=6 in. 🇵🇭 Hydraulic radius ≠ geometric radius.\",\"difficulty\":\"Medium\"},{\"n\":19,\"topic\":\"C\",\"q\":\"A pump supplies 15 kW of useful water power at 75% efficiency. Approximately how much shaft/input power is required?\",\"options\":[\"11.25 kW\",\"15 kW\",\"20 kW\",\"60 kW\"],\"answer\":2,\"explanation\":\"Input=water power/η=15/.75=20 kW. 🇵🇭 Divide by efficiency dahil mas malaki ang input kaysa useful output.\",\"difficulty\":\"Medium\"},{\"n\":20,\"topic\":\"C\",\"q\":\"A pump curve and system curve do not intersect within the pump’s allowable operating range. What is the best conclusion?\",\"options\":[\"The selected pump/system combination cannot provide a valid normal operating point\",\"NPSH is automatically adequate\",\"Flow must be zero by definition\",\"Put all pumps in series\"],\"answer\":0,\"explanation\":\"Normal operation occurs where pump head equals system head. 🇵🇭 Kung walang valid intersection, mali ang selection o system condition.\",\"difficulty\":\"Medium\"},{\"n\":21,\"topic\":\"C\",\"q\":\"A system has large static head and relatively little friction. If flow is doubled, which part of system head remains essentially unchanged?\",\"options\":[\"Friction head\",\"Static head\",\"Velocity in the pipe\",\"Minor-loss coefficient contribution\"],\"answer\":1,\"explanation\":\"Static head is elevation/pressure difference and does not depend on Q; friction commonly varies about Q². 🇵🇭 Static = fixed elevation requirement.\",\"difficulty\":\"Medium\"},{\"n\":22,\"topic\":\"C\",\"q\":\"A suction line is lengthened and several fittings are added while everything else stays the same. What happens to NPSHA?\",\"options\":[\"Increases\",\"Decreases\",\"Becomes equal to efficiency\",\"Is unaffected by suction loss\"],\"answer\":1,\"explanation\":\"Additional suction-side head loss reduces NPSHA. 🇵🇭 Mas maraming loss bago pump → mas mataas cavitation risk.\",\"difficulty\":\"Medium\"},{\"n\":23,\"topic\":\"C\",\"q\":\"Two identical pumps are arranged in series because the system requires much greater elevation head. Why is series preferred over parallel here?\",\"options\":[\"Series adds head at a given flow\",\"Series eliminates friction\",\"Parallel adds head while series adds flow\",\"Series makes NPSHR zero\"],\"answer\":0,\"explanation\":\"Series pump heads add. Parallel arrangement primarily increases flow capacity. 🇵🇭 Series=head; parallel=flow.\",\"difficulty\":\"Medium\"},{\"n\":24,\"topic\":\"C\",\"q\":\"A variable-speed pump is slowed to 80% of its original speed. Approximately what fraction of the original head is available?\",\"options\":[\"0.80\",\"0.64\",\"0.512\",\"1.25\"],\"answer\":1,\"explanation\":\"Affinity law h2/h1=(N2/N1)²=.8²=.64. 🇵🇭 Head follows speed squared.\",\"difficulty\":\"Medium\"},{\"n\":25,\"topic\":\"B\",\"q\":\"A field crew must measure relatively small open-channel flows accurately. Which sharp-crested device is generally more sensitive to small changes in head at low flow?\",\"options\":[\"90° V-notch weir\",\"Very wide rectangular weir\",\"Full circular pipe\",\"Hydraulic jump\"],\"answer\":0,\"difficulty\":\"Medium\",\"explanation\":\"A V-notch is useful for low-flow measurement; Q varies with H^(5/2). 🇵🇭 Low-flow measurement is a strong V-notch clue.\"},{\"n\":26,\"topic\":\"C\",\"q\":\"A pump is cavitating even though discharge is correct. Which change would most directly improve suction conditions?\",\"options\":[\"Increase suction-line losses\",\"Lower available suction head\",\"Reduce suction losses or raise liquid level\",\"Increase vapor pressure\"],\"answer\":2,\"explanation\":\"Increasing NPSHA by reducing suction loss or increasing suction head helps prevent cavitation. 🇵🇭 Ayusin ang suction side, hindi lang ang discharge.\",\"difficulty\":\"Medium\"},{\"n\":27,\"topic\":\"C\",\"q\":\"A pump lifts water at 0.04 m³/s through 25 m. A colleague calculates 9.81 kW and calls it motor input power. What did the colleague omit if efficiency is 70%?\",\"options\":[\"Gravity\",\"Flow rate\",\"Division by pump efficiency\",\"Head\"],\"answer\":2,\"explanation\":\"9.81 kW is water power. Input=9.81/.70≈14.0 kW. 🇵🇭 Water power muna iyon; motor/input needs efficiency correction.\",\"difficulty\":\"Hard\"},{\"n\":28,\"topic\":\"D\",\"q\":\"Two equal-length water mains carry the same flow. Pipe 1 has C=90 and Pipe 2 has C=140. Which one has the larger Hazen-Williams head loss?\",\"options\":[\"Pipe 1\",\"Pipe 2\",\"Equal\",\"Cannot compare without elevation\"],\"answer\":0,\"explanation\":\"Lower Hazen-Williams C means rougher pipe and greater head loss. 🇵🇭 Opposite ito ng Manning n trend.\",\"difficulty\":\"Medium\"},{\"n\":29,\"topic\":\"D\",\"q\":\"A junction receives 8 cfs from one pipe and 5 cfs from another. One outgoing pipe carries 9 cfs. What must the second outgoing pipe carry?\",\"options\":[\"4 cfs\",\"13 cfs\",\"22 cfs\",\"1 cfs\"],\"answer\":0,\"explanation\":\"Continuity: total in=13 cfs, so remaining out=13−9=4 cfs. 🇵🇭 Node balance muna bago loop balance.\",\"difficulty\":\"Medium\"},{\"n\":30,\"topic\":\"D\",\"q\":\"Two parallel branches connect the same reservoirs. Branch A has much greater resistance than Branch B. Which statement is most reasonable?\",\"options\":[\"A carries more flow because its head loss is larger\",\"Both have the same head loss, but B carries more flow\",\"Both must carry equal flow\",\"A has zero head loss\"],\"answer\":1,\"explanation\":\"Parallel branches share the same endpoint head difference; the lower-resistance branch carries more flow. 🇵🇭 Equal head loss does not mean equal Q.\",\"difficulty\":\"Medium\"},{\"n\":31,\"topic\":\"D\",\"q\":\"A pressure gauge reads 65 psi at a hydrant. Approximately what pressure head is this?\",\"options\":[\"28.1 ft\",\"65 ft\",\"150 ft\",\"300 ft\"],\"answer\":2,\"explanation\":\"h≈2.31×65=150.15 ft of water. 🇵🇭 psi to feet of water: multiply by about 2.31.\",\"difficulty\":\"Medium\"},{\"n\":32,\"topic\":\"D\",\"q\":\"A tank must reserve water for 1,800 gpm fire flow for 2.5 hr. Which storage volume is required for the fire-flow portion alone?\",\"options\":[\"108,000 gal\",\"270,000 gal\",\"4,500 gal\",\"540,000 gal\"],\"answer\":1,\"explanation\":\"2.5 hr=150 min; V=1800×150=270,000 gal. 🇵🇭 Rate × duration; match the time unit to gpm.\",\"difficulty\":\"Medium\"},{\"n\":33,\"topic\":\"D\",\"q\":\"A distribution model satisfies continuity at every node but the sum of head losses around a closed loop is not zero. What remains unsatisfied?\",\"options\":[\"Mass conservation\",\"Energy balance\",\"Water density\",\"Fire duration\"],\"answer\":1,\"explanation\":\"Loop energy balance requires ΣhL=0 around a closed loop. 🇵🇭 Hardy Cross needs both node continuity and loop head balance.\",\"difficulty\":\"Medium\"},{\"n\":34,\"topic\":\"D\",\"q\":\"An old cast-iron main becomes rougher with age. In a Hazen-Williams model, which parameter change represents this deterioration?\",\"options\":[\"Increase C\",\"Decrease C\",\"Increase Fr\",\"Decrease Manning n\"],\"answer\":1,\"explanation\":\"Roughening is represented by a lower Hazen-Williams C. 🇵🇭 Mas luma/rough → lower C → higher loss.\",\"difficulty\":\"Medium\"},{\"n\":35,\"topic\":\"B\",\"q\":\"Head over a 90° V-notch doubles while the coefficient is unchanged. Approximately how many times larger is discharge?\",\"options\":[\"2.0×\",\"2.83×\",\"4.0×\",\"5.66×\"],\"answer\":3,\"difficulty\":\"Hard\",\"explanation\":\"Q∝H^(5/2), so 2^(5/2)=5.66. 🇵🇭 Mas sensitive sa head kaysa rectangular weir H^(3/2).\"},{\"n\":36,\"topic\":\"D\",\"q\":\"A designer doubles pipe diameter while keeping length, material, and flow the same. Based on the Hazen-Williams head-loss form, what qualitative change is expected?\",\"options\":[\"A strong decrease in head loss\",\"A strong increase in head loss\",\"No change\",\"Head loss becomes negative\"],\"answer\":0,\"explanation\":\"Diameter appears with a large exponent in the denominator, so larger D greatly reduces loss. 🇵🇭 Diameter is a very powerful lever in pipe head loss.\",\"difficulty\":\"Medium\"},{\"n\":37,\"topic\":\"E\",\"q\":\"A homeowner says, “We had a 100-year flood last year, so another cannot happen for 99 years.” Which response is correct?\",\"options\":[\"Correct\",\"Incorrect; the event has about 1% exceedance probability each year\",\"Correct only for levees\",\"Incorrect because it means 100% annual chance\"],\"answer\":1,\"explanation\":\"Return period is a probability concept, not a fixed schedule. 🇵🇭 Puwedeng mangyari ulit kahit next year.\",\"difficulty\":\"Medium\"},{\"n\":38,\"topic\":\"E\",\"q\":\"A bridge has a 50-year design flood. What is the annual exceedance probability?\",\"options\":[\"50%\",\"5%\",\"2%\",\"0.5%\"],\"answer\":2,\"explanation\":\"p=1/T=1/50=.02=2%. 🇵🇭 Invert the return period.\",\"difficulty\":\"Medium\"},{\"n\":39,\"topic\":\"E\",\"q\":\"A 30-year project is protected to the 100-year event. Which is closest to the probability of at least one exceedance during the project life?\",\"options\":[\"1%\",\"10%\",\"26%\",\"30%\"],\"answer\":2,\"explanation\":\"R=1−(1−.01)^30≈26%. 🇵🇭 Project-life risk is much larger than the one-year 1%.\",\"difficulty\":\"Hard\"},{\"n\":40,\"topic\":\"E\",\"q\":\"During a routing interval, average inflow is 70 cfs and average outflow is 50 cfs for 12 minutes. How much does storage increase?\",\"options\":[\"240 ft³\",\"1,200 ft³\",\"14,400 ft³\",\"50,400 ft³\"],\"answer\":2,\"explanation\":\"ΔS=(70−50)(12×60)=14,400 ft³. 🇵🇭 cfs requires seconds.\",\"difficulty\":\"Medium\"},{\"n\":41,\"topic\":\"E\",\"q\":\"A detention basin’s inflow hydrograph peaks at 120 cfs and outflow peaks at 75 cfs. What peak attenuation fraction is achieved?\",\"options\":[\"37.5%\",\"45%\",\"62.5%\",\"160%\"],\"answer\":0,\"explanation\":\"(120−75)/120=.375=37.5%. 🇵🇭 Reduction divided by original inflow peak.\",\"difficulty\":\"Medium\"},{\"n\":42,\"topic\":\"E\",\"q\":\"A flood-control alternative proposes a levee instead of a detention basin. What major hydrologic difference should the reviewer recognize?\",\"options\":[\"A levee primarily confines/conveys flow; detention temporarily stores it\",\"A levee removes BOD\",\"Detention cannot affect peak flow\",\"They are hydraulically identical\"],\"answer\":0,\"explanation\":\"Levees mainly contain/convey floodwater; detention stores and attenuates. 🇵🇭 Conveyance vs storage ang key distinction.\",\"difficulty\":\"Medium\"},{\"n\":43,\"topic\":\"E\",\"q\":\"Head over a spillway rises from 1 ft to 3 ft. If Q∝H^(3/2), by what factor does discharge change?\",\"options\":[\"3\",\"5.20\",\"9\",\"1.73\"],\"answer\":1,\"explanation\":\"Factor=(3/1)^(3/2)=3√3≈5.20. 🇵🇭 Nonlinear ang weir/spillway response.\",\"difficulty\":\"Medium\"},{\"n\":44,\"topic\":\"E\",\"q\":\"In a 39-year annual-maximum flood record, the second-largest event is ranked m=2. What Weibull return period is assigned?\",\"options\":[\"19.5 yr\",\"20 yr\",\"39 yr\",\"80 yr\"],\"answer\":1,\"explanation\":\"T=(n+1)/m=(39+1)/2=20 yr. 🇵🇭 Rank matters; largest is m=1.\",\"difficulty\":\"Medium\"},{\"n\":45,\"topic\":\"D\",\"q\":\"A water-main reviewer sees pipe diameter reduced by 20% while flow, length, and Hazen-Williams C remain unchanged. What should be expected of friction head loss?\",\"options\":[\"A substantial increase\",\"A 20% decrease\",\"Essentially no change\",\"It becomes independent of flow\"],\"answer\":0,\"difficulty\":\"Medium\",\"explanation\":\"Hazen-Williams head loss varies approximately as 1/D^4.87. 🇵🇭 Small diameter reduction can cause a large head-loss increase.\"},{\"n\":46,\"topic\":\"F\",\"q\":\"A storm sewer is flowing full. A designer mistakenly uses R=D/2 in Manning instead of D/4. What is the likely effect?\",\"options\":[\"Capacity is overestimated\",\"Capacity is underestimated\",\"No effect\",\"Slope becomes negative\"],\"answer\":0,\"explanation\":\"Using too large an R increases computed Manning velocity/capacity. 🇵🇭 Geometric radius is not hydraulic radius.\",\"difficulty\":\"Medium\"},{\"n\":47,\"topic\":\"F\",\"q\":\"A site’s imperviousness rises from 30% to 70%. Using Rv=0.05+0.009I, how does Rv change?\",\"options\":[\"0.32 to 0.68\",\"0.27 to 0.63\",\"0.30 to 0.70\",\"0.05 to 0.09\"],\"answer\":0,\"explanation\":\"Rv at 30%=.05+.27=.32; at 70%=.05+.63=.68. 🇵🇭 I is entered as percent, not decimal.\",\"difficulty\":\"Medium\"},{\"n\":48,\"topic\":\"F\",\"q\":\"A 12-ac site has Rv=0.60 and a 1-in water-quality rainfall depth. What WQv is required?\",\"options\":[\"0.60 ac-ft\",\"1.00 ac-ft\",\"0.30 ac-ft\",\"7.20 ac-ft\"],\"answer\":0,\"explanation\":\"WQv=(P/12)RvA=(1/12)(.60)(12)=.60 ac-ft. 🇵🇭 Convert rainfall inches to feet through /12.\",\"difficulty\":\"Medium\"},{\"n\":49,\"topic\":\"F\",\"q\":\"A basin receives 18 cfs while its outlet allows 8 cfs for 15 minutes. Using a rectangular excess-flow estimate, what storage is needed?\",\"options\":[\"9,000 ft³\",\"2,700 ft³\",\"15,000 ft³\",\"900 ft³\"],\"answer\":0,\"explanation\":\"Excess=10 cfs; t=900 s; storage=9000 ft³. 🇵🇭 Q difference × seconds.\",\"difficulty\":\"Medium\"},{\"n\":50,\"topic\":\"F\",\"q\":\"A developer says meeting the post-development peak-flow limit automatically satisfies stormwater quality requirements. What is the best review comment?\",\"options\":[\"Correct in every case\",\"Peak control and water-quality volume are separate criteria\",\"Water quality only applies to sanitary sewers\",\"Peak flow is unrelated to imperviousness\"],\"answer\":1,\"explanation\":\"The chapter treats peak-flow control and WQv/BMP treatment separately. 🇵🇭 Puwedeng pasado sa peak pero kulang sa first-flush treatment.\",\"difficulty\":\"Medium\"},{\"n\":51,\"topic\":\"F\",\"q\":\"A gutter design increases spread T while slope and roughness remain unchanged. In the listed gutter equation, what happens to capacity?\",\"options\":[\"Capacity rises strongly because Q∝T^(8/3)\",\"Capacity falls linearly\",\"Capacity is unchanged\",\"Capacity becomes independent of geometry\"],\"answer\":0,\"explanation\":\"The gutter equation has a strong T^(8/3) dependence. 🇵🇭 Malaking effect ang spread sa gutter capacity.\",\"difficulty\":\"Medium\"},{\"n\":52,\"topic\":\"F\",\"q\":\"A small commercial site has a known C and drainage area. The engineer must select rainfall intensity from an IDF curve. Which duration is the key starting point?\",\"options\":[\"Time of concentration\",\"Fire-flow duration\",\"Pump operating time\",\"BOD incubation time\"],\"answer\":0,\"explanation\":\"For Rational Method design, intensity is associated with the watershed tc. 🇵🇭 IDF intensity should match the response time.\",\"difficulty\":\"Medium\"},{\"n\":53,\"topic\":\"F\",\"q\":\"A storm sewer velocity is only 0.7 ft/s under a frequent-flow condition. What operational concern is most relevant?\",\"options\":[\"Sediment deposition due to poor self-cleansing\",\"Cavitation\",\"Excessive Froude number in a pump\",\"Aquifer drawdown\"],\"answer\":0,\"explanation\":\"Very low sewer velocity can allow solids/sediment to settle. The review notes about 2 ft/s as a self-cleansing target. 🇵🇭 Masyadong mabagal → deposition.\",\"difficulty\":\"Medium\"},{\"n\":54,\"topic\":\"
