F\",\"q\":\"Which measure most directly targets first-flush pollutant treatment rather than only peak conveyance?\",\"options\":[\"Bioretention/water-quality BMP\",\"Larger fire-storage tank\",\"Pump in series\",\"Higher Hazen-Williams C\"],\"answer\":0,\"explanation\":\"Bioretention and similar BMPs address stormwater quality. 🇵🇭 Hindi lahat ng stormwater solution ay pipe sizing lang.\",\"difficulty\":\"Medium\"},{\"n\":55,\"topic\":\"D\",\"q\":\"During a hydrant flow test, measured discharge is high but residual pressure falls well below the standard rating pressure. Why can rated hydrant capacity differ from measured flow?\",\"options\":[\"Rated capacity corrects test flow to a specified residual pressure\",\"Hydrant capacity ignores pressure\",\"Measured flow must always equal rated flow\",\"Only pipe length matters\"],\"answer\":0,\"difficulty\":\"Medium\",\"explanation\":\"Hydrant rating corrects field flow using test and rating residual heads, commonly to 20 psi. 🇵🇭 May pressure correction bago tawaging rated capacity.\"},{\"n\":56,\"topic\":\"G\",\"q\":\"A city reports high wet-weather flow in a sanitary sewer even though customer wastewater use is unchanged. Which cause best matches the symptom?\",\"options\":[\"Inflow and infiltration\",\"Lower BOD\",\"Pump affinity\",\"Lower CN\"],\"answer\":0,\"explanation\":\"Rain/groundwater entering the sanitary system is I/I. 🇵🇭 Wet weather spike is a classic clue.\",\"difficulty\":\"Medium\"},{\"n\":57,\"topic\":\"G\",\"q\":\"A full circular gravity sewer and the same sewer flowing exactly half-full have the same slope and n. How do their velocities compare under the review relation?\",\"options\":[\"Half-full velocity is half\",\"Velocities are equal\",\"Half-full velocity doubles\",\"Both are zero\"],\"answer\":1,\"explanation\":\"At half-full and full, R=D/4, so Manning velocity is the same; discharge differs because area differs. 🇵🇭 Same R → same V.\",\"difficulty\":\"Medium\"},{\"n\":58,\"topic\":\"G\",\"q\":\"A sewer must drop 2.4 ft between manholes 600 ft apart. What slope should be shown on the profile?\",\"options\":[\"0.0004\",\"0.004\",\"0.04\",\"0.25\"],\"answer\":1,\"explanation\":\"S=Δz/L=2.4/600=.004. 🇵🇭 Reverse ng invert-drop problem.\",\"difficulty\":\"Medium\"},{\"n\":59,\"topic\":\"G\",\"q\":\"A gravity sewer is too flat to maintain the target self-cleansing velocity. Which design change most directly helps, all else equal?\",\"options\":[\"Increase slope\",\"Increase Manning n\",\"Reduce hydraulic radius to zero\",\"Add I/I\"],\"answer\":0,\"explanation\":\"Manning velocity increases with S^(1/2). 🇵🇭 Mas matarik na slope → mas mataas velocity.\",\"difficulty\":\"Medium\"},{\"n\":60,\"topic\":\"G\",\"q\":\"Why are manholes commonly placed where sewer direction, slope, or diameter changes?\",\"options\":[\"They provide access and define hydraulic/profile transition points\",\"They eliminate all head loss\",\"They convert sanitary flow to stormwater\",\"They set CN\"],\"answer\":0,\"explanation\":\"Manholes provide maintenance access and practical transition/control locations. 🇵🇭 Important sila sa changes at inspection.\",\"difficulty\":\"Medium\"},{\"n\":61,\"topic\":\"G\",\"q\":\"Population rises, causing the Harmon peak factor itself to decrease slightly, while average sanitary flow rises substantially. What can still happen to peak design flow?\",\"options\":[\"It can increase because Qpeak=PF×Qavg\",\"It must decrease\",\"It must remain constant\",\"It becomes independent of population\"],\"answer\":0,\"explanation\":\"A smaller multiplier can still produce a larger peak when average flow grows. 🇵🇭 Tingnan ang product, hindi PF lang.\",\"difficulty\":\"Medium\"},{\"n\":62,\"topic\":\"G\",\"q\":\"A combined sewer is repeatedly overflowing during storms. Which long-term concept most directly reduces stormwater loading on the sanitary treatment system?\",\"options\":[\"Separate storm and sanitary collection\",\"Increase I/I\",\"Lower self-cleansing velocity\",\"Use a higher BOD bottle fraction\"],\"answer\":0,\"explanation\":\"Separate systems prevent storm peaks from being routed through sanitary treatment capacity. 🇵🇭 Separation reduces CSO/plant overload risk.\",\"difficulty\":\"Medium\"},{\"n\":63,\"topic\":\"G\",\"q\":\"For a full 18-in gravity sewer, what hydraulic radius is used in Manning?\",\"options\":[\"9 in\",\"4.5 in\",\"18 in\",\"2.25 in\"],\"answer\":1,\"explanation\":\"R=D/4=18/4=4.5 in. 🇵🇭 Again, hydraulic radius is A/P, not D/2.\",\"difficulty\":\"Medium\"},{\"n\":64,\"topic\":\"H\",\"q\":\"Two monitoring wells 200 m apart differ in hydraulic head by 4 m. What hydraulic gradient magnitude should be used for Darcy flow?\",\"options\":[\"0.002\",\"0.02\",\"0.20\",\"50\"],\"answer\":1,\"explanation\":\"i=Δh/L=4/200=.02. 🇵🇭 Head drop divided by flow length.\",\"difficulty\":\"Medium\"},{\"n\":65,\"topic\":\"D\",\"q\":\"A sprinkler discharges 22 gpm at 16 psi. If the same sprinkler operates at 36 psi, approximately what flow should be expected?\",\"options\":[\"33 gpm\",\"49.5 gpm\",\"22 gpm\",\"14.7 gpm\"],\"answer\":0,\"difficulty\":\"Hard\",\"explanation\":\"Q₂/Q₁=√(36/16)=1.5, so Q₂=33 gpm. 🇵🇭 Q=K√P, kaya hindi linear ang pressure-to-flow relationship.\"},{\"n\":66,\"topic\":\"H\",\"q\":\"Darcy specific discharge is 6×10⁻⁶ m/s through soil with porosity 0.30. What is the approximate pore-water seepage velocity?\",\"options\":[\"1.8×10⁻⁶\",\"6×10⁻⁶\",\"2×10⁻⁵\",\"5×10⁻⁵\"],\"answer\":2,\"explanation\":\"vs=v/n=6e−6/.30=2e−5 m/s. 🇵🇭 Actual pore speed is faster because water only moves through voids.\",\"difficulty\":\"Medium\"},{\"n\":67,\"topic\":\"H\",\"q\":\"Two aquifers have the same K, but Aquifer B is twice as thick. How does transmissivity compare?\",\"options\":[\"B has half the T\",\"B has twice the T\",\"T is unchanged\",\"T becomes dimensionless\"],\"answer\":1,\"explanation\":\"T=Kb, so doubling saturated thickness doubles transmissivity. 🇵🇭 T combines conductivity and thickness.\",\"difficulty\":\"Medium\"},{\"n\":68,\"topic\":\"H\",\"q\":\"A well problem explicitly gives h1² and h2² terms in the governing relation. What aquifer type is being indicated?\",\"options\":[\"Confined\",\"Unconfined\",\"Pressurized pipe\",\"Storm sewer\"],\"answer\":1,\"explanation\":\"The unconfined Thiem relation uses squared heads. 🇵🇭 Squared-head difference is the clue.\",\"difficulty\":\"Medium\"},{\"n\":69,\"topic\":\"H\",\"q\":\"An unconfined aquifer has Sy=0.18 over 20,000 m². The water table falls 0.5 m. Estimate water released from storage.\",\"options\":[\"1,800 m³\",\"10,000 m³\",\"3,600 m³\",\"180 m³\"],\"answer\":0,\"explanation\":\"V=SyAΔh=.18(20000)(.5)=1800 m³. 🇵🇭 Specific yield ang gamit sa drained unconfined storage.\",\"difficulty\":\"Medium\"},{\"n\":70,\"topic\":\"H\",\"q\":\"A confined-aquifer storage problem provides storage coefficient S rather than specific yield Sy. Which relation matches the chapter review?\",\"options\":[\"V=SAΔh\",\"V=SyAΔh only\",\"V=CiA\",\"V=Q/Lweir\"],\"answer\":0,\"explanation\":\"Confined storage uses V=S A Δh. 🇵🇭 Huwag pagpalitin ang S at Sy.\",\"difficulty\":\"Medium\"},{\"n\":71,\"topic\":\"H\",\"q\":\"If hydraulic gradient reverses direction while K and area stay unchanged, what happens to Darcy flow?\",\"options\":[\"Magnitude is unchanged but direction reverses\",\"Flow becomes infinite\",\"K changes sign\",\"Porosity becomes zero\"],\"answer\":0,\"explanation\":\"Darcy flow follows the hydraulic gradient; reversing gradient reverses flow direction. 🇵🇭 Flow goes from higher hydraulic head toward lower head.\",\"difficulty\":\"Medium\"},{\"n\":72,\"topic\":\"H\",\"q\":\"A colleague reports transmissivity in m/s. What is wrong?\",\"options\":[\"Nothing\",\"Transmissivity should have units of area/time such as m²/s\",\"It should be dimensionless\",\"It should be pressure\"],\"answer\":1,\"explanation\":\"T=Kb, so (m/s)(m)=m²/s. 🇵🇭 Unit check can reveal a wrong formula or missing thickness.\",\"difficulty\":\"Medium\"},{\"n\":73,\"topic\":\"I\",\"q\":\"A stream at 2 m³/s and 3 mg/L mixes with an effluent at 0.5 m³/s and 18 mg/L. What is the completely mixed concentration?\",\"options\":[\"10.5 mg/L\",\"6.0 mg/L\",\"4.5 mg/L\",\"21 mg/L\"],\"answer\":1,\"explanation\":\"C=(2×3+.5×18)/(2.5)=15/2.5=6 mg/L. 🇵🇭 Flow-weighted mass balance, not simple average.\",\"difficulty\":\"Medium\"},{\"n\":74,\"topic\":\"I\",\"q\":\"DO saturation is 9.2 mg/L. A downstream measurement is 5.7 mg/L. What is the oxygen deficit?\",\"options\":[\"3.5 mg/L\",\"14.9 mg/L\",\"5.7 mg/L\",\"9.2 mg/L\"],\"answer\":0,\"explanation\":\"D=DOsat−DO=9.2−5.7=3.5 mg/L. 🇵🇭 Larger deficit means lower actual DO.\",\"difficulty\":\"Medium\"},{\"n\":75,\"topic\":\"I\",\"q\":\"At the critical point of an oxygen-sag curve, the DO deficit is at its maximum. What happens to actual DO there?\",\"options\":[\"It is also maximum\",\"It is minimum\",\"It equals BODu\",\"It becomes pH\"],\"answer\":1,\"explanation\":\"DO=DOsat−D, so maximum deficit corresponds to minimum DO. 🇵🇭 Opposite direction ang DO at deficit.\",\"difficulty\":\"Medium\"},{\"n\":76,\"topic\":\"I\",\"q\":\"A sample has BODu=180 mg/L and k=0.20/d. About what fraction of ultimate BOD has been exerted after 5 days?\",\"options\":[\"36.8%\",\"63.2%\",\"100%\",\"20%\"],\"answer\":1,\"explanation\":\"Fraction=1−e^(−kt)=1−e^(−1)=.632. 🇵🇭 BOD5 is only part of ultimate BOD.\",\"difficulty\":\"Medium\"},{\"n\":77,\"topic\":\"I\",\"q\":\"A laboratory reports BOD5 greater than BODu using the same first-order model. What should you conclude?\",\"options\":[\"This is expected\",\"The values/model application should be checked\",\"k must be negative by definition\",\"DO must equal zero\"],\"answer\":1,\"explanation\":\"For positive k and finite time, BODt=BODu(1−e−kt) must be less than BODu. 🇵🇭 BODu is the asymptotic total demand.\",\"difficulty\":\"Medium\"},{\"n\":78,\"topic\":\"I\",\"q\":\"Hydrogen-ion concentration changes from 10⁻⁷ to 10⁻⁵ mol/L. How does pH change?\",\"options\":[\"From 7 to 5\",\"From 5 to 7\",\"From 7 to 12\",\"It does not change\"],\"answer\":0,\"explanation\":\"pH=−log10[H+]. Increasing H+ by 100× lowers pH by 2 units. 🇵🇭 More H+ = more acidic = lower pH.\",\"difficulty\":\"Medium\"},{\"n\":79,\"topic\":\"I\",\"q\":\"An organic wastewater discharge increases biodegradable loading to a stream. Which paired response is most consistent?\",\"options\":[\"BOD decreases and DO decreases\",\"BOD increases and DO tends to decrease\",\"BOD and DO both necessarily increase\",\"pH becomes exactly 7\"],\"answer\":1,\"explanation\":\"More biodegradable organic matter raises oxygen demand, tending to depress DO. 🇵🇭 BOD up → oxygen consumption up → DO down.\",\"difficulty\":\"Medium\"},{\"n\":80,\"topic\":\"I\",\"q\":\"Two equal-flow streams mix. One is 4 mg/L and the other 10 mg/L. Without calculation, what is the mixed concentration?\",\"options\":[\"4 mg/L\",\"7 mg/L\",\"10 mg/L\",\"14 mg/L\"],\"answer\":1,\"explanation\":\"Equal flows make the flow-weighted average equal the arithmetic average: 7 mg/L. 🇵🇭 Simple average works only because equal ang flows.\",\"difficulty\":\"Medium\"},{\"n\":81,\"topic\":\"I\",\"q\":\"In the chapter’s freshwater eutrophication framing, which nutrient is commonly emphasized as limiting?\",\"options\":[\"Phosphorus\",\"Argon\",\"Chloride\",\"Helium\"],\"answer\":0,\"explanation\":\"The review flags phosphorus as a common freshwater limiting nutrient. 🇵🇭 Ito ang high-yield conceptual association sa chapter.\",\"difficulty\":\"Medium\"},{\"n\":82,\"topic\":\"J\",\"q\":\"A 300-mL BOD bottle contains 30 mL wastewater. DO falls from 8.8 to 4.8 mg/L. Ignoring seed correction, what BOD is indicated?\",\"options\":[\"4 mg/L\",\"40 mg/L\",\"13.3 mg/L\",\"120 mg/L\"],\"answer\":1,\"explanation\":\"P=30/300=.10; BOD=(8.8−4.8)/.10=40 mg/L. 🇵🇭 DO drop in diluted bottle must be divided by sample fraction.\",\"difficulty\":\"Medium\"},{\"n\":83,\"topic\":\"J\",\"q\":\"Two BOD bottles show the same 5 mg/L DO drop. Bottle A contains 10% sample; Bottle B contains 5% sample. Which original sample has the larger calculated BOD?\",\"options\":[\"A\",\"B\",\"They are equal\",\"Cannot compare\"],\"answer\":1,\"explanation\":\"BOD=DO drop/P. Smaller dilution fraction gives larger recovered sample concentration: 5/.05=100 vs 5/.10=50 mg/L. 🇵🇭 Same drop pero mas diluted → mas strong ang original sample.\",\"difficulty\":\"Medium\"},{\"n\":84,\"topic\":\"J\",\"q\":\"A contaminant concentration exceeds its drinking-water MCL. What does MCL mean in the chapter review?\",\"options\":[\"A legal contaminant limit\",\"A recommended pump speed\",\"A flood recurrence interval\",\"A sewer roughness\"],\"answer\":0,\"explanation\":\"MCL is the enforceable maximum contaminant level concept. 🇵🇭 Standard/limit question ito, hindi treatment formula.\",\"difficulty\":\"Medium\"},{\"n\":85,\"topic\":\"D\",\"q\":\"Two hydrant outlets have the same discharge coefficient and pressure, but Outlet B has twice the nozzle diameter. Approximately how does atmospheric discharge compare?\",\"options\":[\"2×\",\"4×\",\"√2×\",\"8×\"],\"answer\":1,\"difficulty\":\"Hard\",\"explanation\":\"Orifice/hydrant discharge is proportional to D²√P. Doubling D gives 4× Q. 🇵🇭 Diameter is squared.\"},{\"n\":86,\"topic\":\"J\",\"q\":\"A positive total-coliform result is followed by a test for E. coli. Why is the second test useful?\",\"options\":[\"E. coli is more specific evidence of fecal contamination\",\"E. coli measures hardness\",\"It gives pump efficiency\",\"It determines CN\"],\"answer\":0,\"explanation\":\"E. coli/fecal indicators are more specific to fecal contamination than total coliform. 🇵🇭 Broad indicator first, more specific fecal indicator next.\",\"difficulty\":\"Medium\"},{\"n\":87,\"topic\":\"J\",\"q\":\"A treatment plant tests six coagulant doses in parallel beakers and compares residual turbidity after settling. What test is this?\",\"options\":[\"Jar test\",\"BOD test\",\"Darcy test\",\"Hazen-Williams test\"],\"answer\":0,\"explanation\":\"The jar test identifies an effective/optimum coagulant dose. 🇵🇭 Different doses + mixing/settling + turbidity = jar test clue.\",\"difficulty\":\"Medium\"},{\"n\":88,\"topic\":\"J\",\"q\":\"An inspector needs a snapshot of river quality at 2:00 PM immediately downstream of an outfall. Which sampling approach fits best?\",\"options\":[\"Grab sample\",\"24-hour composite\",\"Annual maximum series\",\"Unit hydrograph\"],\"answer\":0,\"explanation\":\"A grab sample represents conditions at one time and place. 🇵🇭 Snapshot = grab.\",\"difficulty\":\"Medium\"},{\"n\":89,\"topic\":\"J\",\"q\":\"A permit review needs average wastewater strength over an operating day rather than one instantaneous condition. Which sample is preferable?\",\"options\":[\"Grab\",\"Composite\",\"Single field reading only\",\"Blank\"],\"answer\":1,\"explanation\":\"Composite sampling better represents average conditions/loading over time. 🇵🇭 Average over time = composite.\",\"difficulty\":\"Medium\"},{\"n\":90,\"topic\":\"J\",\"q\":\"Sound intensity is one million times the reference intensity. Using β=10log10(I/I0), what level results?\",\"options\":[\"6 dB\",\"10 dB\",\"60 dB\",\"1,000,000 dB\"],\"answer\":2,\"explanation\":\"β=10log10(10^6)=60 dB. 🇵🇭 Logarithmic scale—hindi direct ratio ang dB.\",\"difficulty\":\"Medium\"},{\"n\":91,\"topic\":\"K\",\"q\":\"Raw water enters a conventional treatment plant. Which process should occur before flocculation?\",\"options\":[\"Coagulation\",\"Disinfection\",\"Final filtration\",\"Activated sludge return\"],\"answer\":0,\"explanation\":\"Conventional sequence: coagulate → flocculate → settle → filter → disinfect. 🇵🇭 Coagulation destabilizes particles before gentle floc growth.\",\"difficulty\":\"Medium\"},{\"n\":92,\"topic\":\"K\",\"q\":\"A clarifier treats 9,000 m³/d. If the allowable overflow rate is 25 m/d, what minimum surface area is required?\",\"options\":[\"225 m²\",\"360 m²\",\"625 m²\",\"9,025 m²\"],\"answer\":1,\"explanation\":\"As=Q/vo=9000/25=360 m². 🇵🇭 Reverse overflow-rate problem: area ang unknown.\",\"difficulty\":\"Medium\"},{\"n\":93,\"topic\":\"K\",\"q\":\"Two clarifiers have equal volume but Clarifier B receives twice the flow. How does ideal detention time compare?\",\"options\":[\"B has twice the time\",\"B has half the time\",\"Same time\",\"Cannot compare\"],\"answer\":1,\"explanation\":\"t=V/Q; doubling Q halves detention time. 🇵🇭 More flow through same tank = less residence time.\",\"difficulty\":\"Medium\"},{\"n\":94,\"topic\":\"K\",\"q\":\"A basin holds 1,500 m³ and treats 7,500 m³/d. What is detention time?\",\"options\":[\"0.2 d or 4.8 hr\",\"5 d\",\"0.5 hr\",\"20 hr\"],\"answer\":0,\"explanation\":\"t=V/Q=.2 d=4.8 hr. 🇵🇭 Units follow the flow denominator; convert days to hours if needed.\",\"difficulty\":\"Medium\"},{\"n\":95,\"topic\":\"K\",\"q\":\"A disinfectant residual falls from 2.0 to 1.0 mg/L, but contact time is doubled from 20 to 40 min. What happens to CT?\",\"options\":[\"It halves\",\"It doubles\",\"It remains 40 mg·min/L\",\"It becomes zero\"],\"answer\":2,\"explanation\":\"Initial CT=2×20=40; new CT=1×40=40 mg·min/L. 🇵🇭 Product ang CT, kaya puwedeng compensate ang C at t.\",\"difficulty\":\"Medium\"},{\"n\":96,\"topic\":\"K\",\"q\":\"Under Stokes-law conditions, particle diameter is tripled while fluid properties remain the same. How does settling velocity change?\",\"options\":[\"3×\",\"6×\",\"9×\",\"27×\"],\"answer\":2,\"explanation\":\"vs∝d², so 3²=9. 🇵🇭 Diameter squared ang relationship.\",\"difficulty\":\"Medium\"},{\"n\":97,\"topic\":\"K\",\"q\":\"A sedimentation designer increases basin depth but keeps surface area and flow unchanged. Which listed performance parameter Q/As remains unchanged?\",\"options\":[\"Overflow rate\",\"Detention time\",\"Basin volume\",\"Water depth\"],\"answer\":0,\"explanation\":\"Overflow rate depends on Q and plan surface area, not depth. Detention time would increase because volume increases. 🇵🇭 Distinguish surface loading from residence time.\",\"difficulty\":\"Medium\"},{\"n\":98,\"topic\":\"K\",\"q\":\"An activated-sludge basin receives Q=4,000 m³/d at S0=0.25 kg/m³. Basin volume is 2,000 m³ and X=2 kg/m³. What is F/M?\",\"options\":[\"0.125 d⁻¹\",\"0.25 d⁻¹\",\"0.50 d⁻¹\",\"2.0 d⁻¹\"],\"answer\":1,\"explanation\":\"F/M=QS0/(VX)=4000(.25)/(2000×2)=.25 d⁻¹. 🇵🇭 Food load divided by microorganism mass.\",\"difficulty\":\"Medium\"},{\"n\":99,\"topic\":\"K\",\"q\":\"Water has total hardness 150 mg/L as CaCO3 and alkalinity 90 mg/L as CaCO3. What carbonate hardness is used in the review?\",\"options\":[\"60 mg/L\",\"90 mg/L\",\"150 mg/L\",\"240 mg/L\"],\"answer\":1,\"explanation\":\"CH=min(TH,Alk)=90 mg/L as CaCO3. 🇵🇭 Carbonate hardness cannot exceed either total hardness or alkalinity.\",\"difficulty\":\"Medium\"},{\"n\":100,\"topic\":\"K\",\"q\":\"A filter bank treats 18,000 m³/d over 450 m². One-third of the filter area is taken offline while total flow remains unchanged. What happens to filter loading rate?\",\"options\":[\"It decreases by one-third\",\"It stays 40 m/d\",\"It rises from 40 to 60 m/d\",\"It rises to 120 m/d\"],\"answer\":2,\"explanation\":\"Original loading=18000/450=40 m/d. Available area=300 m², so new loading=18000/300=60 m/d. 🇵🇭 Same Q through less area → higher surface loading.\",\"difficulty\":\"Hard\"}];\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst topicTagalog={A:'Ulan papuntang runoff: peak flow = Rational; runoff depth = SCS CN. Piliin muna kung peak o volume/depth ang hinihingi.',B:'Kapag open channel, isipin Manning. Kapag flow regime, Froude. Huwag isama ang free surface sa wetted perimeter.',C:'Pump questions: power, operating point, NPSH, at series/parallel. Tandaan: series = dagdag head; parallel = dagdag flow.',D:'Pressurized water pipes: Hazen-Williams. Mas mataas na C = mas makinis = mas maliit ang head loss.',E:'Flood control: storage nagpapababa at nagpapahuli ng peak. Ang 100-year flood ay 1% chance bawat taon.',F:'Stormwater: Rational para peak, Manning para conveyance, storage para detention, at hiwalay ang water-quality volume.',G:'Gravity sewer ay open-channel problem. Tingnan ang Manning, minimum velocity, slope, partial flow, at peaking/I-I.',H:'Groundwater: Darcy muna. Kung actual pore-water speed ang tanong, hatiin ang Darcy velocity sa porosity.',I:'Water quality: mass balance para mixing; BOD at DO ay magkaugnay—mas mataas BOD, mas malakas oxygen demand.',J:'Testing: alamin kung legal limit, indicator organism, BOD/DO test, turbidity/jar test, o sampling method ang tinatanong.',K:'Treatment train: coagulate → flocculate → settle → filter → disinfect. I-match ang formula sa unit process.'};\nlet mastery=JSON.parse(localStorage.getItem('feMastery')||'{}');\nlet answers=JSON.parse(localStorage.getItem('feAnswers')||'{}');\nlet wrongs=JSON.parse(localStorage.getItem('feWrongs')||'[]');\nlet submitted=JSON.parse(localStorage.getItem('feSubmitted')||'{}');\nlet flagged=JSON.parse(localStorage.getItem('feFlagged')||'[]');\nfunction saveState(){localStorage.setItem('feMastery',JSON.stringify(mastery));localStorage.setItem('feAnswers',JSON.stringify(answers));localStorage.setItem('feWrongs',JSON.stringify(wrongs));localStorage.setItem('feSubmitted',JSON.stringify(submitted));localStorage.setItem('feFlagged',JSON.stringify(flagged))}\nfunction mkey(t,n){return t+'|'+n}\nfunction toggleMaster(t,n){let k=mkey(t,n);mastery[k]=!mastery[k];saveState();openTopic(t)}\nfunction masteryStats(){let total=topics.reduce((s,t)=>s+t.formulas.length,0),done=Object.values(mastery).filter(Boolean).length;return {total,done,pct:Math.round(100*done/total)}}\nfunction show(id){['home','topic','formulas','quiz','focusdrill','strategy','calculators','flashcards','mistakes'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id)); $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id)); scrollTo(0,0)}\nfunction diagram(id){const comm
