const topics=[{"id": "A", "title": "10.A Basic Hydrology", "icon": "🌧️", "why": "Convert rainfall into runoff and hydrographs. The book emphasizes the Rational Method for small drainage areas, SCS Curve Number for runoff depth, unit hydrographs for timing, and Horton infiltration.", "important": ["Recognize whether the question asks for peak flow (Rational) or runoff depth (SCS CN).", "Use rainfall intensity at the time of concentration.", "Composite runoff coefficient must be area-weighted.", "Higher CN / more impervious cover means more runoff.", "Unit hydrograph scales linearly; urbanization makes peaks earlier and higher."], "formulas": [["Rational Method", "Q = C i A", "Peak runoff; US: i in in/hr, A in acres → Q ≈ cfs"], ["Composite C", "C = Σ(CⱼAⱼ)/ΣAⱼ", "Mixed land cover"], ["SCS storage", "S = 1000/CN − 10", "S in inches"], ["SCS runoff", "Q = (P − 0.2S)²/(P + 0.8S)", "Use Q=0 if P ≤ 0.2S"], ["Lag", "tlag = 0.6 tc", "Watershed response delay"], ["Time to peak", "tp = D/2 + tlag", "Unit hydrograph"], ["Triangular UH peak", "Qp = 484 A Q/tp", "A mi², Q in, tp hr, Qp cfs"], ["Horton infiltration", "f = fc + (f0 − fc)e^(−kt)", "Capacity decays toward fc"]], "example": {"q": "A 12-acre site has C=0.55 and i=2.5 in/hr. Find peak runoff.", "steps": ["Identify peak runoff → use Rational Method.", "Q = CiA = 0.55×2.5×12.", "Q = 16.5 cfs."], "tip": "Do not convert acres to ft² when using the book's US Rational form."}}, {"id": "B", "title": "10.B Basic Hydraulics", "icon": "🌊", "why": "Open-channel flow, flow regime, energy, weirs, and Bernoulli. Manning and Froude are the headline tools.", "important": ["Hydraulic radius is area divided by wetted perimeter; exclude free surface.", "Manning: larger n means lower velocity.", "Critical flow has Fr=1 and minimum specific energy.", "Normal depth generally requires trial/iteration.", "For pressure-pipe energy problems, combine Bernoulli with continuity and head loss."], "formulas": [["Manning velocity", "V = (k/n)R^(2/3)S^(1/2)", "k=1.486 US, 1.0 SI"], ["Discharge", "Q = VA", "Continuity"], ["Hydraulic radius", "R = A/P", "P = wetted perimeter"], ["Specific energy", "E = y + V²/(2g)", "Open channel"], ["Critical depth", "yc = (q²/g)^(1/3)", "Rectangular; q=Q/b"], ["Froude", "Fr = V/√(gD)", "<1 subcritical; >1 supercritical"], ["Rectangular weir", "Q = (2/3)Cd√(2g)LH^(3/2)", "Sharp-crested"], ["Bernoulli + loss", "P1/γ+z1+V1²/2g = P2/γ+z2+V2²/2g+hf", "Add pump/turbine heads as needed"]], "example": {"q": "A 3 m wide rectangular channel flows 1.2 m deep. Find R.", "steps": ["A=by=3×1.2=3.6 m².", "P=b+2y=3+2.4=5.4 m.", "R=A/P=3.6/5.4=0.667 m."], "tip": "The top water surface is not part of wetted perimeter."}}, {"id": "C", "title": "10.C Pumps", "icon": "⚙️", "why": "Pump power, system curves, NPSH/cavitation, series/parallel pumps, and affinity laws.", "important": ["Input power is water power divided by efficiency.", "Operating point is where pump curve intersects system curve.", "NPSHA must exceed NPSHR to avoid cavitation.", "Series adds head; parallel adds flow.", "Affinity: Q∝N, h∝N², P∝N³."], "formulas": [["Pump input power", "P = γQh/η", "SI gives watts"], ["System curve", "hsys = hstatic + KQ²", "Static + friction"], ["NPSH available", "NPSHA = (patm−pv)/γ − zs − hf", "Book form for suction system"], ["Affinity flow", "Q2/Q1=N2/N1", "Same impeller"], ["Affinity head", "h2/h1=(N2/N1)²", "Speed change"], ["Affinity power", "P2/P1=(N2/N1)³", "Speed change"]], "example": {"q": "Pump: Q=0.04 m³/s, h=25 m, η=0.75. Find input power.", "steps": ["Water power = γQh = 9810×0.04×25 = 9810 W.", "Input = 9810/0.75 = 13,080 W.", "≈13.1 kW."], "tip": "Efficiency divides because motor input must exceed useful water power."}}, {"id": "D", "title": "10.D Water Distribution Systems", "icon": "🚰", "why": "Pressurized pipe head loss, series/parallel networks, Hardy Cross concepts, demand, fire flow, storage, and pressure.", "important": ["Hazen-Williams C: larger C means smoother pipe (opposite trend from Manning n).", "Series pipes carry same Q and losses add.", "Parallel branches have equal head loss; flow splits by resistance.", "Design for peak demand / fire conditions, not average only.", "1 psi ≈ 2.31 ft of water head."], "formulas": [["Hazen-Williams velocity", "V = k₁ C R^0.63 S^0.54", "k₁=1.318 US, 0.849 SI"], ["HW head loss (US)", "hf = 4.73 L Q^1.852/(C^1.852 D^4.87)", "Q cfs, L/D ft"], ["Continuity at node", "ΣQin = ΣQout", "Network mass balance"], ["Loop balance", "ΣhL = 0", "Hardy Cross principle"], ["Fire storage", "V = Qfire × duration", "Use consistent units"], ["Pressure head", "h(ft) = 2.31 × psi", "Water"]], "example": {"q": "A zone must provide 1,500 gpm fire flow for 2 hr. Find fire storage.", "steps": ["Convert time: 2 hr = 120 min.", "V = 1500×120 = 180,000 gal."], "tip": "Fire flow is a rate; storage is rate × duration."}}, {"id": "E", "title": "10.E Flood Control", "icon": "🏞️", "why": "Spillways, detention/retention, reservoir routing, levees/floodways, return period and project-life risk.", "important": ["Storage attenuates floods; levees convey rather than store.", "Detention lowers/delays peak but generally passes the storm volume.", "A 100-year flood means 1% annual exceedance probability, not once every century.", "Reservoir routing follows continuity I−O=dS/dt.", "Weir/spillway discharge varies with H^(3/2)."], "formulas": [["Spillway/weir", "Q = C L H^(3/2)", "Book gives C≈3.33 US, 1.84 SI for rectangular weir form"], ["Storage change", "ΔS = (Qin−Qout)Δt", "Simple continuity"], ["Attenuation", "(Qp,in−Qp,out)/Qp,in", "Fraction peak reduction"], ["Annual exceedance", "p = 1/T", "Return period T"], ["Life-cycle risk", "R = 1 − (1 − 1/T)^n", "At least one exceedance in n years"], ["Weibull plotting", "T = (n+1)/m", "m-th largest in n years"]], "example": {"q": "What is the 30-year risk of at least one 100-year flood?", "steps": ["p=1/100=0.01 per year.", "R=1−(0.99)^30.", "R≈0.260 = 26%."], "tip": "Do not use n/T as the exact risk."}}, {"id": "F", "title": "10.F Stormwater", "icon": "🌧️", "why": "Site peak runoff, gutters/inlets/storm sewers, detention storage, and first-flush water-quality BMPs.", "important": ["Rational Method is the peak-flow workhorse for small sites.", "Storm sewer full-pipe hydraulic radius is D/4.", "Maintain self-cleansing velocity and avoid excessive scour velocity.", "Detention storage is area between inflow and outflow hydrographs.", "Peak control and water-quality volume are separate design criteria."], "formulas": [["Peak runoff", "Q = CiA", "Small drainage areas"], ["Gutter flow", "Q = (0.56/n) Sx^(5/3) S^(1/2) T^(8/3)", "Book US gutter form"], ["Storm sewer Manning", "Q = (1.486/n) A R^(2/3) S^(1/2)", "US full pipe; R=D/4"], ["Detention estimate", "Storage ≈ (Qin−Qout)t", "Convert time to seconds for cfs"], ["Volumetric coefficient", "Rv = 0.05 + 0.009I", "I = percent impervious"], ["Water quality volume", "WQv = (P/12)RvA", "P in, A ac → ac-ft"]], "example": {"q": "Qin=14 cfs, allowed Qout=6 cfs for 20 min. Estimate storage.", "steps": ["Excess=8 cfs.", "20 min=1200 s.", "Storage≈8×1200=9,600 ft³."], "tip": "cfs requires seconds, not minutes."}}, {"id": "G", "title": "10.G Collection Systems", "icon": "🕳️", "why": "Sanitary sewer types, gravity sewer Manning design, self-cleansing, partial-flow behavior, I/I, peaking, and manhole/invert slopes.", "important": ["Sanitary and storm systems are kept separate to avoid CSO/plant overload.", "Gravity sewers behave as open channels and use Manning.", "Self-cleansing velocity is about 2 ft/s (0.6 m/s) in the book review.", "At half-full circular flow, R=D/4; velocity equals full-flow velocity at same slope/n, but Q is half.", "I/I adds unwanted flow; Harmon factor peaks sanitary design flow."], "formulas": [["Manning sewer", "V=(k/n)R^(2/3)S^(1/2)", "Gravity sewer"], ["Minimum slope", "S=[Vn/(kR^(2/3))]²", "From Manning for target V"], ["Harmon peak factor", "PF=1+14/(4+√P)", "P in thousands"], ["Peak sanitary flow", "Qpeak=PF×Qavg", "Add I/I as required by problem"], ["Invert drop", "Δz=SL", "Between manholes"]], "example": {"q": "A sewer run is 350 ft at slope 0.005. Find invert drop.", "steps": ["Δz=SL.", "Δz=0.005×350=1.75 ft."], "tip": "Slope is dimensionless drop per length."}}, {"id": "H", "title": "10.H Groundwater", "icon": "💧", "why": "Darcy flow, hydraulic gradient/conductivity, transmissivity, confined/unconfined wells, and aquifer storage.", "important": ["Darcy discharge uses gross area and hydraulic gradient.", "Seepage velocity is Darcy velocity divided by porosity.", "Transmissivity T=Kb includes aquifer thickness.", "Confined Thiem uses linear head difference; unconfined uses squared heads.", "Specific yield governs drained volume in unconfined aquifers."], "formulas": [["Darcy velocity", "v=Ki", "Specific discharge"], ["Darcy discharge", "Q=KiA", "Gross area"], ["Seepage velocity", "vs=v/n", "Actual pore speed"], ["Transmissivity", "T=Kb", "m²/s"], ["Confined Thiem", "Q=2πT(h2−h1)/ln(r2/r1)", "Steady radial flow"], ["Unconfined Thiem", "Q=πK(h2²−h1²)/ln(r2/r1)", "Steady radial flow"], ["Unconfined storage", "V=Sy A Δh", "Specific yield"], ["Confined storage", "V=S A Δh", "Storage coefficient"]], "example": {"q": "K=2×10⁻⁴ m/s, i=0.01, A=50 m². Find Darcy discharge.", "steps": ["Q=KiA.", "Q=2×10⁻⁴×0.01×50=1.0×10⁻⁴ m³/s."], "tip": "Do not omit the hydraulic gradient i."}}, {"id": "I", "title": "10.I Water Quality", "icon": "🧪", "why": "BOD kinetics, dissolved oxygen sag, dilution/mass balance, nutrients, pH/alkalinity, and indicators.", "important": ["BOD5 is only a fraction of ultimate BOD.", "Higher BOD tends to lower DO.", "Mixing concentration is flow-weighted, not simple-average.", "DO deficit D=DOsat−DO; minimum DO corresponds to maximum deficit.", "Phosphorus commonly limits freshwater eutrophication in the book framing."], "formulas": [["BOD exerted", "BODt=BODu(1−e^(−kt))", "First-order"], ["Ultimate from BOD5", "BODu=BOD5/(1−e^(−5k))", "Base e"], ["DO deficit", "D=DOsat−DO", "Oxygen sag"], ["Critical deficit", "Dc=(kd La/kr)e^(−kd tc)", "Book summary form"], ["Mixing", "C=(Q1C1+Q2C2)/(Q1+Q2)", "Conservative mass balance"], ["pH", "pH=−log10[H+]", "Acidity"]], "example": {"q": "2 m³/s at 4 mg/L mixes with 3 m³/s at 10 mg/L. Find mixed concentration.", "steps": ["Use flow-weighted mass balance.", "C=(2×4+3×10)/(2+3)=38/5.", "C=7.6 mg/L."], "tip": "A simple average (7 mg/L) is wrong because the flows differ."}}, {"id": "J", "title": "10.J Testing & Standards", "icon": "🔬", "why": "Drinking-water standards, indicator organisms, BOD/DO tests, turbidity/jar tests, sampling protocols, plus the chapter's air/noise standards review.", "important": ["MCL = legal contaminant limit; primary standards protect health, secondary address aesthetics.", "Total coliform is a broad indicator; fecal coliform/E. coli is more specific to fecal contamination.", "BOD dilution test divides the DO drop by sample fraction.", "Jar test finds optimum coagulant dose by residual turbidity.", "Grab samples are snapshots; composites represent average conditions/load."], "formulas": [["BOD dilution test", "BOD=(DOi−DOf)/P", "P=Vsample/Vbottle"], ["Dilution fraction", "P=Vsample/Vbottle", "Dimensionless"], ["Sound level concept", "β=10 log10(I/I0)", "Included in chapter's air/noise section; use when provided"]], "example": {"q": "20 mL sample diluted to 300 mL; DO falls 8.5→3.5 mg/L. Find BOD5.", "steps": ["P=20/300=0.0667.", "DO drop=5.0 mg/L.", "BOD5=5/0.0667≈75 mg/L."], "tip": "The DO drop is for the diluted bottle; divide by P to recover sample strength."}}, {"id": "K", "title": "10.K Water & Wastewater Treatment", "icon": "🏭", "why": "Treatment train, coagulation/flocculation, sedimentation, filtration/disinfection, activated sludge, and softening.", "important": ["Treatment order: coagulate → flocculate → settle → filter → disinfect.", "Overflow rate uses surface area; detention time uses volume.", "Stokes settling velocity varies with particle diameter squared and assumes laminar settling.", "Disinfection CT is concentration × contact time.", "Activated sludge is biological secondary BOD removal; F/M is a key loading ratio."], "formulas": [["Velocity gradient", "G=√(P/(μV))", "Flocculation mixing"], ["Overflow rate", "vo=Q/As", "Sedimentation surface loading"], ["Detention time", "t=V/Q", "Basin residence time"], ["Stokes settling", "vs=g(ρp−ρ)d²/(18μ)", "Laminar, Re<1"], ["Filter loading", "vf=Q/Af", "Surface loading"], ["Disinfection", "CT=Ct", "mg·min/L"], ["Food/Microorganism", "F/M=QS0/(VX)", "Activated sludge"], ["Weir loading", "Q/Lweir", "Outlet loading"], ["Carbonate hardness", "CH=min(TH,Alk)", "As CaCO3"]], "example": {"q": "A clarifier treats 8,000 m³/d with 400 m² surface area. Find overflow rate.", "steps": ["vo=Q/As.", "vo=8000/400=20 m/d."], "tip": "Overflow rate uses plan surface area, not basin volume."}}]; 
const formulaExamples={
A:{"Rational Method":"C=0.60, i=2.0 in/hr, A=15 ac → Q=0.60(2)(15)=18 cfs.","Composite C":"10 ac pavement C=.90 + 20 ac grass C=.20 → C=(.9×10+.2×20)/30=0.433.","SCS storage":"CN=80 → S=1000/80−10=2.50 in.","SCS runoff":"CN=80 gives S=2.5 in; P=4 in → Q=(4−0.5)²/(4+2)=2.04 in.","Lag":"tc=2.0 hr → tlag=.6(2)=1.2 hr.","Time to peak":"D=1 hr, tlag=1.2 hr → tp=.5+1.2=1.7 hr.","Triangular UH peak":"A=2 mi², runoff depth=1 in, tp=2 hr → Qp=484(2)(1)/2=484 cfs.","Horton infiltration":"f0=3, fc=.5 in/hr, k=1/hr, t=2 hr → f=.5+2.5e⁻²≈.84 in/hr."},
B:{"Manning velocity":"SI: n=.015, R=.60 m, S=.002 → V=(1/.015)(.60)^(2/3)(.002)^.5≈2.12 m/s.","Discharge":"A=2.5 m², V=1.8 m/s → Q=AV=4.5 m³/s.","Hydraulic radius":"Rectangular b=3 m, y=1.2 m → A=3.6, P=5.4, R=.667 m.","Specific energy":"y=1.0 m, V=2 m/s → E=1+4/(2×9.81)=1.204 m.","Critical depth":"q=3 m²/s → yc=(9/9.81)^(1/3)=.972 m.","Froude":"V=2 m/s, hydraulic depth D=1 m → Fr=2/√9.81=.64 → subcritical.","Rectangular weir":"Cd=.62, L=2 m, H=.5 m → substitute in Q=(2/3)Cd√(2g)LH^(3/2) → Q≈1.30 m³/s.","Bernoulli + loss":"Same-diameter reservoirs: z1=20 m, z2=5 m, hf=3 m → available velocity/pump head relation uses 20=5+hf+V²/2g."},

const topicTagalog={A:'Ulan papuntang runoff: peak flow = Rational; runoff depth = SCS CN. Piliin muna kung peak o volume/depth ang hinihingi.',B:'Kapag open channel, isipin Manning. Kapag flow regime, Froude. Huwag isama ang free surface sa wetted perimeter.',C:'Pump questions: power, operating point, NPSH, at series/parallel. Tandaan: series = dagdag head; parallel = dagdag flow.',D:'Pressurized water pipes: Hazen-Williams. Mas mataas na C = mas makinis = mas maliit ang head loss.',E:'Flood control: storage nagpapababa at nagpapahuli ng peak. Ang 100-year flood ay 1% chance bawat taon.',F:'Stormwater: Rational para peak, Manning para conveyance, storage para detention, at hiwalay ang water-quality volume.',G:'Gravity sewer ay open-channel problem. Tingnan ang Manning, minimum velocity, slope, partial flow, at peaking/I-I.',H:'Groundwater: Darcy muna. Kung actual pore-water speed ang tanong, hatiin ang Darcy velocity sa porosity.',I:'Water quality: mass balance para mixing; BOD at DO ay magkaugnay—mas mataas BOD, mas malakas oxygen demand.',J:'Testing: alamin kung legal limit, indicator organism, BOD/DO test, turbidity/jar test, o sampling method ang tinatanong.',K:'Treatment train: coagulate → flocculate → settle → filter → disinfect. I-match ang formula sa unit process.'};

/><rect x="420" y="40" width="100" height="100" rx="10" fill="#173f59"/><path d="M180 90H245M350 90H415" stroke="#44c7f4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="95" fill="#fff">Measure</text><text x="272" y="95" fill="#fff">Treat</text><text x="440" y="95" fill="#fff">Verify</text></svg>`; return common+`<path d="M60 120 Q170 25 290 100 T540 70" fill="none" stroke="#44c7f4" stroke-width="5"/><text x="60" y="155" fill="#fff">Inflow → storage/routing → controlled outflow</text></svg>`}
function home(){let ms=masteryStats();let cards=topics.map(t=>`<div class="card topicCard" onclick="openTopic('${t.id}')"><h3>${t.icon} ${t.title}</h3><div class="muted">${t.why}</div><div class="tag" style="margin-top:10px">${t.formulas.length} core formulas • example for every formula</div></div>`).join(''); $('#home').innerHTML=`<div class="hero"><h1>Water Resources & Environmental Engineering</h1><p>This uploaded chapter is labeled <b>HIGH YIELD</b>: about 10–15 questions and ~11% of the FE Civil exam. The chapter organizes the material into 11 subareas, 10.A–10.K. Use this app to learn the trigger words, choose the formula, work an example, then take the 100-question test.</p><div class="chips"><span class="chip">11 topic modules</span><span class="chip">${topics.reduce((s,t)=>s+t.formulas.length,0)} formula entries</span><span class="chip">100 practice questions</span><span class="chip">Mastery: ${ms.done}/${ms.total} (${ms.pct}%)</span><span class="chip">Worked explanations</span><span class="chip">Built-in calculators</span><span class="chip">Flashcards + mastery tracking</span><span class="chip">Mistake review</span></div></div><div class="grid">${cards}</div>`}
function openTopic(id){let t=topics.find(x=>x.id===id); show('topic'); let jumps=t.formulas.map((f,i)=>`<button onclick="document.getElementById('sf${t.id}${i}').scrollIntoView({behavior:'smooth'})">${f[0]}</button>`).join(''); $('#topic').innerHTML=`<div class="hero"><h1>${t.icon} ${t.title}</h1><p>${t.why}</p><div class="tagalog"><b>🇵🇭 Quick Tagalog explanation:</b> ${topicTagalog[t.id]}</div><div class="subjump">${jumps}</div></div><div class="grid" style="grid-template-columns:1.05fr .95fr"><div class="card"><h3>What the book makes important</h3><ul class="important">${t.important.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Visual memory cue</h3><div class="diagram">${diagram(t.id)}</div></div></div><div class="card" style="margin-top:14px"><h3>Formula Sheet + Example for EVERY Subtopic — ${t.title}</h3><p class="muted">Study each subtopic independently. Mark it mastered only after you can identify when to use it and solve the example without looking.</p>${t.formulas.map((f,i)=>{let k=mkey(t.id,f[0]);return `<div class="formula" id="sf${t.id}${i}"><div class="tag">${f[0]}</div><div class="eq">${f[1]}</div><div class="muted"><b>When to use:</b> ${f[2]}</div><div class="example" style="margin-top:10px"><b>Worked mini-example — ${f[0]}</b><br>${(formulaExamples[t.id]&&formulaExamples[t.id][f[0]])||'Apply the equation using consistent units and solve for the requested unknown.'}</div><div class="master"><button class="${mastery[k]?'done':''}" onclick="toggleMaster('${t.id}',${JSON.stringify(f[0]).replace(/"/g,'&quot;')})">${mastery[k]?'✓ Mastered':'○ Mark mastered'}</button></div></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>Worked FE-style Example</h3><div class="example"><b>${t.example.q}</b><div class="steps">${t.example.steps.map(s=>`<div>${s}</div>`).join('')}</div><div style="color:#ffda7b;margin-top:8px">⚠ Trap alert: ${t.example.tip}</div></div></div>`}
function formulas(){let rows=topics.flatMap(t=>t.formulas.map(f=>({t:t.title,...{name:f[0],eq:f[1],use:f[2]}}))); $('#formulas').innerHTML=`<div class="hero"><h1>📐 Formula Bank</h1><p>Search by formula, variable, or application. First identify the topic, then pull the headline equation.</p><input id="fsearch" class="search" placeholder="Try: Manning, BOD, storage, groundwater, weir..."></div><div id="frows"></div>`; let render=()=>{let q=$('#fsearch').value.toLowerCase();$('#frows').innerHTML=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<div class="formula"><div class="tag">${r.t} • ${r.name}</div><div class="eq">${r.eq}</div><div class="muted">${r.use}</div></div>`).join('')}; $('#fsearch').oninput=render;render()}
let testIndex=0,testReveal=false,testFilter='all',testOrder='normal',testRanks={};
function quiz(){
  $('#quiz').innerHTML=`<div class="hero"><h1>🧠 100-Question FE-Style Test</h1><p><b>One question at a time.</b> Solve it first, select your answer, then reveal the correct answer and explanation. This replaces the old long 100-question page and the separate duplicate flashcard tab.</p><div class="notice focus"><b>FE routine:</b> ① Identify the topic → ② choose the formula/concept → ③ check units → ④ solve → ⑤ select an answer → ⑥ reveal the explanation.</div><div class="quizTop" style="margin-top:12px"><select id="qfilter" class="btn secondary" onchange="testFilter=this.value;testIndex=0;testReveal=false;renderTestCard()"><option value="all">All 100 questions</option>${topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><button class="btn secondary" onclick="shuffleTest()">🔀 Shuffle</button><button class="btn secondary" onclick="startTestOver()">↺ Start Over</button><span id="score"></span></div><div class="progress"><i id="prog"></i></div></div><div id="qlist"></div>`;
  $('#qfilter').value=testFilter; renderTestCard();
}
function testArray(){let a=questions.filter(q=>testFilter==='all'||q.topic===testFilter);if(testOrder==='shuffle')a=[...a].sort((x,y)=>(testRanks[x.n]||0)-(testRanks[y.n]||0));return a}
function shuffleTest(){testRanks={};questions.forEach(q=>testRanks[q.n]=Math.random());testOrder='shuffle';testIndex=0;testReveal=false;renderTestCard()}
function selectTestAnswer(n,i){answers[n]=i;saveState();renderTestCard()}
function renderTestCard(){
 let a=testArray(); if(!a.length){$('#qlist').innerHTML='<div class="card">No questions in this topic.</div>';return}
 testIndex=Math.max(0,Math.min(testIndex,a.length-1)); let q=a[testIndex], chosen=answers[q.n], t=topics.find(x=>x.id===q.topic);
 let answered=a.filter(x=>answers[x.n]!==undefined).length, correct=a.filter(x=>answers[x.n]===x.answer).length;
 if($('#prog'))$('#prog').style.width=(100*answered/a.length)+'%';
 if($('#score'))$('#score').innerHTML=`<span class="score">Answered ${answered}/${a.length}</span>`;
 let options=q.options.map((o,i)=>{let cls='opt'+(chosen===i?' sel':'');if(testReveal&&i===q.answer)cls+=' correct';if(testReveal&&chosen===i&&i!==q.answer)cls+=' wrong';return `<button class="${cls}" onclick="selectTestAnswer(${q.n},${i})">${String.fromCharCode(65+i)}. ${o}</button>`}).join('');
 let result=testReveal?`<div class="explain"><div class="notice ${chosen===q.answer?'good':'focus'}"><b>${chosen===undefined?'Correct answer':chosen===q.answer?'✓ Correct':'✗ Review this one'}: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b></div><div class="example" style="margin-top:12px"><b>Explanation</b><br>${q.explanation}</div><p class="muted"><b>FE habit:</b> Identify the clue that points to this equation/concept and verify the units before calculating.</p></div>`:'';
 $('#qlist').innerHTML=`<div class="card qcard" style="min-height:430px"><div class="tag">Question ${q.n} • ${t?t.title:'Topic 10.'+q.topic} • ${q.difficulty}</div><h2 style="margin:18px 0">${q.q}</h2><div style="display:grid;gap:10px">${options}</div>${result}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="prevTest()">← Previous</button><button class="btn" onclick="testReveal=!testReveal;if(testReveal&&answers[${q.n}]!==${q.answer}&&!wrongs.includes(${q.n}))wrongs.push(${q.n});saveState();renderTestCard()">${testReveal?'Hide Answer':'Reveal Answer'}</button><button class="btn secondary" onclick="nextTest()">Next →</button><span class="chip">${testIndex+1}/${a.length}</span><span class="chip">Correct so far: ${correct}</span></div>`;
}
function prevTest(){let a=testArray();if(!a.length)return;testIndex=(testIndex-1+a.length)%a.length;testReveal=false;renderTestCard()}
function nextTest(){let a=testArray();if(!a.length)return;testIndex=(testIndex+1)%a.length;testReveal=false;renderTestCard()}
function startTestOver(){testIndex=0;testReveal=false;renderTestCard()}
function resetQuiz(){if(confirm('Clear all saved test answers?')){answers={};wrongs=[];saveState();testIndex=0;testReveal=false;quiz()}}
function calculators(){const calcs=[
['Rational Method Q=CiA',[['C','Runoff coefficient'],['i','Intensity (in/hr)'],['A','Area (acres)']],v=>['Q',v.C*v.i*v.A,'cfs']],
['SCS Curve Number Runoff',[['CN','Curve number'],['P','Rainfall P (in)']],v=>{let S=1000/v.CN-10,Q=v.P<=.2*S?0:(v.P-.2*S)**2/(v.P+.8*S);return ['Q',Q,'in (S='+S.toFixed(3)+' in)']}],
['Manning Velocity (US)',[['n','Manning n'],['R','Hydraulic radius R (ft)'],['S','Slope S']],v=>['V',(1.486/v.n)*v.R**(2/3)*Math.sqrt(v.S),'ft/s']],
['Froude Number',[['V','Velocity'],['D','Hydraulic depth'],['g','g (32.2 US or 9.81 SI)','32.2']],v=>{let x=v.V/Math.sqrt(v.g*v.D);return ['Fr',x,x<1?'subcritical':x>1?'supercritical':'critical']}],
['Pump Input Power (SI)',[['Q','Flow Q (m³/s)'],['h','Head h (m)'],['eta','Efficiency η (decimal)']],v=>['P',9810*v.Q*v.h/v.eta/1000,'kW']],
['Flood Life-Cycle Risk',[['T','Return period T (yr)'],['n','Project life n (yr)']],v=>['R',100*(1-(1-1/v.T)**v.n),'%']],
['Detention Storage',[['Qin','Inflow (cfs)'],['Qout','Outflow (cfs)'],['t','Duration (min)']],v=>['ΔS',(v.Qin-v.Qout)*v.t*60,'ft³']],
['Darcy Flow',[['K','Hydraulic conductivity K'],['i','Gradient i'],['A','Area A']],v=>['Q',v.K*v.i*v.A,'consistent flow units']],
['Flow-Weighted Mixing',[['Q1','Q₁'],['C1','C₁'],['Q2','Q₂'],['C2','C₂']],v=>['Cmix',(v.Q1*v.C1+v.Q2*v.C2)/(v.Q1+v.Q2),'concentration units']],
['BOD Dilution Test',[['DOi','Initial DO'],['DOf','Final DO'],['Vs','Sample volume (mL)'],['Vb','Bottle volume (mL)','300']],v=>['BOD',(v.DOi-v.DOf)/(v.Vs/v.Vb),'mg/L']],
['Clarifier Overflow Rate',[['Q','Flow Q'],['A','Surface area As']],v=>['v₀',v.Q/v.A,'Q/area units']]
];$('#calculators').innerHTML=`<div class="hero"><h1>🧮 FE Formula Calculators</h1><p>Use these to check your hand calculations. On the FE exam, still identify the equation and units yourself first.</p><div class="notice">These calculators implement formulas already included in the uploaded chapter review. They are study/check tools, not a substitute for unit analysis.</div></div><div class="calcgrid">${calcs.map((c,ci)=>`<div class="card"><h3>${c[0]}</h3>${c[1].map(x=>`<div class="field"><label>${x[1]}</label><input id="c${ci}_${x[0]}" type="number" step="any" value="${x[2]||''}"></div>`).join('')}<button class="btn" onclick="runCalc(${ci})">Calculate</button><div id="cr${ci}" class="result hidden"></div></div>`).join('')}</div>`;window._calcs=calcs}
function runCalc(i){let c=window._calcs[i],v={};c[1].forEach(x=>v[x[0]]=parseFloat($('#c'+i+'_'+x[0]).value));if(Object.values(v).some(Number.isNaN)){alert('Enter all values.');return}let r=c[2](v),el=$('#cr'+i);el.classList.remove('hidden');el.innerHTML=`<b>${r[0]} = ${Number.isFinite(r[1])?Number(r[1].toFixed(4)):r[1]} ${r[2]}</b>`}
let flashIndex=0,flashBack=false;

function flashcards(){let cards=topics.flatMap(t=>t.formulas.map(f=>({topic:t.title,name:f[0],eq:f[1],use:f[2],ex:(formulaExamples[t.id]||{})[f[0]]||'',id:t.id})));window._flash=cards;flashIndex=Math.min(flashIndex,cards.length-1);renderFlash()}
function renderFlash(){let cards=window._flash,c=cards[flashIndex],k=mkey(c.id,c.name);$('#flashcards').innerHTML=`<div class="hero"><h1>🗂️ Formula Flashcards</h1><p>Try to recall the equation and when to use it before flipping the card.</p></div><div class="card flash" onclick="flashBack=!flashBack;renderFlash()">${flashBack?`<div><div class="tag">${c.topic}</div><h2>${c.name}</h2><div class="eq">${c.eq}</div><p>${c.use}</p><div class="example">${c.ex}</div></div>`:`<div><div class="tag">${c.topic}</div><h2>${c.name}</h2><p class="muted">What is the formula? When do you use it?</p><p>Click to reveal</p></div>`}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="flashIndex=(flashIndex-1+window._flash.length)%window._flash.length;flashBack=false;renderFlash()">← Previous</button><button class="btn" onclick="mastery['${k}']=true;saveState();flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()">✓ I know this</button><button class="btn secondary" onclick="flashIndex=(flashIndex+1)%window._flash.length;flashBack=false;renderFlash()">Next →</button><span class="chip">${flashIndex+1}/${cards.length}</span></div>`}
function mistakes(){let arr=questions.filter(q=>wrongs.includes(q.n));$('#mistakes').innerHTML=`<div class="hero"><h1>❌ Mistake Review</h1><p>Questions you missed after grading are saved on this device so you can target weak areas.</p><div class="chips"><span class="chip">${arr.length} saved mistakes</span></div></div>${arr.length?arr.map(q=>`<div class="card qcard"><div class="tag">Question ${q.n} • Topic 10.${q.topic}</div><h3>${q.q}</h3><div class="explain"><b>Correct: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div><button class="btn secondary" style="margin-top:10px" onclick="wrongs=wrongs.filter(x=>x!==${q.n});saveState();mistakes()">Mark reviewed</button></div>`).join(''):`<div class="card"><h3>No saved mistakes yet.</h3><p>Take the quiz and press Grade Test. Missed questions will appear here.</p></div>`}`
}
let focusIndex=0,focusReveal=false,focusFilter='all',focusRandom=null,focusChoice=null;
function focusDrill(){
 $('#focusdrill').innerHTML=`<div class="hero"><h1>🔥 FE Focus Drill</h1><p><b>${focusQuestions.length} additional high-yield FE-style drills</b> covering recognition clues, formulas, unit traps, and common conceptual reversals.</p><div class="notice focus"><b>How to use:</b> Answer first. Then reveal the solution and read the FE Trap before moving on.</div><div class="quizTop" style="margin-top:12px"><select id="ffilter" class="btn secondary" onchange="focusFilter=this.value;focusIndex=0;focusReveal=false;focusRandom=null;focusChoice=null;renderFocusCard()"><option value="all">All Focus questions</option>${topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><button class="btn secondary" onclick="randomFocus()">🎲 Random 10</button><button class="btn secondary" onclick="focusRandom=null;focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()">All Questions</button></div></div><div id="focuslist"></div>`;
 $('#ffilter').value=focusFilter;renderFocusCard();
}
function focusArray(){return focusRandom||focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter)}
function renderFocusCard(){let a=focusArray();if(!a.length){$('#focuslist').innerHTML='<div class="card"><h3>No Focus Drill questions found for this filter.</h3></div>';return}focusIndex=Math.max(0,Math.min(focusIndex,a.length-1));let q=a[focusIndex];let opts=q.o.map((x,i)=>{let cls='opt'+(focusChoice===i?' sel':'');if(focusReveal&&i===q.a)cls+=' correct';if(focusReveal&&focusChoice===i&&i!==q.a)cls+=' wrong';return `<button class="${cls}" onclick="focusChoice=${i};renderFocusCard()">${String.fromCharCode(65+i)}. ${x}</button>`}).join('');let sol=focusReveal?`<div class="whybox"><div class="notice good"><b>Correct Answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b></div><div class="example" style="margin-top:12px"><b>Solution / Why</b><br>${q.e}</div><div class="notice focus" style="margin-top:12px"><b>⚠ FE Trap:</b> ${q.trap}</div></div>`:'';$('#focuslist').innerHTML=`<div class="card qcard" style="min-height:400px"><div class="tag">FE Focus • Topic 10.${q.topic} • ${q.sub}</div><h2 style="margin:18px 0">${q.q}</h2><div style="display:grid;gap:10px">${opts}</div>${sol}</div><div class="barrow" style="margin-top:12px"><button class="btn secondary" onclick="prevFocus()">← Previous</button><button class="btn" onclick="focusReveal=!focusReveal;renderFocusCard()">${focusReveal?'Hide Solution':'Reveal Solution'}</button><button class="btn secondary" onclick="nextFocus()">Next →</button><span class="chip">${focusIndex+1}/${a.length}</span></div>`}
function prevFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex-1+a.length)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}
function nextFocus(){let a=focusArray();if(!a.length)return;focusIndex=(focusIndex+1)%a.length;focusReveal=false;focusChoice=null;renderFocusCard()}
function randomFocus(){let base=focusQuestions.filter(q=>focusFilter==='all'||q.topic===focusFilter);focusRandom=[...base].sort(()=>Math.random()-.5).slice(0,Math.min(10,base.length));focusIndex=0;focusReveal=false;focusChoice=null;renderFocusCard()}
function strategy(){$('#strategy').innerHTML=`<div class="hero"><h1>🎯 FE Exam Strategy for This Chapter</h1><p>The chapter's own organizing idea is powerful: <b>name the topic, then pull its one formula.</b></p></div><div class="grid"><div class="card"><h3>1. Trigger words</h3><p><b>Peak runoff</b> → Rational. <b>Runoff depth/CN</b> → SCS. <b>Open channel/sewer</b> → Manning. <b>Flow regime</b> → Froude. <b>Pump input</b> → γQh/η. <b>Groundwater</b> → Darcy. <b>Organic oxygen demand</b> → BOD.</p></div><div class="card"><h3>2. Unit traps</h3><p>Rational US form uses acres + in/hr → cfs. Detention with cfs needs seconds. Triangular hydrograph uses mi²/in/hr. Pump SI with γ=9810 N/m³ gives watts. Full circular pipe R=D/4.</p></div><div class="card"><h3>3. Direction checks</h3><p>Higher Manning n → slower. Higher Hazen-Williams C → smoother/faster. Higher CN/C → more runoff. Higher BOD → lower DO. Input pump power > water power.</p></div></div><div class="card" style="margin-top:14px"><h3>Recommended review loop</h3><p>Read one topic → memorize only its trigger + formula → solve its worked example without looking → answer that topic's quiz questions → review every trap you missed. Do not try to memorize the entire chapter as one formula sheet.</p></div>`}
$$('#nav button').forEach(b=>b.onclick=()=>{show(b.dataset.view); if(b.dataset.view==='home')home();if(b.dataset.view==='formulas')formulas();if(b.dataset.view==='quiz')quiz();if(b.dataset.view==='focusdrill')focusDrill();if(b.dataset.view==='strategy')strategy();if(b.dataset.view==='calculators')calculators();if(b.dataset.view==='flashcards')flashcards();if(b.dataset.view==='mistakes')mistakes()});
$('#topicnav').innerHTML=topics.map(t=>`<button onclick="openTopic('${t.id}')">${t.icon} ${t.title}</button>`).join('');home();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
