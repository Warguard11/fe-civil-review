</style></head><body><div class="top"><div class="brand">FE CIVIL REVIEW</div><button id="tw" class="tab active" onclick="showTab('water')">💧 Water Resources</button><button id="tm" class="tab" onclick="showTab('materials')">🧱 Materials</button><button id="ts" class="tab" onclick="showTab('structural')">🏗️ Structural</button></div><iframe id="water" class="frame active"></iframe><iframe id="materials" class="frame"></iframe><iframe id="structural" class="frame"></iframe><button class="audioBtn" onclick="toggleAudioPanel()">🔊 Audio Discussion</button><div id="audioPanel" class="audioPanel"><h3>🎧 Audio Discussion Mode</h3><small>Teacher-style pacing for listening while you work. Choose the current lesson, flashcards, or 100-question test.</small><div class="row"><select id="audioMode"><option value="screen">Current screen</option><option value="flash">Flashcards</option><option value="test">100 Questions</option></select><select id="audioRate"><option value="0.68">Relaxed 0.68×</option><option value="0.78" selected>Discussion 0.78×</option><option value="0.9">Normal 0.90×</option></select></div><div class="row"><button class="primary" onclick="audioRead()">▶ Start discussion</button><button onclick="speechSynthesis.pause()">⏸ Pause</button><button onclick="speechSynthesis.resume()">⏯ Resume</button><button onclick="audioStop()">⏹ Stop</button></div><div class="row"><button id="autoBtn" onclick="toggleAuto()">🔁 Auto advance: OFF</button></div><div id="audioStatus" class="audioStatus">Ready</div></div><script>let audioAuto=false,audioTimer=null;function toggleAudioPanel(){document.getElementById('audioPanel').classList.toggle('show')}function activeFrame(){return document.querySelector('.frame.active')}function audioStop(){audioAuto=false;clearTimeout(audioTimer);speechSynthesis.cancel();let b=document.getElementById('autoBtn');if(b)b.textContent='🔁 Auto advance: OFF';document.getElementById('audioStatus').textContent='Stopped'}function toggleAuto(){audioAuto=!audioAuto;document.getElementById('autoBtn').textContent='🔁 Auto advance: '+(audioAuto?'ON':'OFF');if(audioAuto)audioRead()}function cleanSpeak(t){t=(t||'');t=t.replace(/\b(?:10|11|12)\s*\.\s*[A-K]\b\s*[-–—:]?\s*/gi,'');t=t.replace(/\bBasic\s+Hydrology\b\s*[-–—:]?\s*/gi,'');t=t.replace(/\bBasic\s+Hydraulics\b\s*[-–—:]?\s*/gi,'');t=t.replace(/\b(?:Subarea|Scope|Section)\s+\d{1,2}\s*[.\-]\s*[A-K]\b[:\-]?/gi,'');t=t.replace(/\b\d{1,2}\s*[.\-]\s*[A-K]\b[:\-]?/gi,'');return t.replace(/\s+/g,' ').replace(/([.!?])\s*/g,'$1   ').trim()}function visibleStudySection(doc){
  const secs=[...doc.querySelectorAll('main section, section')].filter(el=>{const cs=doc.defaultView.getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&el.offsetParent!==null});
  return secs.find(el=>el.id==='topic')||secs.find(el=>el.id==='flashcards')||secs.find(el=>el.id==='test')||secs[0]||doc.querySelector('main')||doc.body;
}
function stripForAudio(el){
  const c=el.cloneNode(true);
  c.querySelectorAll('.tagalog,[class*=tagalog i],button,input,select,textarea,.subjump,.nav,.side,.footer,script,style').forEach(x=>x.remove());
  return c;
}
function discussionFromSection(doc){
  const src=stripForAudio(visibleStudySection(doc));
  const title=(src.querySelector('h1,h2,h3')?.innerText||'this topic').replace(/\b\d{1,2}\s*[.\-]\s*[A-K]\b[:\-]?/gi,'').trim();
  const paras=[...src.querySelectorAll('.hero p,p')].map(x=>x.innerText.trim()).filter(Boolean).slice(0,3);
  const important=[...src.querySelectorAll('.important li, ul li')].map(x=>x.innerText.trim()).filter(Boolean).slice(0,8);
  const heads=[...src.querySelectorAll('h3,h4')].map(x=>x.innerText.trim()).filter(x=>x&&!/tagalog/i.test(x)).slice(0,12);
  let out=`Today we are focusing only on ${title}. `;
  if(paras[0]) out+=`Here is the main idea. ${paras[0]} `;
  if(important.length){out+='The important things to recognize on the FE exam are these. '; important.forEach((x,i)=>out+=`${i+1}. ${x}. `)}
  const text=src.innerText.replace(/🇵🇭[^\n]*/gi,'').replace(/Quick Tagalog explanation:[^\n]*/gi,'');
  const formulaLines=text.split('\n').map(x=>x.trim()).filter(x=>x&&(/[=]/.test(x)||/formula|example|trap|tip|when to use|solution/i.test(x))).slice(0,18);
  if(formulaLines.length){out+='Now let us connect the formulas to the problem-solving process. '; formulaLines.forEach(x=>out+=`${x}. `)}
  out+='When you see a problem from this topic, first identify what quantity is being asked for, then identify the clues in the given information, choose the matching relationship, keep the units consistent, and finally check whether the result is physically reasonable. Do not jump straight into substitution. ';
  return out;
}
function getModeText(doc,mode){let txt='';if(mode==='flash'){let el=doc.querySelector('#flashcards:not(.hidden), [id*=flash i]:not(.hidden)');if(!el)el=visibleStudySection(doc);let c=stripForAudio(el);txt=c.innerText}else if(mode==='test'){let el=doc.querySelector('#test:not(.hidden), [id*=test i]:not(.hidden), [id*=question i]:not(.hidden)');if(!el)el=visibleStudySection(doc);let c=stripForAudio(el);txt=c.innerText}else{txt=discussionFromSection(doc)}return txt.slice(0,9000)}function findNext(doc,mode){let words=mode==='flash'?['next','i know this']:['next question','next'];for(let b of doc.querySelectorAll('button')){let t=(b.innerText||'').toLowerCase();if(words.some(w=>t.includes(w)))return b}return null}function audioRead(){speechSynthesis.cancel();let f=activeFrame(),doc;try{doc=f.contentDocument||f.contentWindow.document}catch(e){}if(!doc){document.getElementById('audioStatus').textContent='Open a subject first.';return}let mode=document.getElementById('audioMode').value,body=getModeText(doc,mode);let intro=mode==='flash'?'':mode==='test'?'Let us work through this FE practice question. Listen for the important clues before choosing an answer. ':'Let us review this topic together. ';let u=new SpeechSynthesisUtterance(cleanSpeak(intro+body));u.rate=parseFloat(document.getElementById('audioRate').value||'.78');u.pitch=.98;let voices=speechSynthesis.getVoices();let v=voices.find(x=>/Samantha|Ava|Jenny|Aria|Google US English/i.test(x.name))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;u.onstart=()=>document.getElementById('audioStatus').textContent='Speaking in discussion mode…';u.onend=()=>{document.getElementById('audioStatus').textContent='Finished';if(audioAuto){let n=findNext(doc,mode);if(n){n.click();audioTimer=setTimeout(audioRead,2200)}}};speechSynthesis.speak(u)}

// AUTO AUDIO MODE SYNC: follow the visible inner tab automatically.
function detectInnerAudioMode(doc){
  try{
    const visible=(el)=>{if(!el)return false;const cs=doc.defaultView.getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&el.offsetParent!==null};
    const flash=doc.querySelector('#flashcards, [id*=flash i]');
    if(flash&&visible(flash)) return 'flash';
    const test=doc.querySelector('#test, [id*=test i], [id*=question i]');
    if(test&&visible(test)) return 'test';
    const activeBtn=[...doc.querySelectorAll('button.active,.nav button.active')].map(b=>(b.innerText||'').toLowerCase()).join(' ');
    if(activeBtn.includes('flash')) return 'flash';
    if(activeBtn.includes('100')||activeBtn.includes('test')||activeBtn.includes('question')) return 'test';
  }catch(e){}
  return 'screen';
}
let __lastAutoAudioMode='';
function syncAudioModeToVisibleTab(){
  const f=activeFrame(); if(!f)return;
  let doc; try{doc=f.contentDocument||f.contentWindow.document}catch(e){return}
  if(!doc)return;
  const mode=detectInnerAudioMode(doc), sel=document.getElementById('audioMode');
  if(sel&&sel.value!==mode) sel.value=mode;
  if(mode!==__lastAutoAudioMode){
    __lastAutoAudioMode=mode;
    const st=document.getElementById('audioStatus');
    if(st) st.textContent=mode==='flash'?'Flashcard audio selected automatically.':mode==='test'?'100-question audio selected automatically.':'Current-topic discussion selected automatically.';
  }
}
setInterval(syncAudioModeToVisibleTab,500);
document.addEventListener('click',()=>setTimeout(syncAudioModeToVisibleTab,80),true);

<script>
/* REBUILT FLASHCARD CONTROLLER — DOM driven; does not replace native Next/Previous/I Know handlers. */
(function(){

  const SYMBOLS=[
    {k:/rational method|q\s*=\s*c\s*i\s*a/i, rows:['C is for runoff coefficient, dimensionless with no unit','i is for rainfall intensity, typically inches per hour in the U.S. customary form','A is for drainage area, typically acres in the U.S. customary form','Q is for peak runoff, typically cubic feet per second'], use:'Use the Rational Method to estimate peak runoff from a relatively small drainage area when a design rainfall intensity and runoff coefficient are known.'},
    {k:/t\s*lag|lag time|0\.6\s*t\s*c/i, rows:['t lag is for watershed lag time, typically minutes or hours','t c is for time of concentration, using the same time unit as t lag','0.6 is an empirical coefficient, dimensionless with no unit'], use:'Use this relationship when estimating watershed lag from the time of concentration in hydrologic runoff or hydrograph calculations.'},
    {k:/manning|q\s*=.*1\.49|q\s*=.*a.*r.*s/i, rows:['Q is for discharge, typically cubic feet per second or cubic meters per second','n is for Manning roughness coefficient, dimensionless in the equation form used','A is for flow area, square feet or square meters','R is for hydraulic radius, equal to flow area over wetted perimeter, feet or meters','S is for energy slope, approximately channel-bed slope for uniform flow, dimensionless'], use:'Use Manning equation for gravity-driven open-channel flow and partially full conduits under approximately uniform-flow conditions.'},
    {k:/hydraulic radius|r\s*=\s*a\s*\/\s*p/i, rows:['R is for hydraulic radius, feet or meters','A is for flow area, square feet or square meters','P is for wetted perimeter, feet or meters'], use:'Use hydraulic radius in open-channel and partially full conduit calculations, especially with Manning equation.'},
    {k:/froude|fr\s*=|v\s*\/\s*sqrt|v\s*\/\s*√/i, rows:['Fr is for Froude number, dimensionless with no unit','V is for mean flow velocity, feet per second or meters per second','g is for gravitational acceleration, feet per second squared or meters per second squared','D is for hydraulic depth, feet or meters'], use:'Use Froude number to classify open-channel flow as subcritical, critical, or supercritical.'},
    {k:/darcy.*weisbach|h\s*f\s*=.*l.*d.*v/i, rows:['h f is for friction head loss, feet or meters','f is for Darcy friction factor, dimensionless','L is for pipe length, feet or meters','D is for pipe diameter, feet or meters','V is for mean velocity, feet per second or meters per second','g is for gravitational acceleration, feet per second squared or meters per second squared'], use:'Use Darcy-Weisbach to calculate friction head loss in pressurized pipe flow.'},
    {k:/hazen.*williams|h\s*f.*c.*d/i, rows:['h f is for friction head loss, feet or meters depending on the equation form','L is for pipe length','Q is for flow rate','C is for Hazen-Williams roughness coefficient, dimensionless','D is for inside pipe diameter'], use:'Use Hazen-Williams for water-distribution pipe head-loss calculations when its empirical assumptions and unit-specific equation form apply.'},
    {k:/pump.*power|p\s*=.*gamma.*q.*h|p\s*=.*γ/i, rows:['P is for pump input power','gamma is for fluid unit weight','Q is for flow rate','H is for total head added by the pump','eta is for pump efficiency, dimensionless'], use:'Use pump-power relationships to estimate the power required to deliver a specified flow against a specified head while accounting for efficiency.'},
    {k:/darcy.*ground|q\s*=.*k.*i.*a|groundwater/i, rows:['Q is for groundwater discharge, volume per time','K is for hydraulic conductivity, length per time','i is for hydraulic gradient, dimensionless','A is for cross-sectional flow area, area units'], use:'Use Darcy law for laminar groundwater flow through porous media when hydraulic conductivity and gradient are known.'},
    {k:/stress|sigma|σ\s*=\s*p\s*\/\s*a/i, rows:['sigma is for normal stress, force per unit area such as psi, ksi, or pascals','P is for axial force, pounds, kips, or newtons','A is for cross-sectional area, square inches, square feet, or square meters'], use:'Use normal stress to evaluate the average axial stress in a member subjected to a centric axial load.'},
    {k:/strain|epsilon|ε\s*=|delta.*l|Δ.*L/i, rows:['epsilon is for normal strain, dimensionless with no unit','delta is for change in length, using a length unit','L is for original length, using the same length unit as delta'], use:'Use strain to measure deformation relative to the original member length.'},
    {k:/hooke|sigma.*e.*epsilon|σ.*E.*ε/i, rows:['sigma is for normal stress','E is for modulus of elasticity, same stress unit as sigma','epsilon is for normal strain, dimensionless'], use:'Use Hooke law in the linear-elastic range to relate stress and strain.'},
    {k:/thermal.*expansion|delta.*alpha.*l.*delta.*t|α.*ΔT/i, rows:['delta is for change in length','alpha is for coefficient of thermal expansion, inverse temperature such as per degree Fahrenheit or per degree Celsius','L is for original length','delta T is for temperature change, degrees Fahrenheit or degrees Celsius consistent with alpha'], use:'Use thermal expansion to estimate free length change caused by a temperature change.'},
    {k:/water.*cement|w\s*\/\s*c|w\/c/i, rows:['w is for mass of mixing water','c is for mass of cementitious material','w over c is the water-cement ratio, dimensionless when both masses use the same unit'], use:'Use the water-cement ratio when evaluating or proportioning concrete because it strongly affects strength and durability.'},
    {k:/air void|v\s*a|g\s*mb|g\s*mm/i, rows:['V a is for percent air voids in compacted asphalt mixture','G mb is for bulk specific gravity of the compacted mixture, dimensionless','G mm is for theoretical maximum specific gravity, dimensionless'], use:'Use air-void calculations in hot-mix asphalt volumetric evaluation to check the compacted mixture structure.'},
    {k:/euler|p\s*cr|pi.*e.*i.*k.*l|π.*E.*I/i, rows:['P cr is for Euler critical buckling load, force units','E is for modulus of elasticity, stress units','I is for least moment of inertia, length to the fourth power','K is for effective-length factor, dimensionless','L is for unsupported column length'], use:'Use Euler buckling for ideal slender columns in the elastic buckling range.'},
    {k:/axial.*deformation|delta\s*=.*p.*l.*a.*e|pl\/ae/i, rows:['delta is for axial deformation, length units','P is for axial force','L is for member length','A is for cross-sectional area','E is for modulus of elasticity'], use:'Use axial-deformation relationships for prismatic, linearly elastic members subjected to axial load.'},
    {k:/reinforcement ratio|rho|ρ\s*=.*a\s*s.*b.*d/i, rows:['rho is for reinforcement ratio, dimensionless','A s is for area of tensile reinforcement','b is for beam width','d is for effective depth from compression face to tensile steel centroid'], use:'Use reinforcement ratio when evaluating the amount of tensile steel relative to the effective concrete section in reinforced-concrete flexure.'},
    {k:/modulus of elasticity|e\s*=\s*stress|e\s*=\s*σ\s*\/\s*ε/i, rows:['E is for modulus of elasticity, stress units such as psi, ksi, or pascals','sigma is for normal stress, same stress unit as E','epsilon is for normal strain, dimensionless with no unit'], use:'Use this in the linear-elastic range to relate material stiffness, stress, and strain.'},
    {k:/flexural stress|sigma.*m.*c.*i|mc\/i/i, rows:['sigma is for bending stress, force per area','M is for internal bending moment, force times length','c is for distance from the neutral axis to the extreme fiber, length','I is for area moment of inertia, length to the fourth power'], use:'Use the flexure formula for elastic bending stress in beams when linear-elastic beam assumptions apply.'},
    {k:/shear stress|v\s*q\s*\/\s*i\s*t|vq\/it/i, rows:['tau is for shear stress, force per area','V is for internal shear force','Q is for first moment of area about the neutral axis, length cubed','I is for area moment of inertia, length to the fourth power','t is for section width at the point where shear stress is evaluated, length'], use:'Use this to determine transverse shear stress distribution in beam cross sections.'},
    {k:/simply supported.*moment|w.*l.*2.*8|wl²\/8/i, rows:['M max is for maximum bending moment, force times length','w is for uniform load per unit length','L is for beam span, length'], use:'Use this for a simply supported beam carrying a uniform load over the full span.'},
    {k:/simply supported.*deflection|5.*w.*l.*4|384.*e.*i/i, rows:['delta max is for maximum beam deflection, length','w is for uniform load per unit length','L is for span length','E is for modulus of elasticity','I is for area moment of inertia'], use:'Use this for the elastic midspan deflection of a simply supported beam with a full-span uniform load.'},
    {k:/determinacy|m\s*\+\s*r\s*=\s*2\s*j/i, rows:['m is for number of truss members, no unit','r is for number of reaction components, no unit','j is for number of joints, no unit'], use:'Use m plus r equals 2j as a preliminary planar-truss determinacy check, together with a geometric stability check.'},
    {k:/specific gravity|g\s*=|sg\s*=/i, rows:['specific gravity is a ratio of material density or unit weight to the reference fluid value, dimensionless with no unit'], use:'Use specific gravity to compare material density with a reference, commonly water for solids and liquids.'},
    {k:/moisture content|mc\s*=|moisture.*dry/i, rows:['moisture content is the mass of water divided by dry mass, commonly reported as percent','wet mass and dry mass must use the same mass unit'], use:'Use moisture content to quantify water present in aggregates, soil, wood, or other materials relative to dry mass.'},
    {k:/absolute volume|volume.*weight.*specific gravity|w\/.*g.*gamma/i, rows:['V is for absolute volume','W is for material weight','G is for specific gravity, dimensionless','gamma w is for unit weight of water'], use:'Use the absolute-volume method when proportioning concrete ingredients so their individual absolute volumes sum to the required batch volume.'}
  ];
  function frame(){return document.querySelector('.frame.active')}
  function fdoc(){try{let f=frame();return f&&(f.contentDocument||f.contentWindow.document)}catch(e){return null}}
  function flashSec(d){return d&&[...d.querySelectorAll('section')].find(x=>x.id==='flashcards'&&x.offsetParent!==null&&!x.classList.contains('hidden'))}
  function flashCard(d){let s=flashSec(d);return s&&[...s.querySelectorAll('.flash')].find(x=>x.offsetParent!==null)}
  function countdownBox(d){let s=flashSec(d);if(!s)return null;let x=s.querySelector('.fe-card-countdown');if(!x){x=d.createElement('div');x.className='fe-card-countdown';let c=flashCard(d);if(c)c.parentNode.insertBefore(x,c);else s.prepend(x)}return x}
  function setCountdown(d,t){let x=countdownBox(d);if(x){x.textContent=t;x.style.display=t?'block':'none'}}
  function button(d,re){return [...(d?.querySelectorAll('button')||[])].find(b=>re.test((b.innerText||'').trim())&&b.offsetParent!==null)}
  function cancel(){run++;if(timer){clearInterval(timer);timer=null}try{speechSynthesis.cancel()}catch(e){};let x=document.getElementById('flashTimer');if(x)x.textContent='Flashcard countdown: stopped';let d=fdoc();if(d)setCountdown(d,'')}
  function stripScope(t){return (t||'').replace(/\b(?:10|11|12)\s*\.\s*[A-K]\b\s*[-–—:]?\s*/gi,'').replace(/\bBasic Hydrology\b\s*[-–—:]?\s*/gi,'').replace(/\bBasic Hydraulics\b\s*[-–—:]?\s*/gi,'').replace(/\s+/g,' ').trim()}
  function spoken(t){return stripScope(t).replace(/in\/hr/gi,'inches per hour').replace(/ft³\/s|ft3\/s/gi,'cubic feet per second').replace(/m³\/s|m3\/s/gi,'cubic meters per second').replace(/ft\/s²|ft\/s\^2/gi,'feet per second squared').replace(/m\/s²|m\/s\^2/gi,'meters per second squared').replace(/ft\/s/gi,'feet per second').replace(/m\/s/gi,'meters per second').replace(/([A-Za-z0-9)²³]+)\s*\/\s*([A-Za-z0-9(]+)/g,'$1 over $2').replace(/\s+/g,' ').trim()}
  function speak(t,id,done){if(id!==run)return;let u=new SpeechSynthesisUtterance(spoken(t));u.rate=+(document.getElementById('audioRate')?.value||.78);u.pitch=.98;u.onend=()=>{if(id===run&&done)done()};u.onerror=()=>{};speechSynthesis.speak(u)}
  function info(text){return SYMBOLS.find(x=>x.k.test(text||''))}
  function addDetails(d){let c=flashCard(d);if(!c)return;
    // IMPORTANT: details belong on the BACK only. Never expose the answer before reveal.
    if(!c.querySelector('.eq')){let pre=c.querySelector('.fe-symbol-details');if(pre)pre.remove();return}
    let raw=c.innerText||'';let x=info(raw);if(!x)return;let old=c.querySelector('.fe-symbol-details');if(old)return;let box=d.createElement('div');box.className='fe-symbol-details';box.style.cssText='margin:14px auto 4px;max-width:820px;text-align:left;padding:14px 16px;border-radius:12px;background:#eaf4ff;color:#0b2136;border:1px solid #8bc5ff;line-height:1.55';box.innerHTML='<div style="font-weight:900;margin-bottom:7px">What each symbol means</div>'+x.rows.map(r=>'<div style="padding:3px 0">• '+r+'</div>').join('')+'<div style="margin-top:11px;padding:10px 12px;border-radius:10px;background:#f2fff5;border:1px solid #9bd6aa"><b>Where / when to use it:</b> '+x.use+'</div>';c.appendChild(box)}
  function readQuestion(){cancel();let id=run,d=fdoc(),c=flashCard(d);if(!c)return;
    // Read ONLY the active flashcard prompt. Never read topic/scope headings or answers.
    let h=stripScope(c.querySelector('h2')?.innerText||'').trim();
    let eqFront=stripScope(c.querySelector('.eq')?.innerText||'').trim();
    let raw=h||eqFront;
    let q='';
    if(/^(what|which|how|when|where|why|define|identify|calculate|determine)\b/i.test(raw)) q=raw;
    else if(raw) q='What is the formula for '+raw+'? When do you use it?';
    else q='What is the formula? When do you use it?';
    q=stripScope(q).replace(/\bBasic Hydrology\b/gi,'').replace(/\bBasic Hydraulics\b/gi,'').replace(/\s+/g,' ').trim();
    setCountdown(d,'');document.getElementById('audioStatus').textContent='Reading question';speak(q,id,()=>countdown(id))
  }
  let feCountdownAudioCtx=null;
  function countdownBeep(finalBeep=false){
    try{
      let AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      if(!feCountdownAudioCtx)feCountdownAudioCtx=new AC();
      if(feCountdownAudioCtx.state==='suspended')feCountdownAudioCtx.resume();
      let o=feCountdownAudioCtx.createOscillator(),g=feCountdownAudioCtx.createGain();
      o.type='sine';o.frequency.value=finalBeep?880:560;
      g.gain.setValueAtTime(0.0001,feCountdownAudioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(finalBeep?0.14:0.075,feCountdownAudioCtx.currentTime+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,feCountdownAudioCtx.currentTime+(finalBeep?0.18:0.09));
      o.connect(g);g.connect(feCountdownAudioCtx.destination);o.start();o.stop(feCountdownAudioCtx.currentTime+(finalBeep?0.2:0.11));
    }catch(e){}
  }
  function countdown(id){if(id!==run)return;let d=fdoc(),n=10;let show=(beep=true)=>{let msg='Answer reveals in '+n+' seconds';let x=document.getElementById('flashTimer');if(x)x.textContent=msg;setCountdown(d,n>0?'⏱ '+n:'');if(beep&&n>0)countdownBeep(n<=3)};show(true);timer=setInterval(()=>{if(id!==run){clearInterval(timer);timer=null;return}n--;if(n>0){show(true)}else{let x=document.getElementById('flashTimer');if(x)x.textContent='Revealing answer';setCountdown(d,'');countdownBeep(true);clearInterval(timer);timer=null;setTimeout(()=>{if(id===run)revealAndRead(id)},180)}},1000)}
  function revealAndRead(id){if(id!==run)return;let d=fdoc(),c=flashCard(d);if(!c)return;c.click();setTimeout(()=>{if(id!==run)return;addDetails(d);let cc=flashCard(d), ac=cc&&cc.cloneNode(true);if(ac){
      // Answer audio: no scope/topic label and NO mini problem/sample/example.
      ac.querySelectorAll('button,.tag,.example,.mini,.mini-problem,.muted,.pill,[class*=sample i],[class*=example i]').forEach(x=>x.remove())
    }
    let ans=stripScope(ac?.innerText||'').replace(/click to reveal|tap to reveal/gi,'').replace(/\bMini Problem\b[\s\S]*$/i,'').trim();
    document.getElementById('audioStatus').textContent='Reading answer';speak(ans,id,()=>{if(id===run&&flashAuto){let n=button(d,/^next\b/i);if(n){cancel();n.click();setTimeout(()=>{flashAuto=true;readQuestion()},220)}}})},120)}
  const oldAudioRead=window.audioRead;window.audioRead=function(){let d=fdoc();if(flashSec(d)){flashAuto=true;readQuestion();return}cancel();flashAuto=false;return oldAudioRead&&oldAudioRead()};
  const oldStop=window.audioStop;window.audioStop=function(){flashAuto=false;cancel();return oldStop&&oldStop()};
  function hook(){let d=fdoc();if(!d||d.__rebuiltFlashHook)return;d.__rebuiltFlashHook=true;try{d.querySelectorAll('#feAudio,.audioPanel,.audioBtn').forEach(x=>{if(x.id==='feAudio')x.style.display='none'})}catch(e){};
    d.addEventListener('pointerdown',e=>{let b=e.target.closest&&e.target.closest('button');if(!b)return;let t=(b.innerText||'').trim();if(/i\s*know|know\s*this|^next\b|^previous\b|start over/i.test(t)){let keep=flashAuto;cancel();flashAuto=keep}},true);
    d.addEventListener('click',e=>{let b=e.target.closest&&e.target.closest('button');if(!b)return;let t=(b.innerText||'').trim();if(/i\s*know|know\s*this|^next\b|^previous\b|start over/i.test(t)){setTimeout(()=>{addDetails(d);if(flashAuto)readQuestion()},220)}},false);
  }
  setInterval(()=>{hook();let d=fdoc();if(d)addDetails(d)},250);
})();
</script>
